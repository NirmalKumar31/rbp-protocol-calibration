# Continuous integration validates the release on a clean Linux runner.
# scripts/ci_local.sh mirrors these steps for local use and should be updated with this file.
# The paid cloud pipeline is excluded because it requires GCP credentials, a reference genome,
# and the compute budget documented in docs/COST.md. CI instead checks imports, tests, lint,
# offline verification of committed results, release-document consistency, and manuscript
# build integrity.

# Third-party actions are pinned by commit SHA. The comments record the corresponding release.
name: ci

# No job writes to the repository.
permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements-cpu.txt

      # Some modules require a project variable at import time. No step in this job contacts GCS.
      - name: unit tests
        env:
          GOOGLE_CLOUD_PROJECT: ci-no-such-project
          PYTHONPATH: src
        # This job deliberately omits torch. The full-suite job below covers the two modules
        # that require it.
        run: pytest tests/unit -q --ignore=tests/unit/test_models.py --ignore=tests/unit/test_train_folds.py

      # Print the checksum so changes to published reference values are visible in the log.
      - name: golden values checksum
        run: |
          echo "golden.yaml sha256:"
          sha256sum config/golden.yaml
          if git diff --name-only "${{ github.event.before }}" HEAD 2>/dev/null | grep -q '^config/golden.yaml$'; then
            echo "::warning file=config/golden.yaml::A published number changed. The commit message must say which claim moved and why."
          fi

      # Verify that the archive used by the driver VM is importable.
      - name: repo package verifies
        env:
          GOOGLE_CLOUD_PROJECT: ci-no-such-project
        run: PY=python ./cloud/package_repo.sh /tmp/repo.tgz

      # Regenerate the manuscript-number audit before the verifier reads it.
      - name: manuscript numbers trace to a table
        env:
          GOOGLE_CLOUD_PROJECT: ci-no-such-project
          PYTHONPATH: src
        run: python scripts/audit_manuscript.py

      # Verify the committed result tables without credentials or raw data.
      - name: published values verify offline
        env:
          GOOGLE_CLOUD_PROJECT: ci-no-such-project
          PYTHONPATH: src
        run: python scripts/verify.py --local results/tables

      # Derive release metadata and compare it with the published documentation.
      - name: release documents are consistent with the artefacts
        env:
          PYTHONPATH: src
        run: python scripts/release_consistency.py

      # Every committed table must name its producing command.
      - name: every committed table has a producing script
        env:
          PYTHONPATH: src
        run: python scripts/provenance.py --check

      # The generated column dictionary must match the committed tables.
      - name: the column dictionary matches the tables
        env:
          PYTHONPATH: src
        run: python scripts/column_dictionary.py --check

      # These audit commands write three report tables; require their committed copies to agree.
      - name: regenerated artefacts match what is committed
        run: git diff --exit-code -- results/tables/ || {
            echo "::error::A generated table changed. Commit the regenerated file.";
            exit 1; }

      # Regenerate each documented offline output and compare it structurally with its table.
      - name: every --from-cache entry point reproduces its committed table
        env:
          PYTHONPATH: src
        run: python scripts/cache_idempotence.py

  # The full suite installs CPU-only torch so it can collect the model and training tests.
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      # Match the pinned GPU environment; the test suite itself needs only the CPU wheel.
      - name: install with torch
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements-cpu.txt
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.15.1
      - name: full unit suite
        env:
          GOOGLE_CLOUD_PROJECT: ci-no-such-project
          PYTHONPATH: src
        run: pytest tests -q -rs
      # Torch is available here, so every release fact must be derivable.
      - name: release documents, every fact required
        env:
          GOOGLE_CLOUD_PROJECT: ci-no-such-project
          PYTHONPATH: src
        run: python scripts/release_consistency.py --require-all

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: ruff
        run: |
          pip install ruff
          ruff check .
      # Parse every tracked shell script and fail if the file list is unexpectedly empty.
      - name: shell syntax
        run: |
          files=$(git ls-files '*.sh')
          [ -n "$files" ] || { echo "no shell scripts found; this step checked NOTHING"; exit 1; }
          for f in $files; do bash -n "$f" || exit 1; done

  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: texlive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-science lmodern poppler-utils
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: install pypdf
        run: pip install pypdf==6.1.3
      # A hyphen ending a source line splits a word; the PDF can render it as a normal
      # line break, so the source is where the property is decidable.
      - name: manuscript source checks (split words, labels, S-numbers)
        run: python scripts/tex_source_checks.py
      # Check figure geometry and compare tracked PDFs with a clean temporary build.
      - name: no figure draws text on top of text
        run: python scripts/figure_overlap.py
      - name: tracked PDFs are the output of the tracked sources
        run: python scripts/pdf_freshness.py
      # build.sh treats undefined references, citations, and layout overflow as errors.
      - name: paper builds
        run: cd manuscript && ./build.sh
