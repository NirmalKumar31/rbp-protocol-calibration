# Reference values: what a correct run of THIS pipeline produces.
#
# WHAT THIS FILE IS FOR. Stage 14 asserts every published claim against these values with an
# explicit tolerance. A pipeline that runs to completion and quietly produces different
# science is worse than one that crashes, because nobody diffs a plausible table. This file
# is the difference between "the pipeline ran" and "the pipeline is correct".
#
# HOW THESE VALUES WERE ESTABLISHED. From the pipeline's reference run: the first complete
# end-to-end execution, from raw ENCODE peaks to figures, with every stage's inputs and
# outputs recorded in GCS and every task pinned to an image digest. They are not aspirations
# and not literature values -- they are what this code produces on this data.
#
# WHY TOLERANCES AND NOT EQUALITY. Some variation is legitimate and unavoidable:
#
#   * BLAS thread count changes summation order, moving iterative solvers in the last
#     few decimals. The images pin OMP_NUM_THREADS=1 to bound this, not eliminate it.
#   * GPU and CPU inference of the same weights differ. Measured on 19,051 variants scored
#     both ways: max |difference| 1.14e-04, correlation 1.000000.
#   * Bootstrap intervals move with the seed in the third decimal.
#   * A panel restricted to a subset shifts means by up to ~0.01.
#
# Tolerances absorb exactly that much and no more. A change larger than the tolerance is a
# regression, not noise.
#
# WHERE THE CLAIM IS ABOUT A COUNT, THE COUNT IS CHECKED. "Every dataset falls" and "the
# ordering holds" are the assertions the paper actually makes, so they are asserted as
# unanimity and as ordering rather than inferred from two means. R1's gain RATIO is checked
# directly because it is the thesis: if it inverts, the paper is wrong however close the
# individual numbers land.

meta:
  # The reference run of this pipeline. Update ONLY when a change to the science is
  # intended, never to make a failing check pass.
  reference_run: "rbp-repro reference run"
  established: "2026-08"
  # THE PANEL, AND WHY R1's n IS SMALLER THAN THE PANEL.
  #
  # The study runs on 95 datasets. R1 compares the two negative-set arms, so every dataset
  # must exist in BOTH -- and one of the 95, NCBP2:K562, matched only 384 pairs under GC
  # matching against 406 under dinucleotide matching, so it falls below the min_pairs=400
  # floor in one arm and not the other. R1 therefore has n = 94.
  #
  # The stage-7 job is 189 TASKS, not 189 datasets: 95 dinuc + 94 gc. Every dataset is
  # processed once per arm, because one arm alone says nothing about the cost of matching.
  study_panel_n: 95
  r1_panel_n: 94
  stage7_tasks: 189

# --- R1: the negative-set protocol effect ---------------------------------------------
# The headline is the unanimity and the second-order gain, not the drop.
r1_cost_of_matching:
  # RECENTRED on what cost_of_matching.csv actually contains. These read 0.7963 and 0.6893
  # against measured 0.7981 and 0.6886, drift that a 0.015 tolerance absorbed silently -- the
  # same defect as `cost` below, found by cross-checking against the identical quantity now
  # emitted by scripts/scale_check.py from the two rehearsal arms. The two paths are gated
  # separately on purpose: if they ever disagree, one of the tables is stale.
  auroc_gc:        {value: 0.7981, tol: 0.010}
  auroc_dinuc:     {value: 0.6886, tol: 0.010}
  # CENTRED ON WHAT THE PAPER CLAIMS AND ON WHAT THE TABLE CONTAINS, which are the same
  # number. This was {value: -0.1080, tol: 0.012}, split between the 94-dataset study panel
  # (-0.1095) and the full 189-dataset panel (-0.1070) so the tolerance would span both. But
  # verify_r1 reads cost_of_matching.csv, which IS the 94-dataset panel, so the gate was
  # centred 0.0015 away from the only value it can ever see and the abstract's figure sat off
  # centre in its own check. Measured mean -0.1095, bootstrap CI half-width 0.0116.
  cost:            {value: -0.1095, tol: 0.012}
  # A SUPPORTING CHECK, NOT THE HEADLINE, and this block used to contradict itself. It
  # called the gain ratio "the actual finding" while the R4 block said the same comparison
  # must not be the headline, because the composition baseline's features ARE the ones the
  # dinucleotide matcher controls. Both cannot be true. The ratio is kept as a direction
  # check -- if it inverts, something is badly wrong -- but the reported claim is the
  # GC-arm share alone. See r1_headline_is_gc_share_only below.
  #
  # THESE ARE THE NESTED GAINS: composition alone versus composition PLUS the sequence score,
  # which is the rehearsal's delta_auroc and the quantity the claim is about. They were
  # previously the naive difference of two standalone AUROCs (0.0165 -> 0.0597, ratio 3.94),
  # a quantity with no confidence interval and no p-value that nothing in the write-up
  # claims. The nested figures are smaller and better supported, and the conclusion is the
  # same: the gain rises sharply under the harder negative set.
  # TOLERANCE MUST NOT EXCEED THE PUBLISHED INTERVAL. A referee inflated both nested gains by
  # 18% -- moving the headline from +0.0265 to +0.0313, well outside its own published CI of
  # +/-0.0057 -- and this file passed 105/105, because the tolerance was +/-0.008. Scaling both
  # gains preserves their ratio, so `gain_ratio_min` was blind to it too. A gate looser than
  # the interval in the abstract certifies a number the paper does not claim.
  #
  # Set to the bootstrap CI half-width, measured: gain_gc [+0.0212, +0.0325] -> 0.0057,
  # gain_dinuc [+0.0556, +0.0771] -> 0.0107. Rounded up by a hair for BLAS/seed jitter and no
  # further.
  gain_gc:         {value: 0.0265, tol: 0.006}
  gain_dinuc:      {value: 0.0662, tol: 0.011}
  gain_ratio_min:  2.0
  # The nested gain must actually be significant, not merely larger. Without this the ratio
  # could rise because both arms are noise.
  gain_significant_on_min_fraction: 0.80
  # Every dataset must fall. Not "on average".
  fraction_datasets_falling: {value: 1.0, tol: 0.0}
  wilcoxon_p_max: 1.0e-15

# --- R1, continued: is the protocol effect real or an AUROC-scale artefact? ------------
#
# WHY THIS BLOCK EXISTS. R1's headline contrast, +0.0397, was printed in the manuscript and
# existed in NO committed table and under NO golden key. It could not be recomputed and it
# could not fail. `contrast_auroc` below is the first assertion of it in the project's
# history, and it is now derived by `scripts/scale_check.py` from the two rehearsal arms.
#
# THE OBJECTION IT ANSWERS. A nested AUROC gain is compressed when the baseline is already
# high, and the two arms start at 0.7827 and 0.6280. Measured compression factor: 1.51x. So
# the observed direction is predicted by the scale alone, and the claim needs the part that
# is NOT scale. Transplanting the GC arm's own d' increment onto the dinucleotide baseline
# gives the scale-only contrast; what remains is the protocol effect. Measured: 21% scale,
# 79% protocol.
r1_scale_check:
  # WHICH MODEL. The manuscript said "5-mer" four times; both rehearsal tables record k = 4 on
  # all 189 rows. params.yaml's `cv: k: 5` is the CV FOLD COUNT, not the k-mer size. Gated
  # because 150 assertions all checked values and none checked what produced them.
  kmer_k:                {value: 4.0, tol: 0.0}
  # THE SIX CELLS OF R1's HEADLINE TABLE. Printed in the manuscript, computed on the fly and
  # stored in no table until scripts/audit_manuscript.py went looking -- the same state the
  # +0.0397 contrast survived six review rounds in.
  mean_composition_gc:   {value: 0.7827, tol: 0.010}
  mean_composition_dn:   {value: 0.6280, tol: 0.010}
  mean_score_gc:         {value: 0.7981, tol: 0.010}
  mean_score_dn:         {value: 0.6886, tol: 0.010}
  mean_full_gc:          {value: 0.8092, tol: 0.010}
  mean_full_dn:          {value: 0.6941, tol: 0.010}
  contrast_auroc:        {value: 0.0397, tol: 0.004}
  nested_gc:             {value: 0.0265, tol: 0.004}
  nested_dn:             {value: 0.0662, tol: 0.007}
  contrast_scale_only:   {value: 0.0083, tol: 0.002}
  # THE HONEST HEADLINE. If this fails, R1 fails and there is no paper.
  contrast_protocol:     {value: 0.0313, tol: 0.004}
  # THE TRANSPLANT RUNS BOTH WAYS AND ONLY THE FAVOURABLE DIRECTION WAS REPORTED. Moving the
  # dinucleotide arm's increment onto the GC baseline instead attributes MORE to compression and
  # leaves +0.0215. Both directions are legitimate under the same binormal logic, so the honest
  # statement is a RANGE: the protocol effect is +0.0215 to +0.0313, and the choice of direction
  # moves it further than either interval is wide. Every member of the family keeps the sign,
  # which is what the paper now claims.
  contrast_protocol_reverse: {value: 0.0215, tol: 0.004}
  contrast_scale_only_reverse: {value: 0.0182, tol: 0.004}
  contrast_protocol_logit: {value: 0.0288, tol: 0.004}
  contrast_protocol_logit_reverse: {value: 0.0188, tol: 0.004}
  # THE BOUND THE PAPER CLAIMS: every member of the family keeps the sign.
  min_protocol_effect_any_transplant: 0.012
  reverse_ci_must_exclude_zero: true
  protocol_ci_must_exclude_zero: true
  # Scale must be a minority of the effect. Measured 0.21; a run where compression accounts
  # for most of the contrast means the claim is an artefact.
  max_scale_share:       0.35
  # The same comparison on an unbounded scale, which would be zero if compression were the
  # whole story.
  contrast_dprime:       {value: 0.1290, tol: 0.015}
  # The corrected version of the abstract's "hides two-thirds". It is about half.
  hidden_fraction_corrected: {value: 0.4735, tol: 0.05}
  #
  # THE REVERSAL, GATED SO IT CANNOT BE QUIETLY DROPPED. On the log-odds scale the contrast
  # changes sign. That is reported in the paper, not hidden, and these three keys are why it
  # is not fatal: the between-arm coefficient gap tracks each task's TOTAL signal and is
  # uncorrelated with the incremental value it is supposed to measure, which is the standard
  # non-comparability of logistic coefficients across fits (Mood 2010). If the fingerprint
  # ever inverts -- the gap tracking increment rather than total signal -- the reversal
  # becomes real evidence against R1 and this block must fail.
  contrast_logodds:      {value: -0.3771, tol: 0.06}
  min_rho_coef_gap_total:     0.35
  max_rho_coef_gap_increment: 0.25
  contrast_logodds_normalised: {value: 0.1154, tol: 0.035}
  # NOT A SECOND ANSWER TO THE REVERSAL, AND IT WAS PRESENTED AS ONE. The residual is
  # algebraically identical to the normalised contrast above under a positive weight:
  #   residual_i == dfull_gc_i * (coef_dn_i/dfull_dn_i - coef_gc_i/dfull_gc_i)
  # verified at max|diff| 5.0e-16 with sign agreement 94/94. Reporting both as corroborating
  # each other was wrong. Worse, the null coef ~ d' is CHOSEN, not derived: under coef ~ d'^0.5
  # the residual is -0.1721 and under d'^1.5 it is +0.5278, so the sign of the "answer" is a
  # free exponent. Both values stay gated so they cannot drift, but nothing is claimed from
  # them; the load-bearing answer to the reversal is the correlational fingerprint below.
  logodds_scale_null:    {value: -0.4927, tol: 0.040}
  logodds_residual:      {value: 0.1156, tol: 0.035}
  # The exponent sensitivity that retired the argument, gated so the retraction has a source.
  logodds_residual_p05:  {value: -0.1721, tol: 0.040}
  logodds_residual_p15:  {value: 0.5278, tol: 0.060}

# --- R1: does the strand artifact drive the surviving contrast? ------------------------
#
# READ THIS BLOCK AS A RECORD, NOT AS A CLEARANCE. The previous strand block in this file was
# deleted because it gated a retracted quantity behind a ceiling (contrast_rho_max: 0.40) so
# loose that a real confound would have passed it. This block must not repeat that. It pins the
# measured values so they cannot drift, and it asserts only the two things the data actually
# support: that the two halves agree, and that the association is not the known size effect
# relabelled. It does NOT assert that the artifact is harmless, because this test cannot show
# that -- frac_sense spans only 0.433 to 0.615 across the 40 audited datasets, so there is
# almost no leverage, and rho = -0.24 carries an interval of [-0.54, +0.11].
r1_strand_contrast:
  n_datasets:            {value: 40.0, tol: 0.0}
  mean_frac_sense:       {value: 0.5519, tol: 0.010}
  # The contrast on this subset must match the published one, or the 40 are not representative
  # and nothing measured on them transfers.
  contrast_on_subset:    {value: 0.0378, tol: 0.006}
  rho_frac_sense_contrast: {value: -0.2396, tol: 0.05}
  # Size is the one confound already known to move the contrast (rho +0.307 on all 94). If the
  # partial correlation ever diverges sharply from the raw one, the reading changes.
  partial_rho_given_size: {value: -0.2522, tol: 0.05}
  max_raw_partial_gap:   0.10
  # THE ONE REASSURING RESULT, AND IT IS GATED AS SUCH: the sense-rich and sense-poor halves
  # agree, and the difference between them is small against the +0.0397 being defended.
  halves_difference:     {value: -0.0068, tol: 0.006}
  max_abs_halves_difference: 0.020
  halves_ci_must_include_zero: true
  # THE ADVERSE NUMBER, GATED SO IT CANNOT BE DROPPED. A linear extrapolation to fully correct
  # stranding lands at -0.046, i.e. sign reversal, on an interval of [-0.189, +0.072] that is
  # far too wide to act on in either direction. It is recorded because the honest conclusion is
  # "this cannot be settled from committed data", and deleting the number would make the
  # limitation read softer than it is.
  extrapolated_at_full_sense: {value: -0.0458, tol: 0.020}
  # Leverage, asserted so that anyone reading the correlation sees why it is weak.
  max_frac_sense_leverage: 0.25

# --- R1: the strand artifact, measured properly (restriction + matched placebo) ---------
#
# THE PRE-REGISTERED TEST, AND IT PASSED. Fixed before it was run: the contrast
# must keep its sign, its interval must exclude zero, and at least 60% of the published point
# estimate must survive. Result: +0.0318 [+0.0234, +0.0415], 85% surviving.
#
# WHY THE PLACEBO IS THE EXPERIMENT. Keeping only pairs whose negative is unambiguously on its
# own gene's strand discards ~57% of pairs, and a 256-feature k-mer model loses more from that
# than a 19-feature composition baseline does, in BOTH arms. Restriction alone therefore shows
# -0.0091, which a naive reading attributes entirely to strand. Dropping the same number of
# pairs at RANDOM shows -0.0032 of the same shrinkage with no strand involved. The difference,
# -0.0059, is the strand-specific effect.
#
# THE ARTIFACT IS REAL, NOT ABSENT. Its interval excludes zero, so this is a measured control
# rather than a null result, and it is stronger evidence for that reason. It costs ~15% of the
# contrast. An earlier 20-dataset run reported -0.0002 using a dinucleotide arm that was a
# different draw; the canonical tables were fetched (96 MiB, $0.011) and every dataset here is
# gated on reproducing its published row before being used.
r1_strand_placebo:
  n_datasets:            {value: 40.0, tol: 0.0}
  contrast_full:         {value: 0.0378, tol: 0.007}
  contrast_sense_only:   {value: 0.0287, tol: 0.007}
  contrast_placebo:      {value: 0.0338, tol: 0.007}
  contrast_placebo_strat: {value: 0.0342, tol: 0.007}
  change_from_restriction: {value: -0.0091, tol: 0.003}
  change_from_placebo:   {value: -0.0040, tol: 0.002}
  # THE DECOMPOSITION. Restriction alone reports -0.0091 and a naive reading calls all of it
  # strand. A random-drop placebo reproduces -0.0040 of it with no strand involved. What is
  # left is strand: -0.0055, interval clear of zero.
  strand_excess_unstratified: {value: -0.0051, tol: 0.003}
  locus_mix:             {value: 0.0004, tol: 0.0015}
  strand_excess:         {value: -0.0055, tol: 0.003}
  max_abs_strand_excess: 0.010
  # THE ARTIFACT IS REAL, AND THIS ASSERTION HAS BEEN ON AND OFF ONCE ALREADY. With 5 placebo
  # seeds and region-only strata the excess was -0.0036 [-0.0071, +0.0001], the interval
  # touched zero, and the manuscript withdrew the claim. That interval was inflated by Monte
  # Carlo noise: ~16% of its variance was placebo seed variance rather than signal. At 20 seeds
  # and region x gene-density strata the excess is -0.0055 [-0.0089, -0.0022] and the claim is
  # restored. Do not toggle this again without raising the seed count first.
  excess_ci_must_exclude_zero: true
  # THE STRATIFICATION BARELY MATTERS ONCE THE SEEDS ARE ADEQUATE, which is itself worth
  # recording: at 5 seeds the stratified and unstratified placebos differed by -0.0024 with an
  # interval clear of zero, and that gap is now +0.0004 and not distinguishable from zero. The
  # earlier "locus mix" was largely seed noise. Asserted as SMALL, not as nonzero.
  max_abs_locus_mix:     0.0020
  corrected_contrast:    {value: 0.0322, tol: 0.006}
  corrected_ci_must_exclude_zero: true
  min_fraction_surviving: 0.60

# --- R1: which arm carries the strand artifact? ----------------------------------------
#
# The direction of this asymmetry decides whether the artifact could be MANUFACTURING the
# contrast or merely shrinking it. Measured: the cue is weaker in the GC arm, which is the arm
# with the smaller nested gain, so it biases the contrast DOWNWARD and +0.0397 is conservative.
# Coordinates only, no model fitting, independent of the placebo experiment.
r1_strand_asymmetry:
  frac_sense_gc:   {value: 0.4275, tol: 0.020}
  frac_sense_dn:   {value: 0.4744, tol: 0.020}
  asymmetry:       {value: 0.0469, tol: 0.012}
  # THE CLAIM: the dinucleotide arm must be MORE sense, in most datasets.
  min_datasets_dinuc_more_sense: 33
  asymmetry_must_be_positive: true
  # WHY THE PLACEBO IS STRATIFIED ON GENE DENSITY. Retention requires exactly one overlapping
  # gene strand, so it selects against multi-gene loci by construction. Gated so the stratum
  # choice has a measured justification rather than an asserted one.
  ngenes_kept:     {value: 1.0964, tol: 0.060}
  ngenes_dropped:  {value: 1.3677, tol: 0.060}
  kept_must_be_less_dense: true

# --- R1d: does the contrast replicate, and does it buy anything? -----------------------
#
# THE ANSWER TO "THE SIGN IS DESIGN-IMPLIED". The concession is correct: the composition
# baseline's 15 df are exactly what the dinucleotide matcher controls, so the direction is
# implied and only the magnitude is informative. These two keys are what the magnitude is
# worth. Replication across cell lines is out-of-sample (separate eCLIP experiments, separately
# drawn negatives) and the design forces nothing about it -- the sign is guaranteed in each
# line independently, so a high correlation is information about MAGNITUDE. And efficiency is
# what a benchmark builder acts on; it is immune to the objection entirely, because the sign
# being predictable says nothing about how well the effect is measured.
r1_robustness:
  n_proteins_both_lines: {value: 15.0, tol: 0.0}
  replication_r:         {value: 0.9094, tol: 0.030}
  min_replication_ci_low: 0.70
  # THE ORDERING WAS ASSERTED AND IS NOT SUPPORTED. This block previously required the
  # contrast to replicate BETTER than either arm alone. A paired protein bootstrap gives
  # r_contrast - max(r_arm) = +0.113 [-0.082, +0.465] with P(<=0) = 0.21 on n = 15, so the
  # ordering is a point estimate and not a finding. The arms are pinned; the ordering is not
  # asserted. The claim in the text is "at least as well as".
  replication_gc_alone:  {value: 0.5179, tol: 0.060}
  replication_dn_alone:  {value: 0.8134, tol: 0.050}
  replication_ordering_gap: {value: 0.1134, tol: 0.030}
  # The ordering must NOT be assertable: its interval has to straddle zero, or the earlier
  # claim was right after all and the text should be changed back deliberately.
  ordering_ci_must_include_zero: true
  # THE LIMITATION R1d LACKED. R1f gates the fact that its region association vanishes once
  # total nested gain is partialled out. R1d was billed as the answer to the design-implied-sign
  # objection and had no equivalent control, yet the contrast correlates with total gain at
  # +0.95, so two cell lines agreeing on the contrast may be agreeing on the protein's signal
  # strength. Partialled, r falls from 0.909 to 0.332 and its interval straddles zero. Gated so
  # the limitation cannot be dropped, and so that if it ever becomes assertable that is a
  # deliberate change.
  replication_partial:   {value: 0.3321, tol: 0.060}
  contrast_total_gain_corr: {value: 0.9516, tol: 0.030}
  between_dataset_sd:    {value: 0.0318, tol: 0.004}
  partial_p:             {value: 0.2270, tol: 0.060}
  partial_ci_must_include_zero: true
  efficiency_z_ratio:    {value: 1.3150, tol: 0.050}
  min_efficiency_ratio:  1.10
  # THE RATIO OF MEANS FLATTERS IT. The mean of the per-dataset ratios is 0.957, close to 1,
  # and 14/94 datasets need MORE windows under dinucleotide matching. All four are gated so the
  # favourable form cannot be quoted alone.
  relative_sample_size:  {value: 0.5783, tol: 0.040}
  relative_sample_median: {value: 0.5938, tol: 0.040}
  relative_sample_mean:  {value: 0.9570, tol: 0.060}
  datasets_needing_more_windows: {value: 14.0, tol: 0.0}
  composition_beats_model_gc: {value: 29.0, tol: 0.0}
  composition_beats_model_dn: {value: 14.0, tol: 0.0}

# --- R1e: is the contrast an artifact of k, and can it be REBUILT? ---------------------
#
# THE SECOND VERIFICATION IN THIS REPOSITORY. Every other R1 number is READ from a table the
# analysis pass wrote, so its gate detects drift and not error. k_sweep.py refits composition
# and k-mer models from `dataset.tsv` sequence for all 94 datasets in both arms and rebuilds
# the contrast. It lands on the committed value exactly. If the published contrast were wrong,
# this column could not agree with it.
#
# All 94 datasets pass the per-arm reproduction gate at k=4 before any other k is trusted.
r1_k_sweep:
  n_datasets:        {value: 94.0, tol: 0.0}
  contrast_k3:       {value: 0.0311, tol: 0.005}
  contrast_k4:       {value: 0.0397, tol: 0.005}
  contrast_k5:       {value: 0.0397, tol: 0.005}
  contrast_k6:       {value: 0.0355, tol: 0.005}
  # THE PROOF. Rebuilt from sequence against the committed table, same datasets.
  max_rebuild_diff:  0.0005
  # THE ROBUSTNESS. The contrast must survive every k, or it is a k artifact.
  min_contrast_any_k: 0.020
  min_datasets_positive_all_k: 75
  # And the manuscript's "5-mer" error must be shown to be inconsequential, not merely
  # corrected: k=5 and k=4 must agree.
  max_k5_minus_k4:   0.004

# --- R1f: heterogeneity by binding region ---------------------------------------------
#
# The one biological statement the study supports, gated together with the limitation that
# qualifies it. The contrast is twice as large for CDS-dominant proteins as for intron-dominant
# ones, and the mechanism is checkable: intronic sites are compositionally distinctive
# (polypyrimidine tracts, U-rich stretches), so composition alone already discriminates them
# and the protocol has less to expose. THE LIMITATION IS GATED TOO: partialling out the total
# nested gain removes the association, so region indexes how much non-compositional signal
# exists rather than acting as a separate mechanism. Claimed the second way it is right;
# claimed the first way it is wrong.
r1_region:
  contrast_cds:      {value: 0.0635, tol: 0.008}
  contrast_intron:   {value: 0.0316, tol: 0.006}
  contrast_utr3:     {value: 0.0328, tol: 0.008}
  cds_minus_intron:  {value: 0.0319, tol: 0.007}
  cds_intron_ci_must_exclude_zero: true
  # THE MECHANISM: intronic sites must be MORE compositional, or the explanation is wrong.
  composition_intron: {value: 0.6656, tol: 0.015}
  composition_cds:    {value: 0.5765, tol: 0.015}
  intron_must_be_more_compositional: true
  # THE LIMITATION, asserted so it cannot be dropped: the association must NOT survive
  # partialling out total gain. If it ever does, the claim gets STRONGER and this must be
  # revisited deliberately rather than silently.
  max_partial_rho:   0.25

# --- R1g: the contrast is not a property of the model class ---------------------------
#
# The paper's sharpest limitation used to be that every number in it came from an
# L2-penalised logistic on 4-mer counts. R1g runs R1's own nested decomposition on a
# 7,089-parameter CNN and a 19.7M-parameter fine-tuned SpliceBERT, in both arms, on the same
# folds and the same rows, and the 4-mer is REFITTED alongside them rather than read from
# rehearsal_binding_* so that all three rungs are measured identically.
#
# THE CLAIM IS *NOT* A CAPACITY LADDER. An earlier version of this block said "the contrast
# grows with model capacity" and that is WITHDRAWN: it reverses on the ratio scale (R1g's
# multipliers are 3.08 / 3.51 / 2.38x) and R1h's specification grid ranks the CNN, the MIDDLE
# rung, as the only model whose protocol effect survives every specification. What R1g
# establishes is narrower and still worth having: the effect is not a property of the model
# class, holding for a 256-feature logistic, a 7,089-parameter CNN and a 19.7M-parameter
# fine-tuned transformer. The additive ordering below is retained as a FACT about the additive
# scale, not as a claim about capacity.
r1g_deep_contrast:
  n_datasets: 94
  kmer:
    nested_gc:      {value: 0.0265, tol: 0.0020}
    nested_dn:      {value: 0.0663, tol: 0.0030}
    contrast_auroc: {value: 0.0398, tol: 0.0025}
    protocol_min:   {value: 0.0188, tol: 0.0020}
    protocol_max:   {value: 0.0314, tol: 0.0020}
    positive_datasets: {value: 88, tol: 3}
  cnn:
    nested_gc:      {value: 0.0330, tol: 0.0025}
    nested_dn:      {value: 0.0837, tol: 0.0040}
    contrast_auroc: {value: 0.0506, tol: 0.0035}
    protocol_min:   {value: 0.0213, tol: 0.0025}
    protocol_max:   {value: 0.0412, tol: 0.0030}
    positive_datasets: {value: 89, tol: 3}
  splicebert:
    nested_gc:      {value: 0.0890, tol: 0.0045}
    nested_dn:      {value: 0.1735, tol: 0.0060}
    contrast_auroc: {value: 0.0845, tol: 0.0040}
    protocol_min:   {value: 0.0253, tol: 0.0025}
    protocol_max:   {value: 0.0543, tol: 0.0035}
    positive_datasets: {value: 94, tol: 3}
  # Every model's contrast must be positive with its interval clear of zero, and its
  # protocol effect must survive EVERY member of the transplant family, not the flattering
  # one. Same standard R1b is held to.
  contrast_ci_must_exclude_zero: true
  protocol_must_survive_every_transplant: true
  # THE LADDER, AS PAIRED DIFFERENCES ON THE SAME 94 DATASETS. Point estimates alone would
  # not carry this: the k-mer's interval [0.0337, 0.0459] and the CNN's [0.0446, 0.0614]
  # overlap. The paired difference is the right statistic and it is what is gated.
  #
  # The CNN step is the weak rung and the numbers say so -- larger in 58 of 94 datasets
  # against 94 of 94 for SpliceBERT over the k-mer. That is stated, not smoothed over.
  ladder:
    step_cnn_minus_kmer:        {value: 0.0132, tol: 0.0030}
    step_splicebert_minus_cnn:  {value: 0.0334, tol: 0.0035}
    step_splicebert_minus_kmer: {value: 0.0466, tol: 0.0040}
  ladder_steps_ci_must_exclude_zero: true
  # TWO-SIDED, because one-sided floors let inflation through. A referee rewrote the evidence
  # so the CNN beat the k-mer on all 94 datasets instead of the real 58, preserving both
  # column means, and `>= 55` passed while golden.yaml claimed the weak rung "is stated, not
  # smoothed over". A count that can only be wrong upwards is not gated.
  step_datasets_cnn_minus_kmer: {value: 58, tol: 4}
  # THE ORDERING ON THE ADDITIVE SCALE, kept as a fact and NOT as a capacity claim. The
  # capacity reading is withdrawn (see the block header and R1g/R1h); this gate exists so the
  # additive numbers cannot drift, not to license "it grows with capacity".
  additive_ordering_holds: true

  # THE SCALE REVERSAL, AND WHY IT IS GATED RATHER THAN OMITTED.
  #
  # R1b's rule: "a result whose sign depends on the scale is not a result unless the reversal
  # itself has a diagnosis." That rule was applied ruthlessly to the log-odds reversal and
  # then NOT applied to this paper's own newest headline, until a referee ran the ratio scale
  # and found it. The additive ladder above is real; the MULTIPLIER ladder is not.
  #
  # Restricted to the 77 datasets where every model has a positive gain in both arms, since a
  # log-ratio requires it. The protocol multiplier is ~2.4-3.5x for all three model classes
  # and is SMALLEST for the largest model, because the AUROC ceiling bites harder at
  # SpliceBERT's higher baseline. So the additive growth is mostly one near-invariant
  # multiplier applied to more total signal.
  #
  # THE DIAGNOSIS IS THE CLAIM. Gated so that a future draft cannot report "grows with
  # capacity" without also reporting the scale on which it does not.
  ratio:
    datasets_positive_both_arms: 77
    multiplier_kmer:        {value: 3.083, tol: 0.20}
    multiplier_cnn:         {value: 3.511, tol: 0.30}
    multiplier_splicebert:  {value: 2.382, tol: 0.20}
    logstep_splicebert_minus_kmer: {value: -0.2579, tol: 0.045}
    logstep_splicebert_minus_cnn:  {value: -0.3877, tol: 0.055}
  # The reversal must be REAL (interval clear of zero on the wrong side), not marginal.
  ratio_ladder_must_reverse_for_splicebert: true
  # Every model class must still show a substantial multiplier -- that is what answers
  # "would this vanish for a real model?" without the additive overclaim.
  min_multiplier_any_model: 2.0
  # The strong form of "not a model-class artefact": the deep model's interval must clear
  # the k-mer's point estimate entirely, not merely overlap it on the right side.
  splicebert_ci_must_exceed_kmer_point: true
  # ROWS. The GC arm is scored from the very dataset.tsv it was trained on, so anything
  # below 1.0 there means a fold went missing. The dinucleotide arm's windows drifted by
  # 0.06% after its sweep ran, which is tolerated and measured, not assumed away.
  min_row_coverage_gc: 1.0
  min_row_coverage_dn: 0.99
  # THE CROSS-CHECK THAT TIES R1g TO R1. The refitted 4-mer must reproduce the published
  # contrast from scale_check.csv. If these ever diverge, one of the two is wrong and the
  # comparison against the deep models is meaningless.
  max_kmer_refit_drift: 0.002
  # THE ATTACK THIS CLOSES. deep_contrast.csv is a summary of
  # deep_contrast_per_dataset.csv, and until this key existed nothing compared them -- so
  # editing the summary alone would have passed every check above. That is precisely how a
  # permuted cost_of_matching.csv once passed 166/166. The summary's means are recomputed
  # from the per-dataset rows and must agree exactly.
  max_summary_arithmetic_diff: 1.0e-9
  # --- ANTI-FORGERY, added after a referee forged this table end to end and passed 314/314 --
  #
  # The arithmetic gate above is ONE-DIRECTIONAL: it verifies the summary is arithmetic on the
  # evidence, which is equally satisfied by evidence reverse-engineered from the summary. These
  # four close that, and the fourth is the one that actually required new data.
  #
  # 1. THE INTERNAL IDENTITY. gain is returned by DeLong as full minus comp, so it is exact.
  #    The forgery kept comp_* and *_full_* real and replaced every gain; this breaks on that.
  max_gain_identity_diff: 1.0e-12
  # 2. PANEL IDENTITY. Renaming all 94 datasets to FAKE0:XXXX, or permuting the label column so
  #    every row attaches to the wrong protein, both passed. The panel must BE the R1 panel.
  panel_must_match_rehearsal: true
  # 3. COVERAGE MUST NOT DEFAULT. summarise() read `d[col].min() if col in d else 1.0`, so
  #    DELETING the columns made the gate assert perfect coverage. A wrong value was caught; an
  #    absent one was not. Same shape as the earlier failure where deleting a file passed.
  coverage_columns_must_be_present: true
  # 4. THE EVIDENCE IS NOW ANCHORED TO PER-WINDOW SCORES IN THE REPO. Both arms' 940
  #    scores.tsv.gz are committed (16 MB for the GC arm, which was the missing half), so the
  #    raw pooled AUROC of every (dataset, model, arm) cell is recomputable here from
  #    data/evidence alone -- no window table, no sequences, no cloud store. A forged row
  #    cannot survive this unless the forger also rewrites 940 gzipped score files.
  max_raw_auroc_diff: 1.0e-9
  min_anchored_cells: 376

# --- R1h: is the protocol effect IDENTIFIED? Two referee attacks, run properly ----------
#
# R1b splits the contrast into AUROC compression and a residual it calls the protocol effect,
# by transplanting one arm's d' increment onto the other's baseline. A statistical referee
# attacked that twice. Both attacks are reproduced in scripts/protocol_identification.py
# rather than rebutted in prose, and one of them lands.
#
# ATTACK 1, the stated range is an arbitrary truncation: SURVIVED, but the paper must widen
# what it quotes. Six monotone links x two directions keep the sign for every model.
#
# ATTACK 2, the identifying assumption is false: LANDS. The transplant needs the d' increment
# to be baseline-invariant and it is not. Net of the mechanical regression-to-the-mean slope
# (computed from Hanley-McNeil SEs, -0.0055 gc / -0.0165 dn), SpliceBERT's slope is -0.336.
# Adding that slope back leaves the k-mer and the CNN standing and collapses SpliceBERT to
# an interval containing zero.
#
# CONSEQUENCE, GATED SO IT CANNOT BE QUIETLY DROPPED: "the protocol effect grows with model
# capacity" is WITHDRAWN. The largest model's protocol effect is not identified.
r1h_protocol_identification:
  # Net-of-mechanism slopes. The mechanical term is now model-specific, as it must be: an
  # earlier version set cov(e_full, e_comp) = 0 and got the SAME mechanical slope for all
  # three models within an arm, which over-subtracted by 5x-30x and biased the protocol
  # effect high. The covariance is 0.38-0.86 and is recovered from the committed DeLong SEs.
  slope_kmer_gc:       {value: -0.0643, tol: 0.010}
  slope_splicebert_gc: {value: -0.3407, tol: 0.040}
  mechanical_slope_kmer_gc:       {value: -0.0003, tol: 0.0010}
  mechanical_slope_splicebert_dn: {value: -0.0086, tol: 0.0030}
  # The tell that the old formula was wrong. Assert against its return.
  mechanical_slope_must_vary_across_models: true
  corr_full_comp_kmer_gc: {value: 0.8633, tol: 0.05}

  # ATTACK 1. The honest range, over links with an ROC or variance-stabilising rationale.
  link_family_min_kmer:       {value: 0.0127, tol: 0.0030}
  link_family_max_kmer:       {value: 0.0506, tol: 0.0060}
  link_family_min_splicebert: {value: 0.0159, tol: 0.0030}
  link_family_max_splicebert: {value: 0.1022, tol: 0.0100}
  link_family_must_keep_sign: true
  # AND THE ONE THAT DOES NOT, NAMED. The odds scale a/(1-a) is lambda=+1 in the same power
  # family as -log(1-a); every link above sits at lambda <= 0. It reverses the sign. It is
  # excluded from the headline range because it has no ROC derivation and its derivative
  # diverges at the ceiling, and that exclusion is stated rather than silent.
  odds_forward_kmer:       {value: -0.0036, tol: 0.0030}
  odds_forward_splicebert: {value: -0.0148, tol: 0.0050}
  odds_link_must_reverse: true

  # ATTACK 2. THE SPECIFICATION GRID, which is the honest form. The slope can be estimated in
  # the source arm, the target arm or pooled, and the two arms disagree by 2x-3x -- so the
  # linear-in-baseline model is misspecified by its own diagnostic and NO member is
  # identified. What is reported is the span and how many specifications keep the sign.
  spec_span_min_kmer:       {value: -0.0044, tol: 0.0040}
  spec_span_max_kmer:       {value: 0.0200, tol: 0.0040}
  spec_span_min_splicebert: {value: -0.0260, tol: 0.0050}
  spec_span_max_splicebert: {value: 0.0031, tol: 0.0040}
  spec_excluding_zero_kmer:       4
  spec_excluding_zero_cnn:        6
  # WAS 1, NOW 0, and the change came from the dinucleotide retrain rather than from any
  # analysis choice. SpliceBERT's transplant residual now keeps its sign in NONE of the six
  # specifications, which strengthens the paper's refusal to decompose the span: the one
  # model that had a single surviving specification no longer has it.
  spec_excluding_zero_splicebert: 0
  spec_total: 6
  # THE CLAIM, AND IT IS NOT A CAPACITY CLAIM. The CNN -- the MIDDLE rung -- is the only
  # model whose protocol effect survives every specification. Any ordering by parameter count
  # is therefore refuted, not merely unsupported.
  cnn_must_survive_all_specifications: true
  splicebert_must_fail_majority_of_specifications: true

# --- R1i: intervals recomputed with the clustering the panel actually has ---------------
#
# 94 datasets, 79 proteins: 15 proteins appear in both cell lines and contribute two rows
# each. Every bootstrap in this project resamples DATASETS, which treats those two rows as
# independent evidence. The within-protein correlation of the contrast is +0.92 for the
# k-mer, so it plainly is not. Every interval the manuscript printed was too narrow.
#
# The correction widens intervals by up to 1.23x and changes NO conclusion. That is why it
# is worth making: it costs nothing and removes an objection a referee would land.
r1i_cluster_intervals:
  n_proteins: 79
  n_doubled_proteins: 15
  within_protein_correlation_kmer: {value: 0.924, tol: 0.05}
  # The correction must actually do something, or it is not being applied.
  min_width_ratio: 1.02
  max_width_ratio: {value: 1.23, tol: 0.12}
  # THE CLAIM THAT MATTERS. If any headline crosses zero once protein clustering is
  # respected, the paper must restate it rather than keep the narrower interval.
  all_headlines_exclude_zero_clustered: true
  # THE REST OF THE PAPER, not just R1g. R1's own headline and R1f get the same correction.
  r1_contrast_width_ratio:  {value: 1.22, tol: 0.12}
  r1f_cds_width_ratio:      {value: 1.09, tol: 0.12}
  # R1c needs NO correction, and that is checked rather than assumed: its 40 datasets are 40
  # distinct proteins, so there is nothing to cluster.
  r1c_duplicated_proteins: 0

  # --- THE PER-DATASET COUNTS, restated at the measured design effect -------------------
  #
  # "the score adds significantly in 80/94" uses DeLong's SE, which understates here twice
  # over: it conditions on two FITTED score vectors as if fixed (measured inflation 1.10 by
  # permutation null), and it treats spatially clustered windows as independent (1.23 by
  # 10-kb block bootstrap). nested.py's own test_score docstring identifies the second and
  # cluster-bootstraps over genes; the headline estimator does not.
  #
  # Eight datasets is 8.5% of the panel. Too large for a Methods caveat, so the counts are
  # restated and BOTH figures are gated -- the published one so the change is visible, and
  # the corrected one because it is what the paper should print.
  helps_gc_published:      80
  helps_gc_design_effect:  72
  helps_dn_published:      82
  helps_dn_design_effect:  78
  design_effect: 1.35

# --- R1j: the expression confound, measured against a matched placebo -------------------
#
# THE OBJECTION, AND IT IS THE LARGEST ONE ANYONE RAISED. Negatives are drawn from the
# positive's chromosome with no expression filter, so a large share sit in loci no transcript
# is produced from. Measured against ENCODE total RNA-seq: 40.1% of negatives overlap no gene
# above 1 TPM on either strand, and a single scalar -- log TPM of the overlapping gene --
# separates the classes at AUROC 0.833, BETTER than the sequence model. If the benchmark's
# dominant axis were transcribed-versus-untranscribed rather than bound-versus-unbound, the
# whole paper would be measuring the wrong thing.
#
# WHY IT DOES NOT MANUFACTURE THE CONTRAST. The confound has to DIFFER between the arms to
# create a difference between them, and it does not: 40.0993% against 40.1005%, arm difference
# +0.000012 [-0.0033, +0.0032], paired Wilcoxon p = 0.64. Balance is the whole argument.
#
# THE SAME LESSON AS R1c, LEARNED AGAIN. A one-seed scratch estimate gave -0.0021 [-0.0052,
# +0.0012] and 93.8% surviving, i.e. "indistinguishable from zero". At 20 placebo seeds with
# the region-stratified design the excess is -0.0043 [-0.0069, -0.0018] and the interval
# EXCLUDES zero. The artifact is real and small, exactly as the strand artifact turned out to
# be. Do not retract or accept an artifact estimate on too few placebo seeds.
r1j_expression_control:
  n_datasets: 84
  untranscribed_fraction_gc:    {value: 0.4010, tol: 0.02}
  untranscribed_fraction_dn:    {value: 0.4010, tol: 0.02}
  # THE BALANCE ARGUMENT. This interval MUST straddle zero, or the confound is differential
  # and the contrast is contaminated rather than merely inflated in both arms.
  arm_difference_must_straddle_zero: true
  max_abs_arm_difference: 0.005
  contrast_full:                {value: 0.0414, tol: 0.005}
  contrast_expressed_only:      {value: 0.0310, tol: 0.005}
  contrast_placebo_stratified:  {value: 0.0353, tol: 0.005}
  # THE ANSWER, pre-committed as primary: restriction minus a placebo dropping the same
  # number of pairs, stratified on the negative's region class.
  expression_excess:            {value: -0.0043, tol: 0.0025}
  expression_excess_must_exclude_zero: true
  locus_mix:                    {value: 0.0007, tol: 0.0015}
  contrast_corrected:           {value: 0.0371, tol: 0.005}
  surviving_fraction:           {value: 0.8967, tol: 0.05}
  min_surviving_fraction: 0.80
  # Monte Carlo noise in the placebo must stay well below the effect it is measuring.
  max_placebo_seed_noise: 0.008

# --- R1k: three negative-set protocols, and the prediction that was falsified ------------
#
# THE PAPER'S THESIS, TESTED PROPERLY. Two protocols invite the reply that both are variants
# of one flawed design. This adds a third that shares none of their defects: Horlacher et al.
# 2023's bias-aware negative-2, i.e. OTHER RBPs' binding sites in the same cell line. Those
# negatives are transcribed, CLIP-accessible and strand-correct by construction, and no
# composition matcher touches them.
#
# THE PREDICTION WAS WRITTEN DOWN AND IT WAS WRONG. scripts/three_arm_contrast.py predicted
# composition would fall toward 0.5 under neg2 and the nested contribution would RISE. Neither
# happened. Composition is HIGHEST under neg2 (0.8248) and the contribution is LOWEST
# (+0.0122), because different RBPs bind compositionally different sites, so telling one
# protein's sites from another's is largely a composition task.
#
# WHAT IT DOES TO THE CLAIM: strengthens the thesis, kills the recommendation. The same model
# on the same positives measures +0.0122 to +0.0663 depending only on how the negatives were
# built -- a 5.4-fold range. But the ordering is NOT "harder negatives reveal more": the
# field's own bias-aware protocol reveals the LEAST, at 0.53x the GC arm. "Prefer dinucleotide
# matching" is therefore not supportable as a recommendation; "no protocol-independent
# contribution exists" is, and is the better claim.
r1k_three_arm:
  n_datasets: 94
  composition_gc:   {value: 0.7827, tol: 0.010}
  composition_dn:   {value: 0.6274, tol: 0.010}
  composition_neg2: {value: 0.8248, tol: 0.015}
  gain_gc:   {value: 0.0265, tol: 0.006}
  gain_dn:   {value: 0.0663, tol: 0.011}
  gain_neg2: {value: 0.0122, tol: 0.005}
  contrast_dn_minus_gc:   {value: 0.0398, tol: 0.0025}
  contrast_neg2_minus_gc: {value: -0.0143, tol: 0.005}
  contrast_neg2_minus_dn: {value: -0.0540, tol: 0.008}
  multiplier_dn_over_gc:   {value: 2.94, tol: 0.20}
  multiplier_neg2_over_gc: {value: 0.53, tol: 0.10}
  # THE FALSIFIED PREDICTION, asserted so it cannot be quietly reinterpreted later. neg2 must
  # have the HIGHEST composition baseline and the LOWEST nested contribution of the three.
  neg2_must_have_highest_composition: true
  neg2_must_have_lowest_gain: true
  # THE RANGE IS THE CLAIM.
  min_fold_range_across_protocols: 4.0
  # THE ORDERING IS MONOTONE IN MEASURED DIFFICULTY, and an earlier version of this comment
  # said the opposite. Ordered by apparent AUROC -- the only operational definition of
  # "harder" this study measures -- dinuc 0.6937 < gc 0.8092 < neg2 0.8370, and the
  # contributions run exactly the other way. neg2 is the EASIEST discrimination, not the
  # hardest. The "prefer dinucleotide matching" recommendation is withdrawn because what
  # harder negatives buy is HEADROOM, which the protocol sets, not because the ordering is
  # irregular. This gate asserts the direction that fact implies.
  contrast_neg2_minus_gc_must_be_negative: true
  # THE TRANSPLANT CANNOT SEPARATE COMPRESSION FROM PROTOCOL HERE, and now there are six
  # residuals rather than four to show it: their SIGN follows the direction of transplant,
  # high-baseline-to-low positive and low-to-high negative. Same non-identification as R1h,
  # visible across three protocols instead of two.
  protocol_effect_gc_on_dn:     {value: 0.0314, tol: 0.005}
  protocol_effect_gc_on_neg2:   {value: -0.0086, tol: 0.005}
  protocol_effect_dn_on_neg2:   {value: -0.0259, tol: 0.006}
  protocol_effect_neg2_on_dn:   {value: 0.0452, tol: 0.008}
  transplant_residuals_must_change_sign: true
  # The gain tracks how much room the baseline leaves. This is the circularity critique,
  # measured rather than argued.
  spearman_composition_gain: {value: -0.600, tol: 0.06}

# --- R1l: protocol and baseline are not separable, and that IS the finding ---------------
#
# THE STRONGEST OBJECTION LEFT. R1k concedes the contribution tracks the composition baseline
# at rho -0.60, so a referee says: "the protocol changes the contribution" is just "the
# protocol changes the baseline", which is trivial.
#
# THE NAIVE TEST APPEARS TO AGREE. Pooled over 282 cells, gain ~ cubic(baseline) gives
# R2 0.3955; adding protocol dummies gives 0.4065, F(2,276) = 2.55, p = 0.080.
#
# THE TEST IS UNINFORMATIVE, AND THAT IS THE POINT. The three protocols' baseline
# distributions barely overlap: the intersection of their 10th-90th percentile ranges is
# 0.0056 AUROC wide and contains 3 of 282 cells. There is no region where two protocols can be
# compared at the same baseline, so nothing can separate them on this data. Protocol and
# baseline are not correlated variables; the protocol IS the operation that sets the baseline.
#
# WHAT NEVERTHELESS SURVIVES. Compression does not explain the differences: transplanting a
# model's own d' increment across baselines accounts for 21%, 40% and 52% of the three pairwise
# gaps, and a single constant increment on each cell's own baseline predicts the 282 gains at
# R2 = 0.18 with residuals ordered by protocol. The arms differ by more than the ceiling -- but
# how much more is not estimable, and the paper says so.
r1l_baseline_confounding:
  r2_baseline_alone:      {value: 0.3955, tol: 0.02}
  r2_with_protocol:       {value: 0.4065, tol: 0.02}
  f_protocol_beyond_baseline: {value: 2.55, tol: 0.5}
  # The naive test must remain UNCONVINCING. If it ever becomes significant, either the data
  # changed or the overlap did, and the argument below has to be re-made rather than reused.
  min_p_protocol_beyond_baseline: 0.02
  # THE STRUCTURAL FACT. Both must hold: the window is tiny AND almost nothing is in it.
  common_support_width:   {value: 0.0056, tol: 0.004}
  max_cells_in_common_support: 10
  baseline_median_gc:     {value: 0.780, tol: 0.015}
  baseline_median_dn:     {value: 0.610, tol: 0.015}
  baseline_median_neg2:   {value: 0.815, tol: 0.015}
  # COMPRESSION IS NOT THE WHOLE STORY. Each fraction must stay well below 1.
  compression_share_gc_dn:    {value: 0.21, tol: 0.08}
  compression_share_gc_neg2:  {value: 0.40, tol: 0.10}
  compression_share_dn_neg2:  {value: 0.52, tol: 0.10}
  max_compression_share: 0.75
  r2_one_constant_increment: {value: 0.183, tol: 0.05}
  # And the leftovers must still be ordered by protocol, or there is nothing beyond the ceiling.
  residual_dn:   {value: 0.0247, tol: 0.008}
  residual_neg2: {value: -0.0143, tol: 0.008}
  residuals_must_be_ordered: true
  # THE POOLED SPEARMAN, CLUSTERED. Its nominal p treated 282 cells as independent when each
  # dataset appears once per arm and fifteen proteins carry two datasets. It was the smallest
  # p in the paper, which is the worst place to leave an inflated one. The relation survives:
  # what is gated is that the pooled and both composition-matched intervals EXCLUDE zero while
  # the bias-aware interval CONTAINS it, because that pattern is the claim, not the endpoints.
  spearman_clustered_pooled:  {value: -0.604, tol: 0.03}
  spearman_clustered_gc:      {value: -0.545, tol: 0.04}
  spearman_clustered_dn:      {value: -0.460, tol: 0.04}
  spearman_clustered_neg2:    {value: -0.122, tol: 0.04}
  spearman_clustered_signs_must_hold: true

# --- R1m: no rescaling of AUROC removes the protocol dependence --------------------------
#
# THE FIRST OBJECTION A REFEREE RAISES AGAINST THE TITLE. The paper claims the measured
# contribution is protocol-dependent, using a BOUNDED statistic across three protocols whose
# baselines differ by 0.20 AUROC. Is the range just the bounded scale?
#
# "Some transform would remove it" is an existential claim, so it needs a search, not an
# argument. Eight monotone transforms, fold range over the three protocol means, intervals
# bootstrapping the 79 PROTEINS per R1i.
#
# THE FLOOR IS 2.00x [1.67, 2.46] AND IT EXCLUDES 1. The transform achieving it divides by the
# baseline's remaining headroom, which is not a rescaling of the model's output at all -- it is
# a rescaling by the protocol's own baseline. The only way to shrink protocol dependence is to
# divide it out by hand using the quantity the protocol sets.
#
# THIS IS THE ANALYSIS THAT COULD NOT LOSE. Had a transform collapsed the range, the paper
# would have become "here is the protocol-independent coordinate, use it" -- better and more
# citable. It did not, so the title stands with a search behind it.
r1m_scale_sweep:
  n_transforms: 8
  fold_range_raw:        {value: 5.42, tol: 0.40}
  fold_range_dprime:     {value: 3.18, tol: 0.35}
  fold_range_logit:      {value: 2.72, tol: 0.35}
  fold_range_headroom:   {value: 2.00, tol: 0.30}
  fold_range_excess:     {value: 18.18, tol: 3.0}
  minimum_fold_range:    {value: 2.00, tol: 0.30}
  # THE CLAIM. No transform reaches protocol independence, so the floor must stay clear of 1.
  min_floor_fold_range: 1.30
  floor_ci_must_exclude_one: true
  # Somers' D is a linear rescale of AUROC, so its fold range MUST equal the raw one exactly.
  # If it ever differs, the sweep has a bug.
  max_somers_raw_difference: 1.0e-9

# --- R1n: it is the baseline, not the protocol label -------------------------------------
#
# R1l argued protocol and baseline cannot be separated because the arms barely overlap. That
# was too comfortable. A hostile referee found two places where they DO overlap and asked the
# question there. The answer is that the protocol label carries essentially no information.
#
#   incremental R2 of the protocol label given the baseline:  1.00%
#   incremental R2 of the baseline given the protocol label: 11.04%
#
# THE NATURAL EXPERIMENT. neg2 usually raises the baseline against GC matching, but in 27 of
# 94 datasets it LOWERS it -- and there the result REVERSES, from -0.0212 to +0.0028. Whichever
# protocol leaves the lower baseline gets the higher contribution, whichever protocol that is.
# Within-dataset spearman(delta baseline, delta gain) = -0.664, p = 3e-13.
#
# THE MATCHED COMPARISON. Matched on baseline within 0.02 AUROC, dn minus gc is
# -0.0087 [-0.0265, +0.0122] against a raw +0.0398. The contrast does not survive matching.
# comp_dn < comp_gc in 94/94, so within a dataset the two arms are rank-confounded by
# construction and the match has to borrow across datasets; both designs are reported.
r1n_protocol_or_baseline:
  incremental_r2_protocol: {value: 0.0100, tol: 0.004}
  incremental_r2_baseline: {value: 0.1104, tol: 0.020}
  # The label must stay uninformative relative to the baseline, by a wide margin.
  max_incremental_r2_protocol: 0.03
  min_baseline_over_protocol_ratio: 5.0
  n_discordant_datasets: {value: 27, tol: 3}
  gain_diff_concordant: {value: -0.0212, tol: 0.006}
  gain_diff_discordant: {value: 0.0028, tol: 0.005}
  # THE CLAIM. The sign must FLIP between concordant and discordant datasets, or the natural
  # experiment shows nothing.
  discordant_must_reverse_sign: true
  within_dataset_spearman: {value: -0.664, tol: 0.08}
  matched_dn_minus_gc: {value: -0.0087, tol: 0.010}
  # And the matched comparison must CONTAIN ZERO, i.e. the contrast does not survive matching.
  matched_must_contain_zero: true
  n_rank_confounded: 94

  # --- THE CORRECTION: R1l's "no common support" was the THREE-WAY intersection -----------
  #
  # R1l reported a common support 0.0056 AUROC wide holding 3 of 282 cells and concluded no
  # matched comparison was possible. That is the intersection of ALL THREE arms. Pairwise:
  #   gc vs dn    0.073 AUROC,  33/188 cells   (and rank-confounded 94/94)
  #   gc vs neg2  0.212 AUROC, 130/188 cells   <- the comparison IS possible here
  #   dn vs neg2  0.006 AUROC,   2/188 cells
  #
  # I ran the matched design on the one pair where it cannot work and never on the pair where
  # it can. Run properly, neg2 vs gc at matched baseline is NEGATIVE with the interval clear
  # of zero under two independent designs. So a protocol-specific residual DOES exist, the
  # headline 1.00% averages an answerable pair with an unanswerable one, and R1n's strong form
  # is weakened rather than supported.
  pairwise_support_gc_dn:   {value: 0.073, tol: 0.03}
  pairwise_support_gc_neg2: {value: 0.212, tol: 0.05}
  incremental_r2_gc_dn:   {value: 0.0005, tol: 0.0015}
  incremental_r2_gc_neg2: {value: 0.0340, tol: 0.010}
  matched_neg2_minus_gc:  {value: -0.0081, tol: 0.005}
  intercept_neg2_minus_gc: {value: -0.0043, tol: 0.004}
  # THE CLAIM: a residual exists for neg2 and must not be reported as absent.
  neg2_residual_must_exclude_zero: true
  # THE MECHANISM: the baseline gradient is a property of composition-matched genomic-background
  # negatives and DIES for other-RBPs'-sites negatives. That replicates on Horlacher's data too.
  within_arm_spearman_gc:   {value: -0.545, tol: 0.08}
  within_arm_spearman_neg2: {value: -0.122, tol: 0.10}
  gradient_must_die_for_neg2: true

# --- R1o: how much of the "contribution" is one order of composition up? -----------------
#
# THE SHARPEST OBJECTION ANYONE MADE ABOUT WHAT THE QUANTITY IS. A bag of 4-mer counts carries
# no positional information, and the composition baseline stops at order 2. So the headline
# quantity is definitionally order-3-and-4 composition beyond order-1-and-2 composition, and
# where the baseline stops is an analyst's choice that nobody had measured the consequences of.
#
# MEASURED, on 30 size-stratified datasets whose own R1 contrast is +0.0399 against the
# published +0.0398, so the subsample is representative:
#
#   extending the baseline to order 3 removes 46% (gc), 56% (dn), 55% (neg2) of each arm's
#   contribution, and 64% of the R1 contrast (+0.0399 -> +0.0143).
#
# WHAT IT COSTS: the word "sequence model" must be qualified. What is measured is short-range
# compositional signal one order above wherever the matcher stopped -- not motif recognition,
# and nothing positional.
#
# WHAT IT DOES NOT COST, AND THIS IS THE POINT: the FOLD RANGE, which is the paper's actual
# claim, is 2.67x at order 2 and 2.62x at order 3. Everything shrinks proportionally. The
# magnitude is a function of an analyst's choice; the protocol dependence is not.
# CORRECTED, and the correction is larger than the original result. The first
# version of baseline_order.py built its OWN composition block instead of using the paper's:
# all 4 mono + all 16 dinucleotide frequencies, unstandardised, into sklearn's default
# LogisticRegression. Singular design matrix, no entropy column, and an L2 penalty on features
# of scale 0.06 -- which underfits both baselines, overstates both gains (1.22x on GC, 2.31x on
# neg2) and underfits order 3 worst of all. It reported ~50% removed; the true figure is 80-88%.
# It reported a fold range of 2.67x that was never the paper's 5.42x.
#
# IT PASSED REVIEW because its order-2 R1 CONTRAST landed at +0.0399 against the published
# +0.0398 -- two offsetting errors. The lesson, now enforced by max_order2_reproduction below:
# a re-implemented baseline must be asserted equal to the original PER CELL, not agree with it
# on one aggregate.
r1o_baseline_order:
  n_datasets: 30
  # THE ANCHOR. Order 2 IS nested.composition_features, so the gain must be the published gain
  # cell by cell. Everything else in this block is meaningless if this drifts.
  max_order2_reproduction: 1.0e-9
  gain_order2_gc:   {value: 0.0288, tol: 0.006}
  gain_order3_gc:   {value: 0.0058, tol: 0.003}
  gain_order2_dn:   {value: 0.0650, tol: 0.010}
  gain_order3_dn:   {value: 0.0105, tol: 0.005}
  gain_order2_neg2: {value: 0.0122, tol: 0.005}
  gain_order3_neg2: {value: 0.0015, tol: 0.0012}
  removed_fraction_gc:   {value: 0.80, tol: 0.10}
  removed_fraction_dn:   {value: 0.84, tol: 0.10}
  contrast_order2: {value: 0.0361, tol: 0.007}
  contrast_order3: {value: 0.0048, tol: 0.003}
  removed_fraction_contrast: {value: 0.87, tol: 0.10}
  # THE SUBSAMPLE MUST BE REPRESENTATIVE, or none of the above transfers to the full panel.
  max_subsample_contrast_drift: 0.006
  # THE CLAIM THAT MUST SURVIVE. Most of the MAGNITUDE is an analyst's choice; the protocol
  # DEPENDENCE is not.
  #
  # CORRECTED A SECOND TIME. The first correction said the
  # range "WIDENS, 5.34x -> 7.16x" and that the arms "do not shrink proportionally". Neither is
  # supported at n = 30. The intervals were written as NaN and the prose printed the point
  # estimates as if identified: order-2 is 5.34x [3.95, 7.71], order-3 is 7.16x [3.65, 22.65],
  # and the CHANGE is [-1.89, +16.43] with P(<=0) = 0.18. The order-3 range's denominator is the
  # neg2 order-3 mean of 0.0015, whose own interval spans a factor of six. The removed fractions
  # 0.80 / 0.84 / 0.88 also have overlapping intervals, so their ORDERING is not resolved.
  #
  # The surviving claim is the weaker one: the range does NOT COLLAPSE toward 1. Whether it
  # widens is unknown.
  fold_range_order2: {value: 5.34, tol: 0.60}
  fold_range_order3: {value: 7.16, tol: 1.20}
  min_fold_range_order3: 3.0
  range_change_direction_unresolved: true
  most_of_the_magnitude_must_be_removable: true
  # AND THE PER-DATASET SIGN, which a ratio of means cannot show. On the neg2 arm the TYPICAL
  # dataset retains nothing over a trinucleotide baseline -- the median per-dataset ratio is
  # NEGATIVE -- and the positive panel mean is carried by three datasets. A mean of +0.0015 read
  # as "small but positive everywhere" would be false.
  order3_positive_gc:   {value: 18, tol: 2}
  order3_positive_dn:   {value: 23, tol: 2}
  order3_positive_neg2: {value: 17, tol: 2}
  median_ratio_neg2: {value: -0.020, tol: 0.030}
  neg2_median_must_be_reported: true
  # The subsample's representativeness was argued from ORDER-2 quantities only, and the order-3
  # retained fraction is size-dependent (+0.354 / +0.627 / +0.432), while head(30) after
  # iloc[::3] deterministically discards the two largest datasets. So the removal fractions are
  # biased UPWARD. Gated so the size dependence must be reported alongside them.
  size_dependence_dn: {value: 0.627, tol: 0.15}
  size_dependence_must_be_reported: true

# --- R1r: is the order-3 collapse the 4-mer's, or every model's? -------------------------
#
# R1o's 80% collapse is near-tautological for a bag of 4-mers, whose only information beyond
# trinucleotide frequency IS order 4. If it held for every model class the reading would be
# general and devastating. It does not: on R1g's own committed per-window scores, over 94
# datasets and both arms, the 4-mer keeps ~20% of its contribution over an order-3 baseline
# while SpliceBERT keeps ~70-75%, and the three models' intervals do not overlap in either arm.
#
# TWO CONSEQUENCES FOR THE PAPER:
#   * the order-3 baseline SEPARATES model classes far better than the order-2 one
#     (SpliceBERT/4-mer widens from 3.36x to 11.61x on GC), so it is the better instrument;
#   * the protocol contrast survives at order 3 for ALL THREE models, intervals clear of zero,
#     so protocol dependence is not an artefact of the baseline's order for any model class.
#
# NO NEW COMPUTE. The CNN and SpliceBERT scores are R1g's, on R1g's intersected row set, via
# deep_model_contrast's own loader. So the order-2 column IS deep_contrast_per_dataset.csv and
# that is asserted per cell.
r1r_baseline_order_models:
  n_datasets: 94
  max_order2_reproduction: 1.0e-9
  surviving_kmer_gc:       {value: 0.217, tol: 0.06}
  surviving_cnn_gc:        {value: 0.605, tol: 0.06}
  surviving_splicebert_gc: {value: 0.750, tol: 0.05}
  surviving_kmer_dn:       {value: 0.188, tol: 0.06}
  surviving_cnn_dn:        {value: 0.591, tol: 0.06}
  surviving_splicebert_dn: {value: 0.692, tol: 0.05}
  # THE SHARE GAP. Note what this does and does not assert: it pins the gap in the SHARES,
  # which is a denominator effect (see below). It is NOT evidence that the k-mer is more
  # fragile, though an earlier label here said so.
  min_deep_advantage_over_kmer: 0.15
  # THE COMPRESSION CORRECTION, which this section omitted and which the paper itself calls
  # "not optional". The order-3 baseline RAISES composition (+0.0196 gc, +0.0517 dn), cutting
  # the headroom every model works in -- and it cuts more from a model with a bigger gain, which
  # is precisely what made the raw absorption look constant. Transplanting each model's order-2
  # d' increment onto the order-3 baseline, the k-mer's residual is 1.29x (gc) and 1.41x (dn)
  # SpliceBERT's. So BOTH of this section's framings were partial: the shares (3.4x) overstate
  # the difference and the raw absorption (1.0x) understates it. The truth is ~1.3-1.4x.
  residual_kmer_gc:       {value: -0.0182, tol: 0.004}
  residual_cnn_gc:        {value: -0.0099, tol: 0.004}
  residual_splicebert_gc: {value: -0.0141, tol: 0.004}
  residual_kmer_dn:       {value: -0.0460, tol: 0.008}
  residual_splicebert_dn: {value: -0.0327, tol: 0.007}
  corrected_ratio_gc: {value: 1.29, tol: 0.20}
  corrected_ratio_dn: {value: 1.41, tol: 0.20}
  compression_correction_must_be_reported: true
  # AND THE CNN CONTRADICTS ANY CAPACITY STORY on both scales: it absorbs the LEAST, raw and
  # corrected, with intervals clear of zero. The dn spread was ungated until now.
  cnn_minus_kmer_absorbed_gc: {value: -0.0077, tol: 0.003}
  cnn_minus_kmer_absorbed_dn: {value: -0.0186, tol: 0.005}
  max_absorbed_spread_dn: 0.025
  gain_order3_kmer_gc:       {value: 0.0058, tol: 0.003}
  gain_order3_splicebert_gc: {value: 0.0668, tol: 0.010}
  gain_order3_kmer_dn:       {value: 0.0124, tol: 0.005}
  gain_order3_splicebert_dn: {value: 0.1213, tol: 0.015}
  # B2: THE BIAS-AWARE ARM AT ORDER 3, on the full panel. These columns sat in
  # baseline_order_models_per_dataset.csv from the start and were summarised nowhere, because
  # every reporting loop read ("gc", "dn"). The arm is the fold range's own denominator, so
  # its absence meant the order-3 span had never been measured on the full panel.
  gain_order3_kmer_neg2:       {value: 0.0019, tol: 0.0012}
  gain_order3_cnn_neg2:        {value: 0.0057, tol: 0.0025}
  gain_order3_splicebert_neg2: {value: 0.0335, tol: 0.008}
  span_order3_kmer:       {value: 6.60, tol: 1.60}
  span_order3_cnn:        {value: 8.43, tol: 1.80}
  span_order3_splicebert: {value: 3.54, tol: 0.50}
  min_span_order3_ci_low: 1.0
  # The denominator behind those spans. The caution is only honest while it holds.
  max_smallest_arm_order3: 0.005
  # The exception. 1.29 (gc) and 1.37 (dn) sit above 1 and neg2 sits BELOW, so the "k-mer is
  # the more fragile model under a raised baseline" reading is a two-of-three statement, the
  # same shape as the apparent-difficulty ordering's SpliceBERT exception.
  corrected_ratio_neg2: {value: 0.91, tol: 0.15}
  # Concentration, panel-size invariant. The raw share fell 51% -> 21% and that is the panel
  # tripling, not dispersion; over-representation ROSE.
  top3_over_representation_gc: {value: 4.66, tol: 0.80}
  contrast_order3_kmer:       {value: 0.0067, tol: 0.003}
  contrast_order3_cnn:        {value: 0.0309, tol: 0.007}
  contrast_order3_splicebert: {value: 0.0545, tol: 0.008}
  # THE SHARE IS A RATIO AND ITS DENOMINATOR DID THE WORK. The first version of R1r led with
  # "the k-mer keeps 22%, SpliceBERT keeps 75%" and concluded the k-mer is uniquely FRAGILE.
  # Withdrawn: the order-3 baseline absorbs almost the SAME ABSOLUTE amount from every model
  # (+0.021 gc, +0.054 dn), and on the dinuc arm SpliceBERT minus k-mer is indistinguishable
  # from zero. The shares follow from the totals. These keys force the absolute column to be
  # present and to stay close, so the fragility reading cannot be restored.
  absorbed_kmer_gc:       {value: 0.0208, tol: 0.004}
  absorbed_cnn_gc:        {value: 0.0130, tol: 0.004}
  absorbed_splicebert_gc: {value: 0.0222, tol: 0.004}
  absorbed_kmer_dn:       {value: 0.0538, tol: 0.008}
  absorbed_splicebert_dn: {value: 0.0540, tol: 0.008}
  # The absorption is a CONSTANT across model classes, not a capacity effect. If this ever
  # exceeds the bound, R1r's mechanism changes and the section must be rewritten.
  max_absorbed_spread_gc: 0.010
  # THE RESULT THAT REPLACED THE SHARES: over a trinucleotide baseline the 4-mer is not
  # reliably positive and SpliceBERT is positive everywhere. A mean of +0.0058 hid this.
  kmer_order3_positive_gc:       {value: 65, tol: 4}
  cnn_order3_positive_gc:        {value: 80, tol: 4}
  splicebert_order3_positive_gc: {value: 94, tol: 0}
  splicebert_order3_positive_dn: {value: 94, tol: 0}
  splicebert_must_be_positive_everywhere: true

  # AND THE WITHDRAWN CLAIM STAYS WITHDRAWN. SpliceBERT has the LOWEST multiplier at both
  # orders, so the order-3 table cannot be used to revive "the contrast grows with capacity".
  multiplier_order3_kmer:       {value: 2.16, tol: 0.30}
  multiplier_order3_cnn:        {value: 2.55, tol: 0.30}
  multiplier_order3_splicebert: {value: 1.82, tol: 0.25}
  splicebert_multiplier_must_be_lowest: true

# --- R1p: external validation on Horlacher's own benchmark, and where it LIMITS us --------
#
# Every other result is measured on windows this project built. This one is not: same nested
# decomposition, Horlacher et al. 2023's published negative sets, THEIR fold assignments, on
# 45 size-stratified datasets of the 88 our panel shares with their 223.
# Zenodo 10.5281/zenodo.10600977, md5 c93a38b8bd684be2ccb5f6f82c6c4700, verified.
#
# WHAT REPLICATES:
#   * the RANGE. Their two negative sets give 2.38x, against 2.50x for our dinuc/GC pair.
#     Measured on their positives, their peaks, their folds. This is the strongest external
#     support the paper has.
#   * the BASELINE GRADIENT. Within-dataset spearman(delta baseline, delta gain) = -0.372,
#     p = 0.012, the same sign as our -0.664.
#
# WHAT DOES NOT, AND IT LIMITS R1n:
#   * the sign does NOT reverse. On our data, where the alternative protocol lowers the
#     baseline the contrast flips (-0.0212 -> +0.0028). On theirs it does not: -0.0409 where
#     negative-2 raises the baseline, -0.0184 where it lowers it. The gradient is there (the
#     deficit halves in the predicted direction) but negative-2 gives less regardless.
#
# CONCLUSION THE PAPER MUST DRAW. R1n's strong form -- "the protocol label carries essentially
# no information beyond the baseline" -- holds on our windows and NOT on theirs. The honest
# claim is the weaker one: the baseline explains most of the protocol dependence and, on our
# data, all of it; on an independent benchmark a protocol-specific residual remains.
r1p_horlacher:
  n_datasets: 45
  composition_n1: {value: 0.8211, tol: 0.020}
  composition_n2: {value: 0.7560, tol: 0.020}
  gain_n1:        {value: 0.0395, tol: 0.008}
  gain_n2:        {value: 0.0166, tol: 0.006}
  contrast_n2_minus_n1: {value: -0.0229, tol: 0.007}
  # THE EXTERNAL VALIDATION. Their range must be comparable to ours or the claim does not
  # travel. Ours is 2.50x for the corresponding two-protocol comparison.
  fold_range_their_data: {value: 2.38, tol: 0.45}
  min_fold_range_their_data: 1.6
  # The gradient must replicate in SIGN.
  within_dataset_spearman: {value: -0.372, tol: 0.12}
  gradient_must_replicate_in_sign: true
  # AND THE LIMITATION, ASSERTED so it cannot be dropped: the sign does NOT reverse on their
  # data, unlike ours. If a future run makes it reverse, R1n's strong form is restored and
  # that must be a deliberate decision, not a silent one.
  gain_diff_n2_baseline_higher: {value: -0.0409, tol: 0.012}
  gain_diff_n2_baseline_lower:  {value: -0.0184, tol: 0.010}
  sign_must_not_reverse_on_their_data: true

# --- R1q: does the recommendation actually help? Measured, not asserted ------------------
#
# THE GAP THIS FILLS. Everything up to here shows that NOT reporting the composition baseline
# is a problem. Nothing showed that DOING it helps. A benchmarking paper whose recommendation
# is untested is a complaint, not a contribution.
#
# THE TEST. Put a reader in the position the recommendation is meant to rescue: two papers,
# two protocols, comparing what the models contributed. Raw contributions against the
# headroom-normalised coordinate the two-number report buys.
#
#   rank agreement (Spearman, scale-free)   improves in 3/3 pairs
#   disagreement on a common scale          shrinks in 3/3 pairs, by 58%, 10% and 48%
#
# HONEST LIMIT, GATED: only the GC-vs-dinucleotide rank improvement has an interval clear of
# zero (+0.007 to +0.115). The other two are consistent in direction and not individually
# significant, and the paper must say so. The DISAGREEMENT reduction is the stronger half.
r1q_recommendation:
  rank_raw_gc_dn:        {value: 0.848, tol: 0.05}
  rank_headroom_gc_dn:   {value: 0.899, tol: 0.05}
  rank_gain_gc_dn:       {value: 0.051, tol: 0.03}
  disagreement_raw_gc_dn:      {value: 1.151, tol: 0.15}
  disagreement_headroom_gc_dn: {value: 0.482, tol: 0.10}
  disagreement_raw_dn_neg2:      {value: 1.552, tol: 0.20}
  disagreement_headroom_dn_neg2: {value: 0.802, tol: 0.15}
  n_pairs: 3
  # THE CLAIM: the direction must be consistent across every pair, on both measures.
  pairs_rank_improves: 3
  pairs_disagreement_shrinks: 3
  recommendation_must_help_on_every_pair: true
  # AND THE LIMIT: at least one pair's rank improvement must be individually significant, or
  # the claim is direction-only and has to be worded that way.
  min_significant_rank_pairs: 1

# --- R2: four models on identical splits ----------------------------------------------
r2_four_models:
  composition: {value: 0.628, tol: 0.020}
  kmer:        {value: 0.688, tol: 0.020}
  cnn:         {value: 0.708, tol: 0.025}
  splicebert:  {value: 0.809, tol: 0.025}
  # Ordering is the claim; it must hold exactly.
  required_order: [composition, kmer, cnn, splicebert]
  splicebert_beats_composition_fraction: {value: 1.0, tol: 0.0}

# --- R3: positional concentration (ISM Gini) ------------------------------------------
r3_locality:
  kmer_gini_median:       {value: 0.295, tol: 0.030}
  splicebert_gini_median: {value: 0.351, tol: 0.035}
  median_difference:      {value: 0.062, tol: 0.020}
  # The strong form: SpliceBERT is more concentrated on the large majority, and REVERSED
  # on none beyond noise. The zero is the part that matters.
  fraction_splicebert_higher_min: 0.85
  n_significantly_reversed_max: 0
  wilcoxon_p_max: 1.0e-10

# --- R4: the ClinVar ladder -----------------------------------------------------------
# Three rungs. The claim is the GAPS between them, so each is checked and so is the order.
# --- R4: the ClinVar arm, PAIRED PER DATASET ------------------------------------------
#
# THE POOLED LADDER IS NO LONGER THE REPORTED RESULT, and this block is the record of why.
#
# variant_ladder() concatenates ~19k variants across 95 datasets into one AUROC per arm.
# That is inflated: a dataset's mean |delta| correlates with its pathogenic rate at Spearman
# +0.73 for the matched arm and spans 10.4x across datasets, so the pooled number partly
# measures which dataset a variant came from. Matched pooled 0.829 against 0.755 paired;
# the pooled specificity gap of +0.149 is really +0.065.
#
# Conservation was the only arm immune, because phyloP is on a fixed external scale. That is
# why the artefact stayed invisible for so long: the arm that could not be inflated was
# winning anyway, so nothing looked wrong.
#
# The previous version of this block asserted the pooled numbers and passed, which is the
# sharpest lesson in this file: a gate that checks the number the code computed, rather than
# whether that number is the right statistic, reads as confirmation.
r4_paired_specificity:
  # The adequately powered stratum is the headline. Median coverage is 140 variants per
  # dataset and many carry a handful of pathogenic ones, so the all-datasets stratum is
  # noise-dominated -- it is asserted here too, unflattering value included, because
  # reporting only the stratum that works is the thing this project exists not to do.
  min_pathogenic_headline: 20
  n_datasets_headline:    {value: 44,     tol: 3}
  matched_auroc:          {value: 0.7553, tol: 0.03}
  mismatched_auroc:       {value: 0.6908, tol: 0.03}
  conservation_auroc:     {value: 0.8921, tol: 0.025}
  specificity_gap:        {value: 0.0645, tol: 0.025}
  specificity_p_max:      0.01
  matched_wins_min_fraction: 0.65
  # Conservation must still lead. If a model ever beats phyloP here that is a real result,
  # but it would need saying out loud rather than slipping through a tolerance.
  conservation_lead:      {value: 0.1368, tol: 0.05}
  # The all-datasets stratum, which shows NOTHING. Asserted so it cannot be quietly dropped.
  all_datasets_gap:       {value: -0.0114, tol: 0.03}
  # The effect must grow with power. A spurious gap would not.
  gap_power_rho_min:      0.30
  # Within-dataset standardised, conservation-controlled, cluster-bootstrapped coefficients.
  coef_matched_within:    {value: 1.1238, tol: 0.12}
  coef_mismatched_within: {value: 0.6379, tol: 0.10}
  # The two CIs must not overlap, or the specificity claim is not established.
  coef_cis_must_separate: true
  min_clusters: 800
  # THE TRIVIAL POSITIONAL BASELINE, and it is the most deflating number in the study.
  #
  # "What fraction of the OTHER variants in this 1-Mb window are pathogenic" uses no sequence,
  # no model and no biology. Leave-one-out, so a variant never contributes to its own window.
  # It reaches 0.814 where the model reaches 0.755, and the model does not beat it in ANY
  # stratum: 15/44 wins at >=20 pathogenic (p=0.007 AGAINST the model), and a tie at >=50
  # (p=0.53). Pooled it is 0.818 against the model's inflated 0.829.
  #
  # This is asserted, with the sign that embarrasses us, for one reason: it means absolute
  # AUROC on peak-proximal ClinVar variants is uninformative about model utility, and any
  # version of this paper that reports 0.755 as evidence of usefulness is wrong. What survives
  # is the PAIRED specificity contrast, which this baseline cannot explain because it applies
  # equally to both arms.
  block_prevalence_auroc: {value: 0.8139, tol: 0.03}
  # The model must NOT be claimed to beat it. A positive value here would be a real result
  # and would need arguing for, not absorbing into a tolerance.
  model_minus_prevalence_max: 0.02
  # The composition share, with the interval it was missing.
  composition_share_gc:    {value: 0.948, tol: 0.03}
  composition_share_dinuc: {value: 0.678, tol: 0.04}
  composition_share_drop:  {value: 0.270, tol: 0.05}
  # THE SHARE IS A PROPERTY OF THE TASK *AND THE MODEL*, and stating it without naming the
  # model is the error this project made in its own summaries for two weeks. The three above
  # are measured against the k-mer model, because that is what the rehearsal arm trains.
  # Same estimator, same datasets, same negatives -- only the model changes:
  composition_share_vs_kmer:       {value: 0.6818, tol: 0.035}
  composition_share_vs_cnn:        {value: 0.6197, tol: 0.035}
  composition_share_vs_splicebert: {value: 0.4137, tol: 0.035}
  # THE CONTRAST IS NOT A FINDING. Retracted as a headline one day after being
  # promoted to one, and kept here with the reason attached.
  #
  # share_m = C / gain_m, where C = mean(composition_auroc) - 0.5 is IDENTICAL for every
  # model. So share_kmer / share_SB == gain_SB / gain_kmer, exactly -- verified to 6 decimal
  # places (1.648166 both ways). The "model-dependent composition share" is therefore a
  # monotone rescaling of the four-model AUROC ladder, which is R2, which was cut in round 2
  # as prior art (Horlacher 2023). And SpliceBERT beats the k-mer model on 95/95 datasets, so
  # the contrast excludes zero with probability 1: the interval was decoration.
  #
  # THE SUBSTANTIVE VERSION OF THIS CLAIM IS UNMEASURED. "The negative-set protocol does not
  # penalise every model equally" needs each model's AUROC drop from GC- to dinuc-matched
  # negatives. Only composition and k-mer have both arms: sweep_dinuc.csv is the only sweep
  # table and its `arm` column is {'dinuc'}, so the CNN and SpliceBERT never ran on GC-matched
  # negatives. Measuring it costs GPU time and has not been spent.
  composition_share_model_gap:    {value: 0.2681, tol: 0.05}
  # Replaces composition_share_model_gap_ci_excludes_zero, which asserted something true by
  # construction. This asserts the IDENTITY instead, which is a real invariant: if the
  # estimator is ever changed so that the share stops being C/gain, this fails and whoever
  # changed it finds out.
  share_ratio_equals_inverse_gain_ratio_max_diff: 1.0e-6
  # Cross-check: the k-mer share here is the same quantity as composition_share_dinuc above,
  # computed from a different table. If these two ever disagree, one of the tables is wrong.
  kmer_share_cross_check_max_diff: 0.01

  # Both paired claims must be robust to dataset size. They are paired within dataset, so
  # size cannot confound them; this bounds effect MODIFICATION.
  size_rho_max: 0.35
  # THE FOUR ATTACKS, from a council review. Each was raised as a reason the specificity
  # result is not real, and each is recomputed every run so a regression fails the build.
  #
  # The coefficients above were previously WRONG, and too SMALL rather than too large:
  # fit_delta_coef applied abs() to a value the caller had already standardised within
  # dataset, folding the below-mean half of a z-score back over the above-mean half. Caught
  # because the same contrast returned 0.729 from the pipeline and 1.169 from a hand-written
  # design matrix. Corrected: 1.124 vs 0.638, still non-overlapping, larger than reported.
  attack_gap_power_spearman_min: 0.85    # dose-response, not a cherry-picked cutoff
  attack_floor_range_max:        0.05    # the wrong-protein floor must stay flat
  attack_survives_trivial_rule:  true    # CIs must still separate with prevalence controlled
  attack_null_gap_abs_max:       0.01    # permutation null must sit at zero
  # The trivial rule must DECAY with window size, or it is a binning artefact rather than a
  # positional-prevalence effect. All three are asserted, including the 100 kb value that is
  # the most damaging number in the study.
  trivial_rule_100kb:  {value: 0.8512, tol: 0.03}
  trivial_rule_1mb:    {value: 0.8177, tol: 0.03}
  trivial_rule_10mb:   {value: 0.7330, tol: 0.04}

  # THE CIRCULARITY CAVEAT ON R1, and it limits what may be claimed.
  #
  # The composition baseline's 19 features ARE GC and dinucleotide frequencies, and the
  # dinucleotide arm matches negatives on exactly those. So the drop from 94.8% to 67.8% is
  # partly by construction: the matcher deletes the baseline's input. The 27-point difference
  # therefore measures the matcher, not biology, and MUST NOT be the headline.
  #
  # What is not circular is the FIRST number on its own. Under GC-matched negatives -- the
  # protocol actually in use in published work -- a 19-feature composition model recovers
  # 94.8% of measurable skill. That is a statement about a protocol, not about our matcher.
  # The 67.8% is a by-construction floor and is reported as a residual, not an achievement.
  r1_headline_is_gc_share_only: true

  # The three controls that tested whether the wrong-protein floor is a similarity artefact.
  # All three must stay negative or the control is contaminated and R4 must be withdrawn.
  floor_cell_line_p_min:  0.05
  floor_donor_strength_rho_max: 0.40

# --- R4: the pooled ladder, retained for comparison only ---
r4_variant_ladder:
  # ESTABLISHED FROM THIS PIPELINE'S OWN RUN, not carried over.
  #
  # Every other block here was re-established when the pipeline was rebuilt. R4's was not,
  # because R4 could not complete until the ClinVar arm ran for the first time -- so these
  # numbers stayed at the earlier study's until now, and stage 14 was comparing this pipeline
  # against a different one.
  #
  # WHAT AGREES, to three or four decimals, and it is the part the result rests on:
  #   matched head AUROC   0.8294  (was 0.8286)
  #   conservation AUROC   0.9078  (was 0.9077)
  #   matched coefficient  1.6054  (was 1.6156)
  #
  # WHAT MOVED, and why. The k-mer and mismatched rungs both shifted up. Checked properly
  # rather than assumed: restricting this run to the earlier panel of 94 datasets reproduces
  # n = 18,991 exactly and still gives kmer coef 0.204, so the panel is NOT the cause. The
  # k-mer VARIANT deltas themselves differ (labels 100% identical, deltas correlate 0.825),
  # because the k-mer model is refit on regenerated matched negatives and its per-variant
  # delta is far more sensitive to that resampling than its binding AUROC, which reproduced
  # exactly at 0.6875. The mismatched rung moved because its donor pairing is
  # (index + 47) % len(manifest), and the manifest is 95 here rather than 94.
  #
  # Both are properties of this pipeline, not defects: the negatives are seeded
  # (default_rng(7)) so this run is deterministic. Tolerances below are unchanged in width;
  # only the centres move. The ladder's ordering, its monotone coefficients and the
  # specificity gap -- the three things the claim actually needs -- all hold either way.
  kmer_auroc:               {value: 0.552, tol: 0.030}
  mismatched_head_auroc:    {value: 0.680, tol: 0.035}
  matched_head_auroc:       {value: 0.829, tol: 0.035}
  conservation_auroc:       {value: 0.908, tol: 0.020}
  required_order: [kmer_auroc, mismatched_head_auroc, matched_head_auroc, conservation_auroc]
  # Cluster-corrected coefficients. The naive interval is ~30% too narrow and must not be
  # what gets reported; the verifier checks the clustered one.
  matched_coef:      {value: 1.605, tol: 0.150}
  mismatched_coef:   {value: 0.700, tol: 0.120}
  kmer_coef:         {value: 0.201, tol: 0.060}
  # The specificity claim: matched must clearly exceed mismatched, or the signal is not
  # binding-specific and R4 must be withdrawn.
  matched_minus_mismatched_min: 0.60
  # Inference must be clustered, not per-row.
  min_clusters: 800

# --- integrity gates, not science -----------------------------------------------------
integrity:
  # These are now READ. max_nan_fraction and min_tests_passing were declared here and never
  # looked at by verify_integrity, so two of three integrity gates were decorative in the one
  # file whose entire purpose is that the gate is real.
  max_nan_fraction: 0.0
  duplicate_datasets_allowed: 0
  # Checked against the actual suite, not a number typed once and left to drift. It read 480
  # while the suite had grown to 575.
  # 607 collect locally after the local-store shim added 10. Raised with the suite, because
  # a floor left behind is the bug this key exists to prevent: it once read 480 while the
  # suite had grown to 576.
  min_tests_passing: 695
  # HOW MANY CHECKS RAN, asserted, because almost every gate in verify.py is written
  # `if value is not None:` and therefore DISAPPEARS when a row is missing instead of failing.
  # Deleting five rows from one table once produced "106/106 passed". Asserting the count
  # catches that for every gate at once, including the ones nobody has attacked yet.
  # Raise this deliberately when checks are added; that is the point, not an inconvenience.
  # Counts the DOMAIN checks only, i.e. everything except this meta-check itself, so the
  # number here is directly comparable to the per-section output above it.
  # THE FLOOR IS NOT THE TOTAL, and reading the total off the summary line and pasting it here
  # breaks the run. min_domain_checks is compared against the DOMAIN checks only, which excludes
  # both this check itself and the manuscript-coverage check appended after it, so the floor
  # sits two below the "N/N checks passed" line. Pasting 859 for a run that printed 860 made the
  # count check fail, which then read as an artefact discrepancy that did not exist.
  min_domain_checks: 980
  # A RATCHET ON UNSOURCED NUMBERS. scripts/audit_manuscript.py extracts every value quoted to
  # >= 3 decimals in the manuscript and reports the ones traceable to no committed table and no
  # key here. It has already paid for itself twice: it found six cells of R1's OWN headline
  # table computed on the fly and stored nowhere (precisely the state the +0.0397 contrast
  # survived six review rounds in, now written by scripts/scale_check.py), and it found that
  # R4's five-row table splices its top row in from a different table with a different n.
  #
  # 45 IS NOT A CLEAN BILL OF HEALTH. Most survivors are aggregates over a SUBSET, such as the
  # mean conservation AUROC over the 44 powered datasets, which no whole-column aggregate can
  # reproduce. They need triaging one at a time, and the legitimate ones need emitting into
  # tables so this can ratchet toward zero. Until then the gate buys one thing, which is that a
  # NEW unsourced number fails the build.
  #
  # DO NOT RAISE THIS TO MAKE A BUILD PASS. Add the number to the table that owns it.
  #
  # NOW ZERO, and down from 45. Three things got it there. Cutting the dead sections removed
  # most of them. The last two floats, 0.127853 and 1.648166, were the algebraic identity that
  # retracted the composition-share claim; they left the prose with that retraction and this
  # ceiling stayed at 2 after they were already gone, which is how a ratchet quietly stops
  # ratcheting. And audit_manuscript.py now checks BARE INTEGERS, which it never did: that
  # found 18 more, every one of them a correct number that no result table could ever source,
  # because a count is a property of a table's shape and not an aggregate of its values.
  # scripts/manuscript_constants.py now derives each of those from its actual source -- the
  # config, the constructed model object, the committed evidence tree -- so they are checked
  # rather than exempted.
  #
  # AT ZERO, ANY ORPHAN AT ALL MEANS SOMEONE PRINTED A NUMBER WITH NO SOURCE.
  max_manuscript_orphans: 0
  # Duplicated numbers must agree. cost_of_matching.csv is a join of the two rehearsal arms and
  # verify.py read only the join, so scrambling rehearsal_binding_dinuc.csv passed 166/166
  # while breaking 88/94, 94/94 and the Wilcoxon p. Exact equality: these are copies, not
  # recomputations, so any difference at all is corruption.
  max_cross_table_diff: 0.0
  # THE --from-cache TABLES ARE EVIDENCE AND WERE UNGATED. Zeroing every per-arm gain in
  # k_sweep_per_dataset.csv and every AUROC in strand_placebo_per_dataset.csv reproduced both
  # summaries bit-for-bit and passed, so R1e's "rebuilt from raw sequence" reproduced from a
  # table of zeros. These two keys assert the arithmetic linking evidence columns to summary
  # columns, and the rebuild against the published rehearsal values.
  max_cache_arithmetic_diff: 1.0e-12
  max_rebuild_vs_published_diff: 2.0e-3

# --- the wrong-protein control's donor must actually be a WRONG protein -----------------
#
# RETRACTED, and left here with its own record because deleting it would hide
# the most instructive failure in this project.
#
# The original block asserted `clean_donor_gap: 0.1210` on the 17 donors with "negligible
# overlap", and `floor_overlap_rho_max: 0.45` as a CEILING on the floor-vs-overlap
# correlation. Both were wrong, in opposite directions:
#
#   1. The ceiling gated the opposite of the claim. The clean-donor result REQUIRES a real
#      floor-vs-contamination association to exist; the gate passed as long as it was WEAK.
#      A gate that passes when the claim fails is worse than no gate.
#   2. `shared_frac = |t&d|/|t|` is normalised by the target, so it cannot be large when the
#      donor is small. It correlated with donor variant-set size at rho=+0.696, and
#      controlling for that the flagship association reversed and died (+0.299 p=0.049 ->
#      -0.240 p=0.12). It was measuring donor size wearing a contamination costume.
#   3. The placebo settled it: splitting the same 44 datasets by donor SIZE reproduced the
#      "clean donor" result BETTER (+0.1362, 16/17) than splitting by co-binding overlap
#      (+0.1210, 16/17). A variable with nothing to do with co-binding beat the real one.
#
# Superseded by r4_multidonor below, which screens donors on JACCARD (size-symmetric) and
# spans donor quality instead of stratifying on a proxy for it.
donor_overlap_RETRACTED:
  see: r4_multidonor

# --- the multi-donor wrong-protein control ----------------------------------------------
#
# Five donors per target instead of one, drawn to SPAN donor binding quality (-0.296..+0.296
# realised) and screened to jaccard <= 0.02. 474/475 tasks, 409 usable (target, donor) pairs.
#
# THE VERDICT THIS ENCODES IS "NOT IDENTIFIED", NOT "CONFIRMED". Three reviewers set
# acceptance criteria BEFORE seeing this table and all three ruled the same way: the effect
# is real on the powered stratum, absent on the full panel, and therefore conditional. The
# gates below assert BOTH panels for exactly that reason -- asserting only the powered one is
# how the retracted block above survived as long as it did.
r4_multidonor:
  n_pairs:              {value: 409, tol: 12}
  n_targets_all:        {value: 82,  tol: 2}
  n_targets_powered:    {value: 44,  tol: 3}
  # The confound that killed the single-donor design must be GONE. This is the gate that
  # would have caught the original error, and it is the only one here that matters.
  gap_vs_donor_advantage_rho_max: 0.20   # was -0.533 in the single-donor arm
  # Powered stratum: the effect is present.
  powered_gap:          {value: 0.0880, tol: 0.025}
  powered_wins_min_fraction: 0.80
  powered_p_max:        1.0e-05
  powered_intercept:    {value: 0.0784, tol: 0.030}
  powered_intercept_ci_excludes_zero: true
  # The stratum where the donor is the STRONGER model. The single-donor design returned a
  # null here (-0.0025, 9/18, p=1.00) and that null was a one-draw artifact.
  stronger_donor_gap:   {value: 0.0920, tol: 0.030}
  stronger_donor_wins_min_fraction: 0.80
  # THE FULL PANEL, WHICH SHOWS NOTHING. Asserted with the unflattering value, because the
  # disagreement between the two panels IS the result.
  all_panel_gap:        {value: 0.0124, tol: 0.025}
  all_panel_intercept:  {value: 0.0068, tol: 0.030}
  all_panel_intercept_ci_excludes_zero: false
  # Adding power as a covariate removes the powered-stratum effect too. Also asserted.
  powered_intercept_with_power: {value: 0.0236, tol: 0.030}
  powered_intercept_with_power_ci_excludes_zero: false
  # The mechanism: the floor is flat in power, the matched arm is not.
  floor_vs_power_rho_max:   0.25
  matched_vs_power_rho_min: 0.45

# --- the negatives are ~45% antisense, and that must not be what the contrast measures ----
#
# `negatives.py:328` gives each negative the POSITIVE's strand. A negative's location is
# chosen to match composition, not strand, so whether it lands on a gene running the assigned
# direction is a coin flip: measured 55.2% sense. The other 45% are sequence no transcript
# produces, while every positive is true sense RNA.
#
# This is a non-compositional cue that survives dinucleotide matching (matching is done on
# forward DNA and revcomp applies to both pair members), and a pre-mRNA language model can
# read direction where a dinucleotide model cannot. So it is a live alternative explanation
# for composition_share_model_gap and it has to be gated, not just mentioned.
#
# It loses on the DIFFERENTIAL. The artifact must act unequally on the two models to create a
# contrast between them, and it does not: it moves both shares hard (rho +0.41 and +0.52) and
# the contrast not at all (rho +0.23, p=0.16). Splitting the panel at the median sense
# fraction gives contrast +0.249 in the antisense-rich half and +0.264 in the antisense-poor
# half -- the objection predicts a much LARGER contrast where the artifact is strongest, and
# the data give a slightly smaller one.
strand_audit:
  # WHAT THIS BLOCK USED TO CONTAIN, AND WHY IT IS GONE. Six keys here gated the stability of
  # the composition-SHARE contrast across antisense-rich and antisense-poor halves
  # (contrast_rho_max, contrast_rho_p_min, share_rho_min, contrast_antisense_rich 0.2485,
  # contrast_antisense_poor 0.2644, contrast_halves_max_diff). That contrast is RETRACTED: it
  # is an algebraic identity, share_m = C/gain_m with C constant across models, so
  # share_kmer/share_SB equals gain_SB/gain_kmer exactly and the comparison excluded zero with
  # probability 1. Gating a retracted quantity is worse than not gating it, because the passing
  # count then certifies something the paper does not claim -- and those six checks were part
  # of every "N/N passed" this project has reported.
  #
  # WHAT SURVIVES is the measurement itself, which is real and is a genuine limitation:
  # negatives inherit the POSITIVE's strand (negatives.py:328), so only ~55% of them carry
  # their own gene's strand and the rest are antisense. It inflates every absolute AUROC in R1.
  frac_sense:              {value: 0.552, tol: 0.06}
  frac_no_gene_max:        0.02      # negatives really are inside genes, so "antisense" is meaningful

# --- the correctness half of verification -------------------------------------------------
#
# Every other block here is checked by reading a table the analysis pass wrote, so the gate
# detects DRIFT and not ERROR: corrupting an input and re-running verify.py produced zero
# failures when someone finally tested it. This block is checked by recomputing the published
# AUROC from the per-example scores committed under data/evidence/, for both deep
# architectures. Zeroing the score column makes it report max|diff| ~0.45 and fail, so unlike
# the rest of this file it cannot pass on nonsense.
recompute:
  max_abs_diff: 1.0e-09    # sklearn on identical floats; anything larger is drift
  min_datasets: 90         # of 95; a few absent folds is a broken mirror, not a broken claim

# --- R4: incremental value over conservation and position (the primary ClinVar claim) -----
#
# PROMOTED TO PRIMARY after review, and gated at the same time, because the
# last claim promoted to a headline without a gate turned out to be an algebraic identity.
#
# The previous framing ("conservation 0.892 and a positional rule 0.818 beat the model 0.755")
# is a replication of Grimm 2015 / Schreiber 2020 AND is circular: PP3 evidence behind ClinVar
# pathogenic assertions is conservation-derived, so phyloP partly re-reads the labels. An
# incremental-value analysis is immune to that, because label leakage inflates a competitor's
# AUROC without manufacturing incremental value for the model.
#
# What must hold: the model's coefficient barely moves when conservation is controlled, it does
# not collapse when the positional rule is added, and the wrong-protein arm stays separated.
r4_incremental_value:
  coef_matched_unconditional:   {value: 1.1238, tol: 0.06}
  coef_matched_given_phylop:    {value: 1.1214, tol: 0.06}
  coef_matched_given_both:      {value: 1.1689, tol: 0.07}
  coef_mismatched_given_phylop: {value: 0.6364, tol: 0.06}
  # THE CLAIM. Conditioning on conservation must not explain the model away. Stated as a
  # fraction so it cannot be satisfied by both coefficients drifting together.
  max_attenuation_fraction:     0.10
  # The arms must stay separated under control, or "specific to the protein" is unsupported.
  arms_must_not_overlap_under_control: true
  # The positional rule must remain informative WITHIN conservation strata, or it is just
  # conservation in disguise and the paper has one baseline, not two.
  positional_rule_min_auroc_within_phylop_decile: 0.70
  # The two positional-rule numbers the paper actually prints, which were ungated while the
  # floor above was the only assertion. They also both MOVED: prevalence was computed on the
  # pre-deduplicated assignment table (2.40 rows per variant), so leave-one-out removed one
  # copy and left ~1.4 copies of a variant's own label in its own block. 0.8246 -> 0.8164 and
  # 0.7678 -> 0.7548 after deduplicating first.
  positional_rule_unstratified_auroc: {value: 0.8164, tol: 0.010}
  positional_rule_phylop_spearman:    {value: 0.3375, tol: 0.030}

# --- the estimator R4 needed, done correctly, on the arm that is in the repo -----------
#
# WHAT THIS BLOCK REPLACES. `variant_specificity_refit.csv` was built by a caller that passed
# conservation into EVERY fit, so its "controls = none" row was already adjusted and the
# published "0.21% attenuation" was the effect of dropping 168 rows. The keys above
# (r4_incremental_value) still gate those retracted numbers and must not be trusted; this
# block gates the corrected procedure on the k-mer arm, which is the only variant score table
# committed to the repo. It is a methods demonstration, not R4.
#
# THE POINT, AND IT INVERTS THE ORIGINAL READING. Near-zero attenuation was presented as
# evidence that the model's signal is independent of conservation. It is the opposite. Logistic
# regression is not collapsible, so a covariate this strong (phyloP coefficient ~2.12) AMPLIFIES
# the other coefficient by ~65% when it is genuinely independent. Landing at ~0% therefore
# requires real sharing, and the amount of sharing it requires (rho ~0.085) is close to the
# correlation actually measured (rho ~0.065). The two agree, so the picture is consistent and
# the original conclusion was backwards.
r4_unconditional_refit:
  coef_unconditional_within: {value: 0.2915, tol: 0.020}
  coef_conditional_within:   {value: 0.3067, tol: 0.020}
  # Raw attenuation is near zero AND flips sign between the two standardisations (+0.024
  # pooled, -0.052 within). That instability is itself a reason it was never a safe headline.
  max_abs_raw_attenuation:   0.10
  # The null, twice, by independent routes. If the simulation and the closed form disagree,
  # one of them is broken and the interpretation rests on nothing. The first attempt at this
  # simulation WAS broken -- it drew the covariate from the label, making it a collider, and
  # reported -1.5% instead of -68% -- which would have reproduced the retracted conclusion.
  # CORRECTED TWICE, BOTH CORRECTIONS RECORDED. First the null was built by drawing the
  # covariate FROM the label, which makes it a collider: -1.5%. Then by forward simulation with
  # a NORMAL covariate: -68%. Non-collapsibility depends on the omitted covariate's whole
  # distribution and not only its variance, and phyloP is skewed (+1.04, sd 3.19, range -20 to
  # +10), so it is now drawn through a Gaussian copula onto phyloP's empirical marginal: -87%.
  # Every correction moved the null further from zero, i.e. every earlier version was
  # anti-conservative. Seeds raised 12 -> 40 (seed-to-seed sd was ~0.054).
  null_attenuation_simulated: {value: -0.8740, tol: 0.040}
  # NOT A CROSS-CHECK, AND NO LONGER GATED AS AGREEMENT. 1 - sqrt(1 + 0.346 c^2) is a
  # small-sigma probit approximation; at c = 2.12 it is far outside its range and it is
  # anti-conservative. This file previously asserted the two "must agree" to within 0.15, which
  # gated a known-invalid approximation against the correct simulation. Pinned, not compared.
  null_attenuation_analytic:  {value: -0.6005, tol: 0.040}
  # THE CLAIM. Both standardisations must show a large positive excess over the null.
  min_excess_attenuation:    0.60
  # SELF-VALIDATION, AND IT IS WEAKER THAN IT LOOKED. With the corrected marginal the
  # attenuation implies rho ~0.098 against a measured ~0.064. Same order, same sign, which is
  # what supports the reading -- but they no longer agree to 0.02 as they appeared to under the
  # normal-marginal null, and the tolerance now says so.
  implied_rho:               {value: 0.0978, tol: 0.020}
  measured_rho:              {value: 0.0640, tol: 0.015}
  max_implied_measured_gap:  0.045

# --- R1s: whose property is the protocol multiplier? -------------------------------------
#
# README.md asserted "a property of the PROTEIN (68.9% of variance) not the model
# (1.5%)" from a referee agent's decomposition that lived in no script and no table. Recomputed
# over the 262 (dataset x model) cells where both arms are positive, on the LOG multiplier, it
# approximately reproduces -- and a permutation null changes the reading.
#
# PROTEIN HAS 79 LEVELS. A 79-level factor absorbs 29.7% of the variance of RELABELLED data, so
# "68.9% against 1.5%" is mostly degrees of freedom rather than a finding. The comparable
# statistic is each factor's excess over its OWN null. On that scale protein is far ahead
# (+35.1, p < 0.0005), cell line is noise (p = 0.49) and MODEL CLASS IS NOT NULL (p = 0.023) --
# consistent with R1g's own record that SpliceBERT's multiplier is significantly lower.
r1s_multiplier_variance:
  n_cells: 262
  n_proteins: 79
  share_protein: {value: 0.648, tol: 0.05}
  share_model:   {value: 0.028, tol: 0.02}
  share_cell:    {value: 0.002, tol: 0.01}
  null_protein:  {value: 0.297, tol: 0.05}
  excess_protein: {value: 0.351, tol: 0.06}
  panel_multiplier: {value: 2.99, tol: 0.20}
  # CORRECTED. The wholesale-y null above is TOO PERMISSIVE and the +35.1 excess it
  # reports is about five-fold too generous. It destroys the protein effect AND the
  # within-dataset correlation among the model cells that share windows, labels and folds -- and
  # since 79 proteins sit on 94 datasets, protein is very nearly the DATASET factor (68.0% as a
  # factor in its own right, MORE than protein's 64.8%). A null that permutes protein labels
  # between datasets, keeping each (dataset x model) block intact, isolates protein identity
  # from experiment identity and is the null the claim needs.
  share_dataset: {value: 0.680, tol: 0.05}
  null_protein_block:   {value: 0.576, tol: 0.05}
  excess_protein_block: {value: 0.072, tol: 0.030}
  # AND THE DIRECT TEST, which is stronger than any variance share and is what the section now
  # leads with: does the SAME protein get the same multiplier in the other cell line?
  cross_cell_r:   {value: 0.582, tol: 0.10}
  cross_cell_rho: {value: 0.605, tol: 0.10}
  cross_cell_n:   {value: 40, tol: 0}
  # B13. THE INTERVAL, BECAUSE n IS 15. The collapsed correlation is the paper's "direct test"
  # of reproducibility across cell lines, and it was quoted with a p and no interval. At
  # fifteen proteins the Fisher z interval runs +0.124 to +0.850 and a bootstrap over the same
  # fifteen gives -0.012 to +0.905, which CONTAINS ZERO. The point estimate is therefore
  # consistent with reproducibility and is not evidence for it, and the gate below pins that
  # reading: if the bootstrap lower bound ever rises above zero the text may be strengthened,
  # and until then it may not.
  cross_cell_collapsed_r:       {value: 0.598, tol: 0.05}
  cross_cell_fisher_low:        {value: 0.124, tol: 0.06}
  cross_cell_fisher_high:       {value: 0.850, tol: 0.05}
  cross_cell_boot_low:          {value: -0.012, tol: 0.08}
  cross_cell_boot_high:         {value: 0.905, tol: 0.05}
  cross_cell_boot_must_span_zero: true
  block_null_must_be_reported: true
  # THE GATE THAT MATTERS. If a future run ever shows protein's share failing to beat its own
  # permutation null, the README's headline about R1g is false and must come out rather than
  # be softened. And the null must be PRESENT: a decomposition without it is the claim that
  # was retracted here.
  protein_must_beat_its_own_null: true
  null_must_be_reported: true

# --- R1t: the rungs of the R1g ladder were not measured on the same scale -----------------
#
# THE DEFECT, found by a methods referee in review and confirmed. The nested contribution adds
# the model's score as a covariate to a logistic regression. The 4-mer entered as a LOG-ODDS
# (baseline.oof_scores returns decision_function); the CNN and SpliceBERT entered as
# PROBABILITIES, because that is what their GPU sweeps wrote to data/evidence. A logistic
# regression is NOT invariant to a monotone nonlinear transform of a covariate, so the deep
# models' gains were measured with a range-compressed version of their own score and the
# k-mer's were not. That is an asymmetry in the one section whose point is that the three rungs
# share rows, folds and estimator.
#
# MEASURED ON ALL 94 DATASETS, BOTH ARMS. The bias is real, one-directional and small: the
# probability scale UNDERSTATES the deep gains by +0.0008 (CNN) and +0.0030 (SpliceBERT) on the
# GC arm, every interval clear of zero. So the published deep numbers are CONSERVATIVE.
#
# AND THE PAPER'S CLAIM IS INVARIANT TO IT. The R1 contrast moves by 0.0002-0.0003:
#   CNN        +0.0530 -> +0.0528
#   SpliceBERT +0.0864 -> +0.0867
#   k-mer      +0.0398 unchanged, it was always the logit
# far inside the protein-clustered intervals. The ladder's ORDER and the contrast both stand.
r1t_score_scale:
  n_datasets: 94
  # The published deep gains must be exactly reproducible on the probability scale, or this
  # script is not modelling the published pipeline and none of the deltas mean anything.
  max_published_reproduction: 1.0e-9
  delta_cnn_gc:        {value: 0.0008, tol: 0.0006}
  delta_splicebert_gc: {value: 0.0030, tol: 0.0010}
  delta_cnn_dn:        {value: 0.0006, tol: 0.0006}
  delta_splicebert_dn: {value: 0.0033, tol: 0.0012}
  contrast_cnn_logit:        {value: 0.0528, tol: 0.006}
  contrast_splicebert_logit: {value: 0.0867, tol: 0.008}
  # THE TWO GATES THAT CARRY THE CONCLUSION. The bias must stay small enough that the ladder's
  # absolute values are not misstated, and the CONTRAST must be invariant to the scale -- which
  # is what makes the defect a disclosed sensitivity rather than a correction to the claim.
  max_scale_bias: 0.006
  max_contrast_shift: 0.004
  scale_bias_must_be_one_directional: true

# --- Achieved match quality: what the matchers DID, not what they were asked for ----------
#
# THE GAP, found by a methods referee. Every arm was specified by its tolerance or objective,
# and the paper argues FROM the specification: the GC arm controls 1 of the baseline's 15
# degrees of freedom, the dinucleotide arm 15 of 15. That is exactly true of the DESIGN. The
# REALISATION was measured nowhere -- no table, no key, and none of the 522 assertions touched
# it. prepare.py computed the L1 into prep_report.txt files that no longer exist.
#
# TWO FACTS THE METHODS MUST STATE, now that they are measured over all 456,734 pairs:
#   1. THE GC TOLERANCE IS NOT 0.05. The matcher relaxes -- 40 draws, tolerance doubled to 0.10
#      after 25 misses, best-seen accepted up to 3x = 0.15. 94.8% of pairs are inside 0.05 and
#      the observed maximum is 0.1486, sitting exactly at the fallback cap. Reporting "matched
#      within 5 percentage points" overstates what happened for 5.2% of pairs.
#   2. "DINUCLEOTIDE-MATCHED" MEANS L1 ~ 0.22, NOT ~ 0. The matcher improves median composition
#      distance 0.500 -> 0.220, a factor of 2.27. So "15 of 15 controlled" is a statement about
#      the design and only approximately about the data. This is also the number R1f needed:
#      it is described as "confounded with achieved match quality" with no figure anywhere.
#
# And neg2 is not composition-matched at all (median |dGC| 0.139 against the GC arm's 0.030),
# by construction -- which is exactly why its composition baseline is the highest of the three.
match_quality:
  n_datasets: 94
  gc_gap_median_gc: {value: 0.0297, tol: 0.004}
  gc_gap_max_gc:    {value: 0.1486, tol: 0.004}
  gc_gap_median_dn: {value: 0.0198, tol: 0.004}
  gc_gap_median_neg2: {value: 0.1387, tol: 0.020}
  dinuc_l1_median_gc:   {value: 0.500, tol: 0.04}
  dinuc_l1_median_dn:   {value: 0.220, tol: 0.03}
  dinuc_l1_median_neg2: {value: 0.700, tol: 0.06}
  within_nominal_gc: {value: 0.948, tol: 0.03}
  l1_improvement_factor: {value: 2.27, tol: 0.25}
  # THE GATES. The relaxation ladder must be reported and the observed max must stay inside the
  # 3x fallback cap the matcher actually enforces -- if a pair ever exceeds 0.15 the matcher did
  # something other than what this section describes. And the dinucleotide arm must remain
  # materially better matched than the GC arm, or the 1-of-15 vs 15-of-15 argument fails on the
  # realisation and not merely on the design.
  gc_fallback_cap: 0.15
  min_l1_improvement: 1.8
  ladder_must_be_reported: true

# --- FOLD INTEGRITY: did the committed scores use the study's chromosome folds? ------------
#
# THE WORST DEFECT FOUND IN REVIEW, and the harness could not see it. config/folds.tsv is a
# frozen chromosome-to-fold map and chromosome grouping is the entire design: a model must never
# be tested on a chromosome it trained on. For 20 of the 94 DINUCLEOTIDE-arm datasets the
# committed CNN and SpliceBERT per-window scores were produced under a different partition -- a
# stratified random split that PRESERVED FOLD SIZES, so no size or count check could catch it,
# while putting up to 23 chromosomes in every fold.
#
# Confirmed three independent ways: the score file's own fold column disagrees with
# dataset.tsv's (agreement 0.48-0.99); every score fold spans all 23 chromosomes where every
# table fold spans 4-5; and the direct metric -- rows with a same-strand genomic neighbour
# within 1 kb assigned to a DIFFERENT fold -- reaches 44.5%, against exactly 0 under folds.tsv
# and 0 everywhere in the GC arm.
#
# deep_model_contrast.py asserted in its own docstring that "both arms use the same chromosome
# folds, the same seed ... the only difference is how the negative windows were chosen". False
# for those 20. None of the 549 assertions checked it: the harness gated the VALUES the scores
# produced and never what produced them, now at the level of the evidence files.
#
# RESOLVED 2026-09-04 BY RETRAINING, not by bounding. The 200 affected fold-runs were rerun on
# config/folds.tsv and their scores replaced, so all three arms are 94/94 and the gates above
# are set to zero rather than to a disclosed 20. What it moved, measured:
#   k-mer      +0.0398 -> +0.0398   (unchanged; it is refit in-script on the study folds)
#   CNN        +0.0530 -> +0.0506   (-0.0024)
#   SpliceBERT +0.0864 -> +0.0845   (-0.0019)
# Both inside the protein-clustered half-widths of ~0.009, and the CNN shift is exactly the
# -0.0024 the drop-the-20 sensitivity had predicted. Only the 20 moved; the GC arm is
# bit-identical; the k-mer moved at most 0.000183 from two extra rows entering the paired set.
#
# THE GC ARM IS CLEAN, 94 OF 94. So R1's headline, R1m, R1n, R1q and the GC arm of R1o/R1r are
# untouched, and every k-mer number in the paper is untouched.
# --- The region asymmetry, found by inspection after 649 assertions passed ---------------
#
# THE THIRD DEFECT THIS HARNESS DID NOT CATCH, and the pattern is now unmistakable: every one
# was about what PRODUCED a number rather than the number itself. The two composition-matched
# matchers draw candidates of the same region class; build_neg2.py matches fold only and says
# so in its own docstring. So the arm carrying the paper's one non-tautological result was the
# only arm in which transcript region was free to separate the classes, and it does, at a
# median AUROC of 0.748 against exactly 0.5 in the other two.
#
# The result survives -- region-matching the arm leaves it with the highest baseline and the
# lowest contribution -- but "survives" is a gate, not a hope, so it is asserted below.
region_asymmetry:
  # EXACT, not approximate. 0.5 is what a matcher that matches region produces by
  # construction; any drift means it stopped.
  matched_arms_exact_tol: 0.0005
  region_auroc_gc:      {value: 0.5000, tol: 0.001}
  region_auroc_dn:      {value: 0.5000, tol: 0.001}
  region_auroc_neg2:    {value: 0.7484, tol: 0.02}
  region_auroc_matched: {value: 0.5026, tol: 0.02}
  comp_matched:         {value: 0.8017, tol: 0.01}
  gain_matched:         {value: 0.0062, tol: 0.003}
  # THE PRIMARY REGION-MATCHED ESTIMATE: the arm rebuilt through build_neg2.py --match-region,
  # which keeps every pair rather than discarding 30% of them and hits the match exactly. Its
  # region-only AUROC is gated to the same 0.5000 the other two matched arms are, because a
  # stratified draw that misses is a broken draw.
  region_auroc_built: {value: 0.5000, tol: 0.001}
  comp_built:         {value: 0.8052, tol: 0.01}
  gain_built:         {value: 0.0092, tol: 0.003}
  retained_built:     {value: 1.000, tol: 0.001}
  region_share_of_excess: {value: 0.46, tol: 0.06}
  # The dose-response, which is what makes region a candidate explanation rather than a
  # coincidence. Signs are the claim; the magnitudes are loosely toleranced.
  dose_baseline: {value: 0.287, tol: 0.08}
  dose_gain:     {value: -0.253, tol: 0.08}

# --- ENCODE filtered the peaks upstream; an earlier draft conceded a flaw we do not have --
#
# The Limitations used to say the positive set "includes weak peaks that a study applying
# ENCODE's standard thresholds would exclude". Reading all 95 released files shows the minimum
# log2 fold-enrichment in the panel is 3.0000 and the minimum -log10 p is 3.0003, which ARE
# ENCODE's thresholds. There were no weak peaks to exclude. Gated as a floor, because the
# claim is "none is below", not "few are".
peak_thresholds:
  n_files:      {value: 95, tol: 0}
  n_peaks:      {value: 463091, tol: 0}
  min_log2fc:   {value: 3.0000, tol: 0.001}
  min_neglog10p: {value: 3.0003, tol: 0.001}
  idr_fraction: {value: 0.917, tol: 0.005}
  fold_enrichment_floor: 3.0
  significance_floor: 3.0

# --- The two tables that were committed ungated, which is how their docstring drifted -----
#
# design_effect.csv and standalone_auroc.csv went in without a verifier block, and the
# design-effect docstring promptly quoted a pre-final run (1.11 / 0.996 / 77-of-94) over a CSV
# reading 1.15 / 1.048 / 75-of-94. Exactly the failure the script was written to fix.
design_effect:
  clustering_10kb:   {value: 1.100, tol: 0.03}
  clustering_100kb:  {value: 1.104, tol: 0.03}
  clustering_1000kb: {value: 1.138, tol: 0.03}
  fitting:           {value: 1.048, tol: 0.05}
  measured_product:  {value: 1.153, tol: 0.05}
  # The applied 1.35 must stay ABOVE the measured product, because the paper keeps it on the
  # grounds that it is the conservative choice. If that ever inverts, the claim inverts.
  applied_must_exceed_measured: true
  n_significant_unadjusted: {value: 80, tol: 0}
  n_significant_applied:    {value: 72, tol: 0}

standalone_auroc:
  model_alone_dn:   {value: 0.6879, tol: 0.01}
  model_alone_gc:   {value: 0.7981, tol: 0.01}
  model_alone_neg2: {value: 0.8169, tol: 0.01}
  drop_gc_to_dn:    {value: 0.1102, tol: 0.012}
  # The progression is the claim: the harder the protocol looks, the less often composition
  # alone beats the model. Two-sided, because each can only be wrong in one direction.
  comp_beats_model_dn:   {value: 14, tol: 3}
  comp_beats_model_gc:   {value: 29, tol: 3}
  comp_beats_model_neg2: {value: 53, tol: 4}
  comp_beats_model_must_increase_with_easiness: true
  # A7. THE PREMISE OF SECTION 3.4, which was argued and never quantified: a protocol that is
  # hard for the model is hard for composition. Correlated on the MODEL ALONE and not on
  # comp+model, which is a superset of the composition column and returns +0.94 for free -- the
  # same wrong-quantity trap standalone_auroc.py was written to fix.
  corr_alone_comp_pooled: {value: 0.8937, tol: 0.02}
  corr_alone_comp_gc:     {value: 0.9114, tol: 0.03}
  corr_alone_comp_dn:     {value: 0.6238, tol: 0.05}
  corr_alone_comp_neg2:   {value: 0.9556, tol: 0.03}
  corr_alone_comp_must_exclude_zero: true
  # B7. THE 3x3, because the apparent-AUROC side of the thesis existed for the 4-mer only.
  # Dinucleotide matching is the hardest discrimination for all three model classes. The
  # bias-aware arm is the easiest for only TWO of them: SpliceBERT finds GC matching easier by
  # 0.0039. So "the easiest protocol of the three" is unambiguous on the composition baseline
  # and marginal on a strong model's own AUROC, and the counts below are gated so the
  # unqualified phrasing cannot come back.
  alone_kmer_dn:       {value: 0.6879, tol: 0.010}
  alone_cnn_dn:        {value: 0.7076, tol: 0.010}
  alone_splicebert_dn: {value: 0.8099, tol: 0.010}
  alone_kmer_neg2:       {value: 0.8169, tol: 0.010}
  alone_cnn_neg2:        {value: 0.8162, tol: 0.010}
  alone_splicebert_neg2: {value: 0.8732, tol: 0.010}
  models_dn_hardest: 3
  models_neg2_easiest: 2
  splicebert_neg2_minus_gc: {value: -0.0039, tol: 0.004}
  # B8's COUNTERPART ON OUR DATA. The title relation, per dataset, on the model's OWN AUROC.
  # TWO GATES BECAUSE THE SIGN AND THE MAGNITUDE SAY DIFFERENT THINGS. The direction inverts in
  # 88 of 94 datasets, which is the claim; the correlation between how much difficulty rose and
  # how much contribution rose is POSITIVE at +0.385, so the paper is not claiming the
  # magnitudes covary and the second gate stops that being read into it.
  opposite_gc_to_dn:   {value: 88, tol: 3}
  opposite_gc_to_neg2: {value: 57, tol: 5}
  magnitude_corr_gc_to_dn: {value: 0.385, tol: 0.06}

# --- 1b/1c: the nested fit's two specification choices, measured on the full panel ---------
#
# BOTH ARE REAL OBJECTIONS AND THEY GET DIFFERENT TREATMENT, so both are gated.
#
# THE COVARIATE SCALE is an inconsistency: the 4-mer's score is a log odds, the neural models'
# are probabilities, and logistic regression is not invariant to a nonlinear transform of a
# covariate. Measured, the logit scale RAISES every neural contribution, so the published
# probability-scale figures are the conservative ones, and the two-arm contrast moves in the
# fourth decimal against a protein-clustered half-width near 0.009. The gate below pins the
# DIRECTION -- if the effect ever turns negative for a neural model the "conservative" claim
# is false and the primary numbers have to be refit rather than defended.
#
# THE STANDARDISATION WINDOW is improper but symmetric and label-free. Measured at 4e-5 on any
# panel mean, which is below the precision the paper quotes. Gated as a CEILING: if it ever
# exceeds the fourth decimal the whole-dataset form stops being defensible.
# --- B1: the protocol ordering on five estimands, not just AUROC -------------------------
#
# THE OBJECTION THIS ANSWERS. An AUROC increment is bounded above by 1 - c, so part of any
# comparison between arms with unequal baselines is arithmetic. Two long reviews said the same
# thing: "no protocol-free measure of contribution exists" is a claim about AUROC and not about
# measurement. If the ordering came from the ceiling it should weaken on a scale without one.
#
# IT DOES NOT. dinucleotide > GC > bias-aware in 15 of 15 estimand-by-model cells, including
# delta deviance, which is unbounded above. That is gated at 5 of 5 estimands.
#
# BUT THE MAGNITUDE IS SCALE-DEPENDENT, and the paper says so. The 4-mer's span is 5.42x in
# AUROC and 2.09x in deviance; the unbounded scales give smaller spans in every case, which is
# exactly what the ceiling objection predicts. So the DIRECTION is estimand-free and the
# five-fold figure is an AUROC-scale property. The deviance span is gated as a floor above 1.5
# so the "roughly two-fold on unbounded scales" reading cannot silently become "no effect".
# --- B4: is the bias-aware deficit label noise from co-binding? ---------------------------
#
# THE MOST SERIOUS NON-COMPOSITIONAL EXPLANATION for the bias-aware arm, and it is rejected on
# magnitude and on sign. Its negatives are other RBPs' binding sites; RBPs co-bind, so a
# negative could be a mislabelled positive, and label noise depresses any contribution without
# needing this paper's compositional story. The construction excludes donor windows within
# 500 nt of the target's own WINDOWS, which is weaker than excluding them from its PEAKS.
#
# MEASURED: at most 0.29% of bias-aware negatives fall inside a called target peak, median
# zero. Not enough mislabelling to account for a deficit of 0.021. AND THE SIGN IS BACKWARDS --
# the third of datasets with the MOST residual overlap has the SMALLEST deficit. Both are
# gated, because either one alone could be argued around.
# --- B14: where the discriminative signal actually sits along the window ------------------
#
# The Methods justified the CNN's global max-pool with "the discriminative signal is
# approximately 15 nt off centre, varying by protein". That number had no table, no script and
# no figure, and the manuscript audit could not catch it because a bare 15 inside a clause about
# design rationale is indistinguishable from a page number.
#
# MEASURED, with no model fitted: mutual information in bits between the base at each of the 101
# positions and the label. The peak sits a MEDIAN OF 23 nt from the midpoint, not 15, with an
# IQR of 11 to 29 and a maximum of 48, and within 5 nt of the midpoint in only 13 of 94
# datasets. The claim's direction and its "varying by protein" were right and its magnitude was
# understated, which makes the design choice MORE justified rather than less.
#
# Gated as a floor on the offset and a ceiling on how many datasets are centred, because both
# have to hold for position-invariance to be the right architecture.
# --- B6: does the headline survive a different chromosome partition? ----------------------
#
# Every number in this paper uses one balanced chromosome-to-fold assignment, chosen once and
# frozen. The fold-to-fold spreads reported throughout therefore describe variability WITHIN
# that partition and say nothing about variability ACROSS the choice of it, which the
# Limitations had to carry as an untested design parameter.
#
# MEASURED over three alternatives built under the same objective and the same minimum of three
# chromosomes per fold: contrasts +0.0392, +0.0396, +0.0393 against +0.0398 frozen. Range
# 0.0006, an eighth of the protein-clustered half-width.
#
# THE GATE HAS TWO HALVES because a range this small could hide either failure. The range must
# stay SMALL, so the partition is not carrying the result; and the contrast must stay POSITIVE
# under every partition, since a small range around a sign flip would be worthless. Note the
# frozen partition gives the LARGEST of the four, which the text discloses rather than rounds
# away.
#
# 4-mer only, and not as a shortcut: the neural sweeps trained on the frozen assignment, so
# re-partitioning them would compare their old folds against new ones.
# --- B9: two choices in how the AUROC is aggregated across folds --------------------------
#
# Pooled versus fold-averaged, and raw versus rank-normalised within fold. The ordering holds
# under all three aggregations for all three model classes, so the headline is not a property of
# pooling. What the choice affects is the LEVEL, and only for the neural models: pooling costs
# the CNN and SpliceBERT about 0.008 of contribution in the dinucleotide arm against 0.0001 for
# the 4-mer, and the two alternatives agree with each other to within 0.0007 -- which is the
# signature of five independently trained fold models not sharing a scale, since averaging
# within fold and rank-normalising within fold are two different repairs for that one cause.
# Pooling is retained because it weights each row once instead of weighting a small fold as
# heavily as a large one.
auroc_aggregation:
  n_aggregations_ordered: 3
  fold_avg_minus_pooled_cnn_dn:        {value: 0.0083, tol: 0.003}
  fold_avg_minus_pooled_kmer_dn:       {value: 0.0001, tol: 0.0008}
  max_disagreement_between_alternatives: 0.002

partition_sensitivity:
  n_partitions: 4
  contrast_frozen: {value: 0.0398, tol: 0.002}
  max_contrast_range: 0.004
  contrast_must_be_positive_under_every_partition: true

positional_signal:
  median_abs_offset: {value: 23.0, tol: 3.0}
  min_median_abs_offset: 10.0
  max_datasets_near_centre: 30
  mi_centre: {value: 0.0058, tol: 0.0015}
  mi_peak:   {value: 0.0136, tol: 0.0030}
  centre_must_be_below_peak: true

cobinding_noise:
  max_overlap_fraction: 0.01
  median_overlap:  {value: 0.0000, tol: 0.0005}
  deficit_lowest_third:  {value: -0.0190, tol: 0.004}
  deficit_highest_third: {value: -0.0078, tol: 0.004}
  overlap_must_not_explain_deficit: true

estimands:
  n_estimands_ordered: 5
  deviance_span_kmer:       {value: 2.09, tol: 0.25}
  deviance_span_cnn:        {value: 3.09, tol: 0.35}
  deviance_span_splicebert: {value: 2.13, tol: 0.25}
  min_deviance_span: 1.5
  residual_auroc_kmer_dn: {value: 0.6314, tol: 0.02}
  residual_auroc_must_exceed_chance: 0.55

nested_scale:
  logit_gain_cnn_gc:        {value: 0.00079, tol: 0.0004}
  logit_gain_splicebert_gc: {value: 0.00298, tol: 0.0010}
  logit_gain_cnn_dn:        {value: 0.00045, tol: 0.0004}
  logit_gain_splicebert_dn: {value: 0.00327, tol: 0.0010}
  logit_must_raise_neural: true
  max_within_fold_effect: 0.0002
  max_contrast_shift_from_scale: 0.0010

fold_integrity:
  # 564, not 376: the bias-aware arm was added after three referees pointed out that the
  # manuscript asserted it was clean on the strength of "donors are sampled within fold" --
  # an argument from construction, which is exactly what the dinucleotide arm's docstring
  # made before it turned out to be wrong. It is the denominator of every reported span.
  n_score_sets: 564
  grouped_gc: {value: 94, tol: 0}
  aligned_gc: {value: 94, tol: 0}
  # THE DINUCLEOTIDE ARM IS NOW CLEAN, and these three keys are the record of it. It was
  # 74/94 grouped, 20 leaky, 23 chromosomes in a single fold. Those 200 fold-runs were
  # retrained on the study partition on 2026-09-04 and their scores replaced, so the arm is
  # held to exactly the standard the other two are: 94, zero, five. Raising any of these back
  # would mean the retrain has been reverted.
  grouped_dn: {value: 94, tol: 0}
  grouped_neg2: {value: 94, tol: 0}
  aligned_dn: {value: 94, tol: 0}
  aligned_neg2: {value: 94, tol: 0}
  max_chroms_per_score_fold_neg2: {value: 5, tol: 0}
  # Same standard the GC arm is held to, and for the same reason: zero, not small.
  neg2_must_be_fully_grouped: true
  max_cross_fold_neighbours_neg2: 0.0
  leaky_datasets: {value: 0, tol: 0}
  max_chroms_per_score_fold_gc: {value: 5, tol: 0}
  max_chroms_per_score_fold_dn: {value: 5, tol: 0}
  dn_must_be_fully_grouped: true
  max_cross_fold_neighbours_dn: 0.0
  # THE GATES THAT MATTER.
  #  1. The GC arm must stay perfectly chromosome-grouped with ZERO cross-fold neighbours. It
  #     carries the headline; if it ever leaks, the paper stops.
  #  2. NO dataset in ANY arm may be leaky. The count is pinned at exactly 0, two-sided. It was
  #     pinned at 20 with a bound on how far the conclusion could move when they were dropped;
  #     that bound existed because the sweep had not been rerun, and it has been, so the
  #     tolerance for the defect is now zero in all three arms rather than a disclosed 20.
  gc_must_be_fully_grouped: true
  max_cross_fold_neighbours_gc: 0.0

# --- R1u: a protocol-free coordinate EXISTS in sample. It does not TRANSPORT. --------------
#
# THIS RETRACTS AND REPLACES THE PAPER'S TITLE CLAIM. R1m said "no monotone rescaling recovers
# a protocol-free quantity: over eight transforms the range never falls below 2.00x". But
# g/(1-comp) is not a coordinate, it is the p = 1 member of a one-parameter family, and the
# sweep stopped exactly at the member that is the paper's own recommendation. Extend the family:
#
#   p       0     0.5    1.0    1.25   1.544   1.75   2.0
#   range  5.42   3.43   2.00   1.48   1.005   1.34   1.95
#
# At p = 1.544 the three protocols agree on the panel mean to 0.5%. The claim is FALSE as
# literally worded, and the "eight standard coordinates" hatch does not save it: g/(1-comp)^1.544
# has exactly as much derivation as g/(1-comp), namely none -- both are argmins of one sweep.
#
# WHAT REPLACES IT IS STRONGER. The equalising exponent is a property of the BENCHMARK. Fitted
# on our three protocols it is 1.544; fitted on Horlacher's two it is 3.649, and OUR exponent
# leaves their benchmark at 2.340x against the 2.381x it started from -- i.e. it buys nothing
# there. So no normalisation transports: any transform strong enough to equalise one benchmark
# must be refitted on the next, which is what "there is no protocol-free measure" should have
# meant all along. This is a claim about transportability, not about a floor, and it is testable
# on exactly the external data the project did not build.
#
# AND THE 2.00x INFERENCE ITSELF SURVIVES, against a corrected null. max/min over three noisy
# means is bounded below by 1 and biased up, so 1.0 was too generous a bar. With equal true arm
# means and the real between-arm dataset pairing preserved, the null has median 1.064 and a 95th
# percentile of 1.175. The observed 2.002 is well outside it.
r1u_transport:
  n_datasets_external: 45
  range_at_p1: {value: 2.002, tol: 0.05}
  exponent_ours:   {value: 1.544, tol: 0.10}
  range_at_argmin: {value: 1.005, tol: 0.05}
  exponent_theirs: {value: 3.649, tol: 0.40}
  their_range_raw:          {value: 2.381, tol: 0.10}
  their_range_at_our_p:     {value: 2.340, tol: 0.15}
  their_range_at_their_p:   {value: 1.000, tol: 0.05}
  null_median: {value: 1.064, tol: 0.05}
  null_p95:    {value: 1.175, tol: 0.06}
  # THE EXTERNAL FALSIFICATION, which fires. recommendation_works.py names its own criterion:
  # "rank agreement falling, or disagreement rising, under normalisation". Both happen on their
  # 45 datasets. Not significant (P(<=0) = 0.70), so a failure to replicate and not a
  # refutation -- but it is the paper's own pre-registered test on independent data and the
  # paper must report it rather than wait for a referee to run it.
  external_rank_raw:      {value: 0.706, tol: 0.05}
  external_rank_headroom: {value: 0.656, tol: 0.05}
  external_disagreement_raw:      {value: 0.860, tol: 0.06}
  external_disagreement_headroom: {value: 0.908, tol: 0.06}
  # AND THE MECHANISM DOES REPLICATE, per arm, which R1p currently reports as a partial
  # FAILURE. Their composition-matched arm shows the gradient at p = 2e-06; their
  # other-RBPs'-sites arm does not. That is R1n's two-family mechanism on an independent lab's
  # negatives and folds, and it is the strongest external result in the paper.
  external_gradient_n1: {value: -0.645, tol: 0.10}
  external_gradient_n2: {value: -0.187, tol: 0.12}
  # THE GATES.
  #  1. An in-sample equalising exponent MUST be reported. Suppressing it would restore a claim
  #     that is false, and a referee holding the Zenodo deposit finds it in an afternoon.
  #  2. The exponent must NOT transport -- that is now the paper's claim, so if a future run
  #     ever finds the two benchmarks agreeing on an exponent, the claim must be restated.
  #  3. The external falsification must be reported whichever way it points.
  in_sample_exponent_must_be_reported: true
  # THE OTHER HALF OF THE SAME FACT. The exponent closes the span only under a mean of
  # per-dataset ratios, which a headroom of 0.0267 can dominate. Under the median and under the
  # ratio of panel means it never approaches 1. Gate both directions so neither the awkward
  # in-sample minimum nor its explanation can be dropped.
  min_span_median:            {value: 1.238, tol: 0.05}
  min_span_ratio_of_means:    {value: 1.278, tol: 0.06}
  min_headroom:               {value: 0.0267, tol: 0.004}
  min_cells_below_headroom_015: 50
  min_span_under_robust_aggregation: 1.15
  aggregation_artefact_must_hold: true
  min_exponent_ratio: 1.8
  external_falsification_must_be_reported: true

# --- R1v: the three-protocol span, for all three model classes ---------------------------
#
# THE GAP REVIEWERS NAMED, now closed. Previously everything three-protocol was
# 4-mer only and everything multi-model was two-arm only, so the paper's headline was a
# single-model result whose defence belonged to models that had never seen the third protocol.
# The neural sweep was extended to the bias-aware arm (940 fold-runs, 17.4 GPU-hours, $19.10).
#
# THE SPAN IS NOT AN ARTEFACT OF THE CHEAP MODEL:
#   4-mer       +0.0663 / +0.0265 / +0.0122   5.42x [4.43, 6.58]
#   CNN         +0.0837 / +0.0330 / +0.0113   7.42x [6.07, 9.31]
#   SpliceBERT  +0.1735 / +0.0890 / +0.0466   3.72x [3.23, 4.30]
#
# Two things follow. It is present for every model class, so "a five-fold span measured with a
# bag of k-mers is an artefact of a weak model" is answered directly rather than by analogy.
# And it is WIDEST FOR THE CNN, not for the largest model, which is the same non-monotonicity
# in capacity the ratio-scale multiplier already showed. Nothing here grows with capacity.
#
# PROVENANCE: unlike the dinucleotide arm, all 188 (dataset, model) score sets on this arm were
# verified chromosome-grouped BEFORE use -- max 5 chromosomes per fold, zero misaligned.
r1v_three_arm_models:
  n_datasets: 94
  comp_dn:   {value: 0.6274, tol: 0.01}
  comp_gc:   {value: 0.7827, tol: 0.01}
  comp_neg2: {value: 0.8248, tol: 0.01}
  kmer_neg2:       {value: 0.0122, tol: 0.004}
  cnn_neg2:        {value: 0.0113, tol: 0.004}
  splicebert_neg2: {value: 0.0466, tol: 0.008}
  span_kmer:       {value: 5.42, tol: 0.60}
  span_cnn:        {value: 7.42, tol: 1.00}
  span_splicebert: {value: 3.72, tol: 0.60}
  # A5. THE TWO EFFECTS IN THE SAME UNITS. The Introduction compared a protocol-driven
  # contribution range against gaps in APPARENT AUROC between model classes, which are
  # different quantities, and concluded the protocol effect was "nearly three times" one and
  # "about half" the other. In matching units neither dominates: as absolute AUROC the larger
  # depends on which arm and model you start from, and only as a fold change is the protocol
  # effect reliably the bigger of the two. Gated as the ORDERING of the fold ranges, because
  # that is the surviving claim; the absolute ranges are gated as values.
  range_protocol_kmer:       {value: 0.0540, tol: 0.008}
  range_protocol_cnn:        {value: 0.0724, tol: 0.012}
  range_protocol_splicebert: {value: 0.1269, tol: 0.020}
  range_modelclass_gc:       {value: 0.0625, tol: 0.010}
  range_modelclass_dn:       {value: 0.1073, tol: 0.018}
  range_modelclass_neg2:     {value: 0.0353, tol: 0.008}
  # Not "protocol dominates": the ranges overlap. See the note in verify.py, where the first
  # version of this gate asserted dominance and correctly failed.
  fold_ranges_must_overlap: true
  # THE CLAIM, gated as the sentence the paper makes rather than as three loose numbers: the
  # span survives for the WEAKEST-spanning model class. If it ever falls toward 1 for any
  # model, the headline stops being a property of the benchmark and becomes one of the 4-mer.
  min_span_over_models: 3.0
  # And the bias-aware arm must remain the lowest for every model class, since that reversal
  # (easiest discrimination, least measured contribution) is the paper's title claim.
  neg2_lowest_for_all_models: true
  span_must_not_grow_with_capacity: true

# --- R1w: the three 4-mer-only analyses, extended to every model class -------------------
#
# The transform sweep, the baseline decomposition and the recommendation test were 4-mer only
# because the neural models had no bias-aware row. The neg2 sweep supplied it, so all three
# extend at ZERO further compute. Two generalise. ONE DOES NOT, and that is the finding.
#
# 1. THE FLOOR GENERALISES BUT ITS VALUE IS MODEL-SPECIFIC. Minimum fold range over the eight
#    transforms: k-mer 2.00x, CNN 2.91x, SpliceBERT 1.68x. All are above the equal-means null
#    (95th percentile 1.175), so no model reaches protocol independence among fixed
#    coordinates -- but "the floor is 2.00x" is the K-MER's floor and the paper must say so.
#
# 2. AND NO FITTED EXPONENT REACHES INDEPENDENCE FOR THE DEEP MODELS, which strengthens R1u.
#    The argmin over g/(1-c)^p reaches 1.004x for the k-mer but only 1.213x (CNN) and 1.124x
#    (SpliceBERT). The equalising exponent also differs 1.22x BETWEEN MODELS on the same
#    benchmark, so it is not a property of the benchmark alone; it is fitted per measurement.
#
# 3. R1n DOES NOT GENERALISE, and this is the one that costs the paper a claim.
#      incremental R2:   protocol | baseline    baseline | protocol
#      k-mer                   1.00%                 11.05%
#      CNN                     6.25%                  2.34%      <- REVERSES
#      SpliceBERT              1.07%                 24.06%
#    For the CNN the protocol LABEL explains almost three times what the baseline does. And the
#    two-family mechanism is k-mer-specific: within-arm gradients are -0.462/-0.545/-0.122 for
#    the k-mer (present for composition-matched, absent for bias-aware) but -0.583/-0.767/
#    -0.568 for SpliceBERT, where the gradient is strong in ALL THREE arms including the
#    bias-aware one. So "it is the baseline, not the protocol label" and the two-family
#    mechanism are both properties of the 4-mer measurement, not of the quantity.
#
# 4. THE RECOMMENDATION GENERALISES: rank agreement improves in 3/3 protocol pairs for all
#    three model classes, mean change +0.040 / +0.094 / +0.061.
r1w_models_by_protocol:
  n_datasets: 94
  floor_kmer:       {value: 2.00, tol: 0.25}
  floor_cnn:        {value: 2.91, tol: 0.35}
  floor_splicebert: {value: 1.68, tol: 0.25}
  exponent_kmer:       {value: 1.544, tol: 0.15}
  exponent_cnn:        {value: 1.843, tol: 0.20}
  exponent_splicebert: {value: 1.507, tol: 0.15}
  argmin_range_cnn:        {value: 1.213, tol: 0.10}
  argmin_range_splicebert: {value: 1.124, tol: 0.10}
  inc_protocol_kmer:       {value: 0.0100, tol: 0.004}
  inc_baseline_kmer:       {value: 0.1105, tol: 0.020}
  # Both recentred after the retrain, and they moved in opposite directions: the CNN's
  # protocol-label increment fell from 0.0625 to 0.0460 while its baseline increment rose from
  # 0.0234 to 0.0347, so the baseline now carries less than the label for this model rather
  # than more. The paper's claim is about the 4-mer, where the ordering is unchanged and much
  # wider (0.0100 against 0.1104), and it says so.
  inc_protocol_cnn:        {value: 0.0460, tol: 0.015}
  inc_baseline_cnn:        {value: 0.0347, tol: 0.012}
  inc_protocol_splicebert: {value: 0.0107, tol: 0.005}
  inc_baseline_splicebert: {value: 0.2406, tol: 0.030}
  gradient_neg2_splicebert: {value: -0.568, tol: 0.10}
  gradient_neg2_kmer:       {value: -0.122, tol: 0.10}
  # THE GATES, and two of them exist to stop a withdrawn claim returning.
  #  * every model class must stay above the equal-means null among fixed coordinates, or the
  #    paper's central negative result fails for that model;
  #  * the CNN reversal must be REPORTED, because "it is the baseline, not the protocol label"
  #    is false for it and the pooled 4-mer number would hide that;
  #  * the two-family mechanism must be labelled 4-mer-specific while SpliceBERT's bias-aware
  #    gradient is strong.
  min_floor_over_models: 1.30
  cnn_reversal_must_be_reported: true
  two_family_mechanism_is_kmer_specific: true
  recommendation_pairs_improved: 3

# B5: THE SHUFFLED FOURTH ARM. Dinucleotide-preserving shuffling is what GraphProt, iDeepS and
# RBPsuite do and what Tourne indicts, and it is not a matching protocol: each negative is a
# permutation of its own positive, so the 19-feature composition block takes the SAME VALUE on
# both members of every pair. The baseline is therefore exactly uninformative, and the "nested
# contribution" is the model's own AUROC less a half wearing a different name.
#
# The construction is gated as an exact zero and the baseline as an exact half, deliberately.
# A tolerance on either would hide the result: there is no dataset on which composition does
# anything at all, and that is stronger than "composition does little".
shuffled_arm:
  n_datasets: 94
  min_fraction_tied: 0.9999
  max_deviation_from_half: 1.0e-9
  contribution: {value: 0.2523, tol: 0.010}
  standalone:   {value: 0.7528, tol: 0.010}
  max_identity_residual: 0.002
  # The headline widens from 5.42x across three matched protocols to 20.62x across the four
  # constructions in use. The three-protocol figure must reproduce exactly, on these same rows,
  # or the fourth point is being added to a different span.
  three_protocol_span: {value: 5.42, tol: 0.05}
  four_protocol_span:  {value: 20.62, tol: 2.50}
  min_four_protocol_span_ci_low: 5.42

# B3: THE COMPOSITION-ORDER PROFILE, orders 1 to 4. Reporting two orders invites "why not
# another?"; reporting the function retires the question. Orders 2 and 3 are pinned by two
# independently produced tables and come back at machine precision, so the profile passes
# through both published points rather than being a smooth curve through the wrong ones.
#
# THE SECTION'S REAL RESULT IS THE NOISE FLOOR. At order four the baseline spans the 4-mer's
# entire feature space, so the true contribution is exactly zero and anything measured is the
# estimator's own error. It measures +0.09 to +0.14 and is positive on all 94 datasets in all
# three arms: 2 to 7 times the contribution the paper reports at order two. The mechanism is
# a 337-column baseline overfitting, which is why the floor shrinks as the sample grows
# (rho -0.83 to -0.95) and why the baseline's own AUROC FALLS from order 3 to 4 but not from
# 1 to 2. That confines the problem to orders the paper does not use, and it qualifies the
# recommendation to raise the baseline's order: the gain in sharpness stops before order four.
order_profile:
  n_datasets: 94
  max_anchor2: 1.0e-12
  max_anchor3: 1.0e-12
  columns: {1: 4, 2: 19, 3: 82, 4: 337}
  kmer_order1_gc:        {value: 0.0616, tol: 0.006}
  kmer_order1_dn:        {value: 0.1010, tol: 0.010}
  kmer_order1_neg2:      {value: 0.0363, tol: 0.005}
  splicebert_order1_dn:  {value: 0.2106, tol: 0.015}
  cnn_order4_gc:         {value: 0.0139, tol: 0.004}
  splicebert_order4_gc:  {value: 0.0548, tol: 0.008}
  span_order1_kmer:       {value: 2.78, tol: 0.35}
  span_order1_cnn:        {value: 3.98, tol: 0.50}
  span_order1_splicebert: {value: 2.85, tol: 0.30}
  # 4 orders x 3 model classes, every interval clear of zero.
  n_order_model_cells: 12
  floor_gc:   {value: 0.0986, tol: 0.012}
  floor_dn:   {value: 0.1444, tol: 0.015}
  floor_neg2: {value: 0.0899, tol: 0.012}
  min_floor_multiple: 2.0
  max_baseline_fell_early: 5
  min_baseline_fell_late: 25
  max_floor_size_rho: -0.70

# B17: THE REGION LABEL MEANS TWO DIFFERENT THINGS BY CLASS, which is what the anchor found.
# Recomputing annotation.classify from the same GENCODE index reproduces the committed label
# for every one of 2,251,282 POSITIVES in all three arms, and differs for ~10% of the two
# matched arms' NEGATIVES: for a matched negative the column records the region POOL the
# matcher drew from, and merged per-region intervals overlap, so a window drawn from the CDS
# pool can have a midpoint the priority rule calls a 3' UTR of another isoform. The bias-aware
# arm is at exactly 0%, because its negatives are other proteins' positives.
#
# So "region-only AUROC is exactly 0.5000 in both matched arms" is exact for the label the
# matcher ENFORCED and becomes ~0.546 under a common re-annotation. Both are gated; gating only
# the first would let the unqualified sentence come back.
#
# The ASYMMETRY is the claim, and it survives all five annotations, from +0.2484 on the
# enforced labels to +0.1055 under a reversed priority. The bias-aware arm's own figure is not
# rule-invariant either (0.6622 to 0.7617), so the gate is on the smallest gap, not on any one
# value.
region_annotation:
  min_positives_checked: 2200000
  neg_reclass_gc: {value: 0.1033, tol: 0.005}
  neg_reclass_dn: {value: 0.1017, tol: 0.005}
  max_stored_deviation: 1.0e-9
  min_reannotated_excess: 0.02
  neg2_auroc: {value: 0.7484, tol: 0.010}
  n_rules: 5
  min_asymmetry: 0.08
  changed_reversed:     {value: 0.4122, tol: 0.02}
  changed_coding_first: {value: 0.1080, tol: 0.01}
  changed_majority:     {value: 0.1119, tol: 0.01}

# B10: GENE-CLUSTERED FOLDS. The objection is that windows from one gene split across folds
# leak. Chromosome grouping is strictly COARSER than gene grouping, so a locus cannot span a
# fold and the leakage described is impossible by construction. That was asserted as an exact
# zero and it is not one: 22 gene groups span a frozen boundary, holding 176 windows of ~2.7M.
# Every one is a gene NAME shared across chromosomes, which the index keys on -- 72 such names
# genome-wide, 36 of them pseudo-autosomal chrX/chrY pairs and the widest spanning 24
# chromosomes (multi-copy small-RNA families). That is the ONE leakage channel chromosome
# grouping cannot close, and it is gated as a small non-zero so neither the finding nor its
# scale can be lost.
#
# The finer design is the LESS conservative one, so its agreement bounds what the coarser
# published choice costs rather than validating it.
gene_clustered_cv:
  n_datasets: 94
  max_frozen_reproduction: 1.0e-12
  max_spanning_groups: 40
  max_spanning_windows: 400
  multi_chrom_names: 72
  par_pairs: 36
  widest_name: 24
  min_chroms_split: 1.0
  gain_frozen_gc:  {value: 0.0265, tol: 0.002}
  gain_gene_gc:    {value: 0.0269, tol: 0.003}
  gain_frozen_dn:  {value: 0.0663, tol: 0.003}
  gain_gene_dn:    {value: 0.0664, tol: 0.004}
  contrast_frozen: {value: 0.0398, tol: 0.002}
  contrast_gene:   {value: 0.0394, tol: 0.003}
  max_contrast_change: 0.003
  max_multiplier_deviation: 0.08

# B16: WINDOW CENTRING. The comparison asked for is summit- versus midpoint-centred windows, and
# it CANNOT BE RUN: narrowPeak column 10 is -1 in every row of every ENCODE eCLIP file here, so
# no summit exists. Gated as an exact zero, so substituting three other centres is never
# mistaken for the comparison that was requested.
#
# Rebuilding the published midpoint centring is NOT a reproduction control, which is how it was
# written. Both matchers sample their candidate windows from an RNG, so a rebuild is a fresh
# draw of the same construction. That makes it a measurement of run-to-run variability instead,
# and the arm constraining fifteen degrees of freedom is the more variable by two orders of
# magnitude: matching sixteen frequencies depends on which candidates were sampled, while a
# five-point GC tolerance is met by a large fraction of any pool.
#
# The centring moves the contrast by 0.0077, an order of magnitude more than the fold design
# (0.0003) or the chromosome partition (0.0006), so it is the largest of the three open design
# parameters and the gate says so rather than listing three reassurances.
window_centring:
  min_datasets: 10
  min_files_checked: 10
  redraw_gc: 0.001
  redraw_dn: 0.020
  gain_midpoint_gc: {value: 0.0295, tol: 0.004}
  gain_midpoint_dn: {value: 0.0779, tol: 0.008}
  contrast_midpoint:   {value: 0.0484, tol: 0.006}
  contrast_five_prime: {value: 0.0430, tol: 0.006}
  contrast_shift25:    {value: 0.0407, tol: 0.006}
  max_contrast_range: 0.015

# E3: DEVICE PORTABILITY. cloud/submit_cpu_sweep.sh had never been run against a dataset whose
# results were not already committed, so the GCP CPU path was infrastructure the repo described
# rather than infrastructure it had used. Running it on the region-matched arm, which exists in
# no GCS prefix, means nothing can be overwritten and the results must be produced from scratch.
#
# The same dataset, folds and commit trained on a Modal A10G and on one vCPU of a GCP
# e2-standard-4 agree to 0.0007 AUROC on every fold, with per-window scores correlating at
# Pearson 0.9903. Initialisation is unseeded, so this bounds DEVICE AND SEED JOINTLY -- which is
# also exactly what a reader reproducing this work would experience, since that is what the
# released code does.
#
# AND THE PRACTICAL FINDING: a 7,089-parameter network is only 1.7x slower on one vCPU than on
# an A10G, because a model that small never fills the device. The CNN sweep's $6.73 of A10G time
# extrapolates to about $0.09 of spot CPU.
device_portability:
  n_folds: 5
  min_windows: 20000
  min_pearson: 0.97
  min_pearson_worst: 0.95
  min_spearman: 0.97
  max_auroc_difference: 0.005
  max_cpu_slowdown: 4.0

# B11: THE MATCHER'S TWO FREE PARAMETERS, varied for the first time. negatives.py defends its
# greedy assignment on the grounds that an exact one "buys very little here", which was an
# assertion. It is now measured: exact assignment improves the achieved L1 by 0.004 to 0.005,
# about 2%, and moves the contribution by at most 0.002. The defence holds.
#
# THE FLOOR HAD TO BE SCALED WITH THE MULTIPLE or the section would have tested nothing:
# n_want is max(pool_min, multiple x bucket size) and buckets are small, so at the published
# pool_min of 1500 the floor binds in most buckets and 4x/8x/16x return identical negatives.
#
# REBUILDING THE PUBLISHED SETTING IS A FRESH DRAW, not a reproduction, because candidate_pool
# samples its windows. The gate is therefore on the median deviation AND on its correlation
# with dataset size: sampling noise shrinks as n grows and drift does not.
#
# THE RESULT: across the six settings a higher composition baseline goes with a smaller
# contribution at r = -0.926. That is this paper's mechanism measured on its own implementation
# choices rather than on a protocol label.
matching_robustness:
  n_datasets: 12
  n_rebuilds: 72
  n_settings: 6
  max_median_redraw: 0.008
  max_redraw_size_rho: -0.60
  max_l1_improvement: 0.015
  max_contribution_change: 0.005
  l1_greedy8:   {value: 0.2474, tol: 0.010}
  gain_greedy8: {value: 0.0765, tol: 0.006}
  comp_greedy8: {value: 0.6319, tol: 0.010}
  contribution_range: {value: 0.0106, tol: 0.005}
  baseline_range:     {value: 0.0446, tol: 0.010}
  min_floor_bound_fraction: 0.5
  max_baseline_contribution_r: -0.70
  max_subsampled_buckets: 20

# F3: THE REGION-MATCHED ARM FOR ALL THREE MODEL CLASSES. The bias-aware arm matches fold only,
# so region alone separates its classes at a median AUROC of 0.748, and the repair existed for
# the 4-mer ONLY because nothing could dispatch a neural sweep for the arm. The obvious
# objection -- that a convolutional network or a language model might lean on region in a way a
# bag of 4-mers does not -- had no answer. 940 fold-runs on Modal A10G, $18.97.
#
# It does not change the answer. With region matched the bias-aware arm still gives the smallest
# contribution of the three for every model class, and the correction WIDENS the span in all
# three cases (5.42 -> 7.20, 7.42 -> 8.40, 3.72 -> 4.93), which is the opposite of what a
# confound-driven result would do. Gated as a direction, not merely as three values.
#
# SpliceBERT loses the most from the repair (-0.0114 against -0.0030 and -0.0013), so the
# language model was the one leaning hardest on transcript region.
#
# The 4-mer column is a CROSS-TABLE CONTROL: region_asymmetry.py computed it independently from
# a different script on the same windows, and it agrees to 1.14e-16.
region_matched_neural:
  n_datasets: 94
  max_control_gap: 1.0e-9
  baseline:         {value: 0.8052, tol: 0.004}
  gain_kmer:        {value: 0.0092, tol: 0.002}
  gain_cnn:         {value: 0.0100, tol: 0.002}
  gain_splicebert:  {value: 0.0352, tol: 0.005}
  span_kmer:        {value: 7.20, tol: 1.20}
  span_cnn:         {value: 8.40, tol: 1.40}
  span_splicebert:  {value: 4.93, tol: 0.70}
  published_span_kmer:       {value: 5.42, tol: 0.05}
  published_span_cnn:        {value: 7.42, tol: 0.05}
  published_span_splicebert: {value: 3.72, tol: 0.05}

# F5: WHAT THIS LITERATURE ACTUALLY DOES. The recommendation to report a composition-only AUROC
# is only worth making if the field does not already do it, and only aimed correctly if we know
# what the field constructs. Both were assumed until this survey and one assumption was WRONG.
#
# The paper claimed sequence-level dinucleotide shuffling is "what most published predictors
# use" and named GraphProt, iDeepS and RBPsuite. None of the seven surveyed sources uses it as
# its primary construction. GraphProt shuffles genomic COORDINATES within bound genes; the
# RBP-24 dataset does the same with BedTools; RBPsuite 2.0 uses pybedtools shuffle to non-peak
# regions of the same transcript. Sequence shuffling appears only as a FASTA-input option in
# RNAProt and as an alternative in DeepCLIP.
#
# Five of seven relocate genomic INTERVALS, which leaves composition entirely unconstrained --
# a stronger motivation for reporting the baseline than the claim the paper originally made.
# And 0 of 7 report a composition-only AUROC beside their headline, which is what makes the
# recommendation a change rather than a description of practice.
negative_set_survey:
  n_sources: 7
  n_with_baseline: 0
  n_sequence_shuffle: 0
  min_coordinate: 4

# THE ESTIMATOR'S FLOOR AT THE ORDER-TWO BASELINE. The order-four profile calibrates a
# 337-column baseline; every headline here uses the nineteen-column one, so that calibration
# bounds an estimator the paper does not use. A 2-mer supplies an EXACT null at the order we do
# use: windows are a fixed 101 nt, so its sixteen dinucleotide counts are one hundred times the
# frequencies, and the fifteen frequency columns plus the intercept span all sixteen. Its true
# contribution is zero by construction.
#
# It measures +0.0119, +0.0137 and +0.0111. Two consequences, and they point opposite ways:
#   THE SPAN SURVIVES. The floor spans 1.24x while the contributions span 5.43x, so it covers
#   23% of the range it would have to explain and cannot produce the ordering.
#   THE LEVEL DOES NOT. The floor is 90.6% of the bias-aware arm's reported +0.0122, so that
#   arm's absolute increment is an upper bound. Gated so the qualification cannot be dropped.
#
# The floor happens to rank the arms in the published order. That is recorded rather than
# hidden, because a reader who spots the coincidence should find it already addressed.
# THE OUTER-FOLD ROUTE, MEASURED BY CLOSING IT. scripts/cross_fitting.py refits the base model
# on the folds excluding both the outer test fold and the row being scored, so no information
# from the outer test fold reaches the nested coefficients. Two claims in earlier drafts died
# here and the values below are what killed them: the floor is this route rather than the
# conditioning effect the Results attributed it to, and the bias is NOT one-directional -- for
# the 4-mer, closing the route raises the contribution.
# POSITIVE-SET OVERLAP. The committed table existed with no producing script and its `jaccard`
# column was min(n)/max(n) -- a count ratio, exact to 1e-16, labelled a Jaccard index. It
# answers "did the arms retain the same NUMBER of positives", not "the same positives", because
# the id it keyed on is a per-arm row index: the same id names chr12 in one arm and chr9 in the
# other. Recomputed on genomic coordinate the median is unchanged and the minimum moves from
# 0.9237 to 0.9164.
# THE COMMON-POSITIVE SENSITIVITY. The review's P1.1: the protocols do not vary ONLY the
# negatives, because the matchers reject different positives, and a qualitative reason for
# declining the analysis is not the analysis. Run, and it changes nothing: 0.23% of positives
# dropped, the dn/gc ratio moves 2.499 -> 2.511.
common_positives:
  n_datasets: 94
  frac_dropped:       {value: 0.0023, tol: 0.0005}
  gain_common_gc:     {value: 0.0265, tol: 0.0010}
  gain_common_dn:     {value: 0.0666, tol: 0.0015}
  shift_gc:           {value: 0.0000, tol: 0.0003}
  shift_dn:           {value: 0.0003, tol: 0.0003}
  ratio_common:       {value: 2.511, tol: 0.030}
  ratio_full:         {value: 2.499, tol: 0.030}
  n_contrast_positive: 88

positive_set_overlap:
  n_datasets: 94
  median_jaccard: {value: 0.9972, tol: 0.0005}
  min_jaccard:    {value: 0.9164, tol: 0.0005}
  n_identical: 10

cross_fitting:
  n_datasets: 94
  # The 2-mer's true contribution is zero by construction, so a cross-fitted value near zero is
  # the check that the procedure works. Tolerance is absolute and tight for that reason.
  cf2_gc:   {value: 0.0005, tol: 0.0008}
  cf2_dn:   {value: -0.0001, tol: 0.0008}
  cf2_neg2: {value: 0.0003, tol: 0.0008}
  # The 4-mer, whose truth is unknown. These must stay close to the published panel means.
  cf4_gc:   {value: 0.0282, tol: 0.003}
  cf4_dn:   {value: 0.0671, tol: 0.004}
  cf4_neg2: {value: 0.0139, tol: 0.002}
  # The channel for the 4-mer is NEGATIVE in every arm. Asserted as a sign, because the sign is
  # the claim that was wrong before it was measured.
  max_channel_4mer: 0.0005          # channel must be <= this, i.e. not meaningfully positive
  min_floor_removed: 0.95           # fraction of the 2-mer floor the cross-fitting removes
  # THE LABEL-FREE ROUTE, measured rather than argued about. A review noted that calling the
  # result "fully cross-fitted" while standardising over the whole dataset is too strong,
  # because at fixed C the scale sets the effective penalty. Refitting every transform inside
  # the outer training rows changes the answer by less than 1e-4 in all six cells.
  max_cost_of_global_scaling: 0.0001
  min_datasets_floor_lowered: 85    # of 94, per arm
  span_published: {value: 5.42, tol: 0.05}
  span_crossfitted: {value: 4.84, tol: 0.10}

estimator_floor:
  n_datasets: 94
  floor_gc:   {value: 0.0119, tol: 0.003}
  floor_dn:   {value: 0.0137, tol: 0.003}
  floor_neg2: {value: 0.0111, tol: 0.003}
  min_datasets_positive: 70
  max_floor_span: 1.60
  max_floor_span_fraction: 0.35
  min_worst_ratio: 0.70
  floor_ordering_matches: 1
