# Reference values: what a correct run of THIS pipeline produces.
#
# WHAT THIS FILE IS FOR. Stage 14 asserts every published claim against these values with an
# explicit tolerance. A pipeline that runs to completion and quietly produces different
# science is worse than one that crashes, because nobody diffs a plausible table. This file
# is the difference between "the pipeline ran" and "the pipeline is correct".
#
# HOW THESE VALUES WERE ESTABLISHED. From the pipeline's reference run: the first complete
# end-to-end execution, from raw ENCODE peaks to figures, with every stage's inputs and
# outputs recorded in GCS and every task pinned to an image digest. They are not aspirations
# and not literature values -- they are what this code produces on this data.
#
# WHY TOLERANCES AND NOT EQUALITY. Some variation is legitimate and unavoidable:
#
#   * BLAS thread count changes summation order, moving iterative solvers in the last
#     few decimals. The images pin OMP_NUM_THREADS=1 to bound this, not eliminate it.
#   * GPU and CPU inference of the same weights differ. Measured on 19,051 variants scored
#     both ways: max |difference| 1.14e-04, correlation 1.000000.
#   * Bootstrap intervals move with the seed in the third decimal.
#   * A panel restricted to a subset shifts means by up to ~0.01.
#
# Tolerances absorb exactly that much and no more. A change larger than the tolerance is a
# regression, not noise.
#
# WHERE THE CLAIM IS ABOUT A COUNT, THE COUNT IS CHECKED. "Every dataset falls" and "the
# ordering holds" are the assertions the paper actually makes, so they are asserted as
# unanimity and as ordering rather than inferred from two means. R1's gain RATIO is checked
# directly because it is the thesis: if it inverts, the paper is wrong however close the
# individual numbers land.

meta:
  # The reference run of this pipeline. Update ONLY when a change to the science is
  # intended, never to make a failing check pass.
  reference_run: "rbp-repro reference run"
  established: "2026-08"
  # THE PANEL, AND WHY R1's n IS SMALLER THAN THE PANEL.
  #
  # The study runs on 95 datasets. R1 compares the two negative-set arms, so every dataset
  # must exist in BOTH -- and one of the 95, NCBP2:K562, matched only 384 pairs under GC
  # matching against 406 under dinucleotide matching, so it falls below the min_pairs=400
  # floor in one arm and not the other. R1 therefore has n = 94.
  #
  # The stage-7 job is 189 TASKS, not 189 datasets: 95 dinuc + 94 gc. Every dataset is
  # processed once per arm, because one arm alone says nothing about the cost of matching.
  study_panel_n: 95
  r1_panel_n: 94
  stage7_tasks: 189

# --- R1: the negative-set protocol effect ---------------------------------------------
# The headline is the unanimity and the second-order gain, not the drop.
r1_cost_of_matching:
  # RECENTRED on what cost_of_matching.csv actually contains. These read 0.7963 and 0.6893
  # against measured 0.7981 and 0.6886, drift that a 0.015 tolerance absorbed silently -- the
  # same defect as `cost` below, found by cross-checking against the identical quantity now
  # emitted by scripts/scale_check.py from the two rehearsal arms. The two paths are gated
  # separately on purpose: if they ever disagree, one of the tables is stale.
  auroc_gc:        {value: 0.7981, tol: 0.010}
  auroc_dinuc:     {value: 0.6886, tol: 0.010}
  # CENTRED ON WHAT THE PAPER CLAIMS AND ON WHAT THE TABLE CONTAINS, which are the same
  # number. This was {value: -0.1080, tol: 0.012}, split between the 94-dataset study panel
  # (-0.1095) and the full 189-dataset panel (-0.1070) so the tolerance would span both. But
  # verify_r1 reads cost_of_matching.csv, which IS the 94-dataset panel, so the gate was
  # centred 0.0015 away from the only value it can ever see and the abstract's figure sat off
  # centre in its own check. Measured mean -0.1095, bootstrap CI half-width 0.0116.
  cost:            {value: -0.1095, tol: 0.012}
  # A SUPPORTING CHECK, NOT THE HEADLINE, and this block used to contradict itself. It
  # called the gain ratio "the actual finding" while the R4 block said the same comparison
  # must not be the headline, because the composition baseline's features ARE the ones the
  # dinucleotide matcher controls. Both cannot be true. The ratio is kept as a direction
  # check -- if it inverts, something is badly wrong -- but the reported claim is the
  # GC-arm share alone. See r1_headline_is_gc_share_only below.
  #
  # THESE ARE THE NESTED GAINS: composition alone versus composition PLUS the sequence score,
  # which is the rehearsal's delta_auroc and the quantity the claim is about. They were
  # previously the naive difference of two standalone AUROCs (0.0165 -> 0.0597, ratio 3.94),
  # a quantity with no confidence interval and no p-value that nothing in the write-up
  # claims. The nested figures are smaller and better supported, and the conclusion is the
  # same: the gain rises sharply under the harder negative set.
  # TOLERANCE MUST NOT EXCEED THE PUBLISHED INTERVAL. A referee inflated both nested gains by
  # 18% -- moving the headline from +0.0265 to +0.0313, well outside its own published CI of
  # +/-0.0057 -- and this file passed 105/105, because the tolerance was +/-0.008. Scaling both
  # gains preserves their ratio, so `gain_ratio_min` was blind to it too. A gate looser than
  # the interval in the abstract certifies a number the paper does not claim.
  #
  # Set to the bootstrap CI half-width, measured: gain_gc [+0.0212, +0.0325] -> 0.0057,
  # gain_dinuc [+0.0556, +0.0771] -> 0.0107. Rounded up by a hair for BLAS/seed jitter and no
  # further.
  gain_gc:         {value: 0.0265, tol: 0.006}
  gain_dinuc:      {value: 0.0662, tol: 0.011}
  gain_ratio_min:  2.0
  # The nested gain must actually be significant, not merely larger. Without this the ratio
  # could rise because both arms are noise.
  gain_significant_on_min_fraction: 0.80
  # Every dataset must fall. Not "on average".
  fraction_datasets_falling: {value: 1.0, tol: 0.0}
  wilcoxon_p_max: 1.0e-15

# --- R1, continued: is the protocol effect real or an AUROC-scale artefact? ------------
#
# WHY THIS BLOCK EXISTS. R1's headline contrast, +0.0397, was printed in the manuscript and
# existed in NO committed table and under NO golden key. It could not be recomputed and it
# could not fail. `contrast_auroc` below is the first assertion of it in the project's
# history, and it is now derived by `scripts/scale_check.py` from the two rehearsal arms.
#
# THE OBJECTION IT ANSWERS. A nested AUROC gain is compressed when the baseline is already
# high, and the two arms start at 0.7827 and 0.6280. Measured compression factor: 1.51x. So
# the observed direction is predicted by the scale alone, and the claim needs the part that
# is NOT scale. Transplanting the GC arm's own d' increment onto the dinucleotide baseline
# gives the scale-only contrast; what remains is the protocol effect. Measured: 21% scale,
# 79% protocol.
r1_scale_check:
  # WHICH MODEL. The manuscript said "5-mer" four times; both rehearsal tables record k = 4 on
  # all 189 rows. params.yaml's `cv: k: 5` is the CV FOLD COUNT, not the k-mer size. Gated
  # because 150 assertions all checked values and none checked what produced them.
  kmer_k:                {value: 4.0, tol: 0.0}
  # THE SIX CELLS OF R1's HEADLINE TABLE. Printed in the manuscript, computed on the fly and
  # stored in no table until scripts/audit_manuscript.py went looking -- the same state the
  # +0.0397 contrast survived six review rounds in.
  mean_composition_gc:   {value: 0.7827, tol: 0.010}
  mean_composition_dn:   {value: 0.6280, tol: 0.010}
  mean_score_gc:         {value: 0.7981, tol: 0.010}
  mean_score_dn:         {value: 0.6886, tol: 0.010}
  mean_full_gc:          {value: 0.8092, tol: 0.010}
  mean_full_dn:          {value: 0.6941, tol: 0.010}
  contrast_auroc:        {value: 0.0397, tol: 0.004}
  nested_gc:             {value: 0.0265, tol: 0.004}
  nested_dn:             {value: 0.0662, tol: 0.007}
  contrast_scale_only:   {value: 0.0083, tol: 0.002}
  # THE HONEST HEADLINE. If this fails, R1 fails and there is no paper.
  contrast_protocol:     {value: 0.0313, tol: 0.004}
  protocol_ci_must_exclude_zero: true
  # Scale must be a minority of the effect. Measured 0.21; a run where compression accounts
  # for most of the contrast means the claim is an artefact.
  max_scale_share:       0.35
  # The same comparison on an unbounded scale, which would be zero if compression were the
  # whole story.
  contrast_dprime:       {value: 0.1290, tol: 0.015}
  # The corrected version of the abstract's "hides two-thirds". It is about half.
  hidden_fraction_corrected: {value: 0.4735, tol: 0.05}
  #
  # THE REVERSAL, GATED SO IT CANNOT BE QUIETLY DROPPED. On the log-odds scale the contrast
  # changes sign. That is reported in the paper, not hidden, and these three keys are why it
  # is not fatal: the between-arm coefficient gap tracks each task's TOTAL signal and is
  # uncorrelated with the incremental value it is supposed to measure, which is the standard
  # non-comparability of logistic coefficients across fits (Mood 2010). If the fingerprint
  # ever inverts -- the gap tracking increment rather than total signal -- the reversal
  # becomes real evidence against R1 and this block must fail.
  contrast_logodds:      {value: -0.3771, tol: 0.06}
  min_rho_coef_gap_total:     0.35
  max_rho_coef_gap_increment: 0.25
  contrast_logodds_normalised: {value: 0.1154, tol: 0.035}
  # THE REVERSAL, TURNED INTO EVIDENCE. If the coefficient gap were nothing but the latent
  # rescaling, it would be coef_dn * (1 - total-signal ratio) = -0.4927. It is -0.3771, so
  # +0.1156 of incremental value shows through the rescaling, and its interval excludes zero.
  # This is a stronger answer to the reversal than the correlational fingerprint, because it
  # is arithmetic on the same fits rather than a correlation across datasets.
  logodds_scale_null:    {value: -0.4927, tol: 0.040}
  logodds_residual:      {value: 0.1156, tol: 0.035}
  residual_ci_must_exclude_zero: true

# --- R1: does the strand artifact drive the surviving contrast? ------------------------
#
# READ THIS BLOCK AS A RECORD, NOT AS A CLEARANCE. The previous strand block in this file was
# deleted because it gated a retracted quantity behind a ceiling (contrast_rho_max: 0.40) so
# loose that a real confound would have passed it. This block must not repeat that. It pins the
# measured values so they cannot drift, and it asserts only the two things the data actually
# support: that the two halves agree, and that the association is not the known size effect
# relabelled. It does NOT assert that the artifact is harmless, because this test cannot show
# that -- frac_sense spans only 0.433 to 0.615 across the 40 audited datasets, so there is
# almost no leverage, and rho = -0.24 carries an interval of [-0.54, +0.11].
r1_strand_contrast:
  n_datasets:            {value: 40.0, tol: 0.0}
  mean_frac_sense:       {value: 0.5519, tol: 0.010}
  # The contrast on this subset must match the published one, or the 40 are not representative
  # and nothing measured on them transfers.
  contrast_on_subset:    {value: 0.0378, tol: 0.006}
  rho_frac_sense_contrast: {value: -0.2396, tol: 0.05}
  # Size is the one confound already known to move the contrast (rho +0.307 on all 94). If the
  # partial correlation ever diverges sharply from the raw one, the reading changes.
  partial_rho_given_size: {value: -0.2522, tol: 0.05}
  max_raw_partial_gap:   0.10
  # THE ONE REASSURING RESULT, AND IT IS GATED AS SUCH: the sense-rich and sense-poor halves
  # agree, and the difference between them is small against the +0.0397 being defended.
  halves_difference:     {value: -0.0068, tol: 0.006}
  max_abs_halves_difference: 0.020
  halves_ci_must_include_zero: true
  # THE ADVERSE NUMBER, GATED SO IT CANNOT BE DROPPED. A linear extrapolation to fully correct
  # stranding lands at -0.046, i.e. sign reversal, on an interval of [-0.189, +0.072] that is
  # far too wide to act on in either direction. It is recorded because the honest conclusion is
  # "this cannot be settled from committed data", and deleting the number would make the
  # limitation read softer than it is.
  extrapolated_at_full_sense: {value: -0.0458, tol: 0.020}
  # Leverage, asserted so that anyone reading the correlation sees why it is weak.
  max_frac_sense_leverage: 0.25

# --- R1: the strand artifact, measured properly (restriction + matched placebo) ---------
#
# THE PRE-REGISTERED TEST, AND IT PASSED. Written into docs/61 before it was run: the contrast
# must keep its sign, its interval must exclude zero, and at least 60% of the published point
# estimate must survive. Result: +0.0318 [+0.0234, +0.0415], 85% surviving.
#
# WHY THE PLACEBO IS THE EXPERIMENT. Keeping only pairs whose negative is unambiguously on its
# own gene's strand discards ~57% of pairs, and a 256-feature k-mer model loses more from that
# than a 19-feature composition baseline does, in BOTH arms. Restriction alone therefore shows
# -0.0091, which a naive reading attributes entirely to strand. Dropping the same number of
# pairs at RANDOM shows -0.0032 of the same shrinkage with no strand involved. The difference,
# -0.0059, is the strand-specific effect.
#
# THE ARTIFACT IS REAL, NOT ABSENT. Its interval excludes zero, so this is a measured control
# rather than a null result, and it is stronger evidence for that reason. It costs ~15% of the
# contrast. An earlier 20-dataset run reported -0.0002 using a dinucleotide arm that was a
# different draw; the canonical tables were fetched (96 MiB, $0.011) and every dataset here is
# gated on reproducing its published row before being used.
r1_strand_placebo:
  n_datasets:            {value: 40.0, tol: 0.0}
  contrast_full:         {value: 0.0378, tol: 0.007}
  contrast_sense_only:   {value: 0.0287, tol: 0.007}
  contrast_placebo:      {value: 0.0346, tol: 0.007}
  contrast_placebo_strat: {value: 0.0322, tol: 0.007}
  change_from_restriction: {value: -0.0091, tol: 0.003}
  change_from_placebo:   {value: -0.0032, tol: 0.0015}
  # THE THREE-WAY DECOMPOSITION. Restriction alone shows -0.0091 and a naive reading calls all
  # of it strand. A random-drop placebo reproduces -0.0032 of it with no strand involved. A
  # placebo matched to the retained set's REGION marginals accounts for a further -0.0024,
  # because sense-kept pairs are more intronic (0.434 vs 0.402) and less exon_nc (0.100 vs
  # 0.120) while GC is balanced to the third decimal (0.5318 vs 0.5329). What is left is
  # strand.
  strand_excess_unstratified: {value: -0.0059, tol: 0.003}
  locus_mix:             {value: -0.0024, tol: 0.0015}
  strand_excess:         {value: -0.0036, tol: 0.003}
  # NO LONGER ASSERTED TO EXCLUDE ZERO, AND THAT IS A RETRACTION. The unstratified excess had
  # an interval clear of zero and the manuscript said "the artifact is REAL". Once the placebo
  # is matched on region the interval is [-0.0071, +0.0001] and it is not. The artifact is
  # small and not distinguishable from zero; only its BOUND is claimed now.
  max_abs_strand_excess: 0.008
  # The locus-mix component IS distinguishable from zero, which is why the unstratified
  # placebo was not a valid counterfactual. If this ever straddles zero the stratification is
  # unnecessary and the simpler placebo can come back.
  locus_mix_ci_must_exclude_zero: true
  # PRE-REGISTERED, fixed before the run: sign kept, interval clear of zero, >=60% surviving.
  corrected_contrast:    {value: 0.0342, tol: 0.006}
  corrected_ci_must_exclude_zero: true
  min_fraction_surviving: 0.60

# --- R1: which arm carries the strand artifact? ----------------------------------------
#
# The direction of this asymmetry decides whether the artifact could be MANUFACTURING the
# contrast or merely shrinking it. Measured: the cue is weaker in the GC arm, which is the arm
# with the smaller nested gain, so it biases the contrast DOWNWARD and +0.0397 is conservative.
# Coordinates only, no model fitting, independent of the placebo experiment.
r1_strand_asymmetry:
  frac_sense_gc:   {value: 0.4275, tol: 0.020}
  frac_sense_dn:   {value: 0.4744, tol: 0.020}
  asymmetry:       {value: 0.0469, tol: 0.012}
  # THE CLAIM: the dinucleotide arm must be MORE sense, in most datasets.
  min_datasets_dinuc_more_sense: 33
  asymmetry_must_be_positive: true

# --- R1d: does the contrast replicate, and does it buy anything? -----------------------
#
# THE ANSWER TO "THE SIGN IS DESIGN-IMPLIED". The concession is correct: the composition
# baseline's 15 df are exactly what the dinucleotide matcher controls, so the direction is
# implied and only the magnitude is informative. These two keys are what the magnitude is
# worth. Replication across cell lines is out-of-sample (separate eCLIP experiments, separately
# drawn negatives) and the design forces nothing about it -- the sign is guaranteed in each
# line independently, so a high correlation is information about MAGNITUDE. And efficiency is
# what a benchmark builder acts on; it is immune to the objection entirely, because the sign
# being predictable says nothing about how well the effect is measured.
r1_robustness:
  n_proteins_both_lines: {value: 15.0, tol: 0.0}
  replication_r:         {value: 0.9094, tol: 0.030}
  min_replication_ci_low: 0.70
  # The contrast must replicate BETTER than either arm's gain alone, or it is not a property
  # of the protein but of one arm's noise.
  replication_gc_alone:  {value: 0.5179, tol: 0.060}
  replication_dn_alone:  {value: 0.8134, tol: 0.050}
  contrast_must_replicate_best: true
  efficiency_z_ratio:    {value: 1.3150, tol: 0.050}
  min_efficiency_ratio:  1.10
  relative_sample_size:  {value: 0.5783, tol: 0.040}
  composition_beats_model_gc: {value: 29.0, tol: 0.0}
  composition_beats_model_dn: {value: 14.0, tol: 0.0}

# --- R1e: is the contrast an artifact of k, and can it be REBUILT? ---------------------
#
# THE SECOND VERIFICATION IN THIS REPOSITORY. Every other R1 number is READ from a table the
# analysis pass wrote, so its gate detects drift and not error. k_sweep.py refits composition
# and k-mer models from `dataset.tsv` sequence for all 94 datasets in both arms and rebuilds
# the contrast. It lands on the committed value exactly. If the published contrast were wrong,
# this column could not agree with it.
#
# All 94 datasets pass the per-arm reproduction gate at k=4 before any other k is trusted.
r1_k_sweep:
  n_datasets:        {value: 94.0, tol: 0.0}
  contrast_k3:       {value: 0.0311, tol: 0.005}
  contrast_k4:       {value: 0.0397, tol: 0.005}
  contrast_k5:       {value: 0.0397, tol: 0.005}
  contrast_k6:       {value: 0.0355, tol: 0.005}
  # THE PROOF. Rebuilt from sequence against the committed table, same datasets.
  max_rebuild_diff:  0.0005
  # THE ROBUSTNESS. The contrast must survive every k, or it is a k artifact.
  min_contrast_any_k: 0.020
  min_datasets_positive_all_k: 75
  # And the manuscript's "5-mer" error must be shown to be inconsequential, not merely
  # corrected: k=5 and k=4 must agree.
  max_k5_minus_k4:   0.004

# --- R2: four models on identical splits ----------------------------------------------
r2_four_models:
  composition: {value: 0.628, tol: 0.020}
  kmer:        {value: 0.688, tol: 0.020}
  cnn:         {value: 0.708, tol: 0.025}
  splicebert:  {value: 0.809, tol: 0.025}
  # Ordering is the claim; it must hold exactly.
  required_order: [composition, kmer, cnn, splicebert]
  splicebert_beats_composition_fraction: {value: 1.0, tol: 0.0}

# --- R3: positional concentration (ISM Gini) ------------------------------------------
r3_locality:
  kmer_gini_median:       {value: 0.295, tol: 0.030}
  splicebert_gini_median: {value: 0.351, tol: 0.035}
  median_difference:      {value: 0.062, tol: 0.020}
  # The strong form: SpliceBERT is more concentrated on the large majority, and REVERSED
  # on none beyond noise. The zero is the part that matters.
  fraction_splicebert_higher_min: 0.85
  n_significantly_reversed_max: 0
  wilcoxon_p_max: 1.0e-10

# --- R4: the ClinVar ladder -----------------------------------------------------------
# Three rungs. The claim is the GAPS between them, so each is checked and so is the order.
# --- R4: the ClinVar arm, PAIRED PER DATASET ------------------------------------------
#
# THE POOLED LADDER IS NO LONGER THE REPORTED RESULT, and this block is the record of why.
#
# variant_ladder() concatenates ~19k variants across 95 datasets into one AUROC per arm.
# That is inflated: a dataset's mean |delta| correlates with its pathogenic rate at Spearman
# +0.73 for the matched arm and spans 10.4x across datasets, so the pooled number partly
# measures which dataset a variant came from. Matched pooled 0.829 against 0.755 paired;
# the pooled specificity gap of +0.149 is really +0.065.
#
# Conservation was the only arm immune, because phyloP is on a fixed external scale. That is
# why the artefact stayed invisible for so long: the arm that could not be inflated was
# winning anyway, so nothing looked wrong.
#
# The previous version of this block asserted the pooled numbers and passed, which is the
# sharpest lesson in this file: a gate that checks the number the code computed, rather than
# whether that number is the right statistic, reads as confirmation.
r4_paired_specificity:
  # The adequately powered stratum is the headline. Median coverage is 140 variants per
  # dataset and many carry a handful of pathogenic ones, so the all-datasets stratum is
  # noise-dominated -- it is asserted here too, unflattering value included, because
  # reporting only the stratum that works is the thing this project exists not to do.
  min_pathogenic_headline: 20
  n_datasets_headline:    {value: 44,     tol: 3}
  matched_auroc:          {value: 0.7553, tol: 0.03}
  mismatched_auroc:       {value: 0.6908, tol: 0.03}
  conservation_auroc:     {value: 0.8921, tol: 0.025}
  specificity_gap:        {value: 0.0645, tol: 0.025}
  specificity_p_max:      0.01
  matched_wins_min_fraction: 0.65
  # Conservation must still lead. If a model ever beats phyloP here that is a real result,
  # but it would need saying out loud rather than slipping through a tolerance.
  conservation_lead:      {value: 0.1368, tol: 0.05}
  # The all-datasets stratum, which shows NOTHING. Asserted so it cannot be quietly dropped.
  all_datasets_gap:       {value: -0.0114, tol: 0.03}
  # The effect must grow with power. A spurious gap would not.
  gap_power_rho_min:      0.30
  # Within-dataset standardised, conservation-controlled, cluster-bootstrapped coefficients.
  coef_matched_within:    {value: 1.1238, tol: 0.12}
  coef_mismatched_within: {value: 0.6379, tol: 0.10}
  # The two CIs must not overlap, or the specificity claim is not established.
  coef_cis_must_separate: true
  min_clusters: 800
  # THE TRIVIAL POSITIONAL BASELINE, and it is the most deflating number in the study.
  #
  # "What fraction of the OTHER variants in this 1-Mb window are pathogenic" uses no sequence,
  # no model and no biology. Leave-one-out, so a variant never contributes to its own window.
  # It reaches 0.814 where the model reaches 0.755, and the model does not beat it in ANY
  # stratum: 15/44 wins at >=20 pathogenic (p=0.007 AGAINST the model), and a tie at >=50
  # (p=0.53). Pooled it is 0.818 against the model's inflated 0.829.
  #
  # This is asserted, with the sign that embarrasses us, for one reason: it means absolute
  # AUROC on peak-proximal ClinVar variants is uninformative about model utility, and any
  # version of this paper that reports 0.755 as evidence of usefulness is wrong. What survives
  # is the PAIRED specificity contrast, which this baseline cannot explain because it applies
  # equally to both arms.
  block_prevalence_auroc: {value: 0.8139, tol: 0.03}
  # The model must NOT be claimed to beat it. A positive value here would be a real result
  # and would need arguing for, not absorbing into a tolerance.
  model_minus_prevalence_max: 0.02
  # The composition share, with the interval it was missing.
  composition_share_gc:    {value: 0.948, tol: 0.03}
  composition_share_dinuc: {value: 0.678, tol: 0.04}
  composition_share_drop:  {value: 0.270, tol: 0.05}
  # THE SHARE IS A PROPERTY OF THE TASK *AND THE MODEL*, and stating it without naming the
  # model is the error this project made in its own summaries for two weeks. The three above
  # are measured against the k-mer model, because that is what the rehearsal arm trains.
  # Same estimator, same datasets, same negatives -- only the model changes:
  composition_share_vs_kmer:       {value: 0.6818, tol: 0.035}
  composition_share_vs_cnn:        {value: 0.6197, tol: 0.035}
  composition_share_vs_splicebert: {value: 0.4137, tol: 0.035}
  # THE CONTRAST IS NOT A FINDING. Retracted as a headline 2026-08-27, one day after being
  # promoted to one, and kept here with the reason attached.
  #
  # share_m = C / gain_m, where C = mean(composition_auroc) - 0.5 is IDENTICAL for every
  # model. So share_kmer / share_SB == gain_SB / gain_kmer, exactly -- verified to 6 decimal
  # places (1.648166 both ways). The "model-dependent composition share" is therefore a
  # monotone rescaling of the four-model AUROC ladder, which is R2, which was cut in round 2
  # as prior art (Horlacher 2023). And SpliceBERT beats the k-mer model on 95/95 datasets, so
  # the contrast excludes zero with probability 1: the interval was decoration.
  #
  # THE SUBSTANTIVE VERSION OF THIS CLAIM IS UNMEASURED. "The negative-set protocol does not
  # penalise every model equally" needs each model's AUROC drop from GC- to dinuc-matched
  # negatives. Only composition and k-mer have both arms: sweep_dinuc.csv is the only sweep
  # table and its `arm` column is {'dinuc'}, so the CNN and SpliceBERT never ran on GC-matched
  # negatives. Measuring it costs GPU time and has not been spent.
  composition_share_model_gap:    {value: 0.2681, tol: 0.05}
  # Replaces composition_share_model_gap_ci_excludes_zero, which asserted something true by
  # construction. This asserts the IDENTITY instead, which is a real invariant: if the
  # estimator is ever changed so that the share stops being C/gain, this fails and whoever
  # changed it finds out.
  share_ratio_equals_inverse_gain_ratio_max_diff: 1.0e-6
  # Cross-check: the k-mer share here is the same quantity as composition_share_dinuc above,
  # computed from a different table. If these two ever disagree, one of the tables is wrong.
  kmer_share_cross_check_max_diff: 0.01

  # Both paired claims must be robust to dataset size. They are paired within dataset, so
  # size cannot confound them; this bounds effect MODIFICATION.
  size_rho_max: 0.35
  # THE FOUR ATTACKS, from a council review. Each was raised as a reason the specificity
  # result is not real, and each is recomputed every run so a regression fails the build.
  #
  # The coefficients above were WRONG until 2026-08-26 and too SMALL, not too large:
  # fit_delta_coef applied abs() to a value the caller had already standardised within
  # dataset, folding the below-mean half of a z-score back over the above-mean half. Caught
  # because the same contrast returned 0.729 from the pipeline and 1.169 from a hand-written
  # design matrix. Corrected: 1.124 vs 0.638, still non-overlapping, larger than reported.
  attack_gap_power_spearman_min: 0.85    # dose-response, not a cherry-picked cutoff
  attack_floor_range_max:        0.05    # the wrong-protein floor must stay flat
  attack_survives_trivial_rule:  true    # CIs must still separate with prevalence controlled
  attack_null_gap_abs_max:       0.01    # permutation null must sit at zero
  # The trivial rule must DECAY with window size, or it is a binning artefact rather than a
  # positional-prevalence effect. All three are asserted, including the 100 kb value that is
  # the most damaging number in the study.
  trivial_rule_100kb:  {value: 0.8512, tol: 0.03}
  trivial_rule_1mb:    {value: 0.8177, tol: 0.03}
  trivial_rule_10mb:   {value: 0.7330, tol: 0.04}

  # THE CIRCULARITY CAVEAT ON R1, and it limits what may be claimed.
  #
  # The composition baseline's 19 features ARE GC and dinucleotide frequencies, and the
  # dinucleotide arm matches negatives on exactly those. So the drop from 94.8% to 67.8% is
  # partly by construction: the matcher deletes the baseline's input. The 27-point difference
  # therefore measures the matcher, not biology, and MUST NOT be the headline.
  #
  # What is not circular is the FIRST number on its own. Under GC-matched negatives -- the
  # protocol actually in use in published work -- a 19-feature composition model recovers
  # 94.8% of measurable skill. That is a statement about a protocol, not about our matcher.
  # The 67.8% is a by-construction floor and is reported as a residual, not an achievement.
  r1_headline_is_gc_share_only: true

  # The three controls that tested whether the wrong-protein floor is a similarity artefact.
  # All three must stay negative or the control is contaminated and R4 must be withdrawn.
  floor_cell_line_p_min:  0.05
  floor_donor_strength_rho_max: 0.40

# --- R4: the pooled ladder, retained for comparison only ---
r4_variant_ladder:
  # ESTABLISHED FROM THIS PIPELINE'S OWN RUN (2026-08-26), not carried over.
  #
  # Every other block here was re-established when the pipeline was rebuilt. R4's was not,
  # because R4 could not complete until the ClinVar arm ran for the first time -- so these
  # numbers stayed at the earlier study's until now, and stage 14 was comparing this pipeline
  # against a different one.
  #
  # WHAT AGREES, to three or four decimals, and it is the part the result rests on:
  #   matched head AUROC   0.8294  (was 0.8286)
  #   conservation AUROC   0.9078  (was 0.9077)
  #   matched coefficient  1.6054  (was 1.6156)
  #
  # WHAT MOVED, and why. The k-mer and mismatched rungs both shifted up. Checked properly
  # rather than assumed: restricting this run to the earlier panel of 94 datasets reproduces
  # n = 18,991 exactly and still gives kmer coef 0.204, so the panel is NOT the cause. The
  # k-mer VARIANT deltas themselves differ (labels 100% identical, deltas correlate 0.825),
  # because the k-mer model is refit on regenerated matched negatives and its per-variant
  # delta is far more sensitive to that resampling than its binding AUROC, which reproduced
  # exactly at 0.6875. The mismatched rung moved because its donor pairing is
  # (index + 47) % len(manifest), and the manifest is 95 here rather than 94.
  #
  # Both are properties of this pipeline, not defects: the negatives are seeded
  # (default_rng(7)) so this run is deterministic. Tolerances below are unchanged in width;
  # only the centres move. The ladder's ordering, its monotone coefficients and the
  # specificity gap -- the three things the claim actually needs -- all hold either way.
  kmer_auroc:               {value: 0.552, tol: 0.030}
  mismatched_head_auroc:    {value: 0.680, tol: 0.035}
  matched_head_auroc:       {value: 0.829, tol: 0.035}
  conservation_auroc:       {value: 0.908, tol: 0.020}
  required_order: [kmer_auroc, mismatched_head_auroc, matched_head_auroc, conservation_auroc]
  # Cluster-corrected coefficients. The naive interval is ~30% too narrow and must not be
  # what gets reported; the verifier checks the clustered one.
  matched_coef:      {value: 1.605, tol: 0.150}
  mismatched_coef:   {value: 0.700, tol: 0.120}
  kmer_coef:         {value: 0.201, tol: 0.060}
  # The specificity claim: matched must clearly exceed mismatched, or the signal is not
  # binding-specific and R4 must be withdrawn.
  matched_minus_mismatched_min: 0.60
  # Inference must be clustered, not per-row.
  min_clusters: 800

# --- integrity gates, not science -----------------------------------------------------
integrity:
  # These are now READ. max_nan_fraction and min_tests_passing were declared here and never
  # looked at by verify_integrity, so two of three integrity gates were decorative in the one
  # file whose entire purpose is that the gate is real.
  max_nan_fraction: 0.0
  duplicate_datasets_allowed: 0
  # Checked against the actual suite, not a number typed once and left to drift. It read 480
  # while the suite had grown to 575.
  min_tests_passing: 570
  # HOW MANY CHECKS RAN, asserted, because almost every gate in verify.py is written
  # `if value is not None:` and therefore DISAPPEARS when a row is missing instead of failing.
  # Deleting five rows from one table once produced "106/106 passed". Asserting the count
  # catches that for every gate at once, including the ones nobody has attacked yet.
  # Raise this deliberately when checks are added; that is the point, not an inconvenience.
  # Counts the DOMAIN checks only, i.e. everything except this meta-check itself, so the
  # number here is directly comparable to the per-section output above it.
  min_domain_checks: 201
  # A RATCHET ON UNSOURCED NUMBERS. scripts/audit_manuscript.py extracts every value quoted to
  # >= 3 decimals in the manuscript and reports the ones traceable to no committed table and no
  # key here. It has already paid for itself twice: it found six cells of R1's OWN headline
  # table computed on the fly and stored nowhere (precisely the state the +0.0397 contrast
  # survived six review rounds in, now written by scripts/scale_check.py), and it found that
  # R4's five-row table splices its top row in from a different table with a different n.
  #
  # 45 IS NOT A CLEAN BILL OF HEALTH. Most survivors are aggregates over a SUBSET, such as the
  # mean conservation AUROC over the 44 powered datasets, which no whole-column aggregate can
  # reproduce. They need triaging one at a time, and the legitimate ones need emitting into
  # tables so this can ratchet toward zero. Until then the gate buys one thing, which is that a
  # NEW unsourced number fails the build.
  #
  # DO NOT RAISE THIS TO MAKE A BUILD PASS. Add the number to the table that owns it.
  max_manuscript_orphans: 21
  # Duplicated numbers must agree. cost_of_matching.csv is a join of the two rehearsal arms and
  # verify.py read only the join, so scrambling rehearsal_binding_dinuc.csv passed 166/166
  # while breaking 88/94, 94/94 and the Wilcoxon p. Exact equality: these are copies, not
  # recomputations, so any difference at all is corruption.
  max_cross_table_diff: 0.0

# --- the wrong-protein control's donor must actually be a WRONG protein -----------------
#
# RETRACTED 2026-08-27, and left here with its own obituary because deleting it would hide
# the most instructive failure in this project.
#
# The original block asserted `clean_donor_gap: 0.1210` on the 17 donors with "negligible
# overlap", and `floor_overlap_rho_max: 0.45` as a CEILING on the floor-vs-overlap
# correlation. Both were wrong, in opposite directions:
#
#   1. The ceiling gated the opposite of the claim. The clean-donor result REQUIRES a real
#      floor-vs-contamination association to exist; the gate passed as long as it was WEAK.
#      A gate that passes when the claim fails is worse than no gate.
#   2. `shared_frac = |t&d|/|t|` is normalised by the target, so it cannot be large when the
#      donor is small. It correlated with donor variant-set size at rho=+0.696, and
#      controlling for that the flagship association reversed and died (+0.299 p=0.049 ->
#      -0.240 p=0.12). It was measuring donor size wearing a contamination costume.
#   3. The placebo settled it: splitting the same 44 datasets by donor SIZE reproduced the
#      "clean donor" result BETTER (+0.1362, 16/17) than splitting by co-binding overlap
#      (+0.1210, 16/17). A variable with nothing to do with co-binding beat the real one.
#
# Superseded by r4_multidonor below, which screens donors on JACCARD (size-symmetric) and
# spans donor quality instead of stratifying on a proxy for it.
donor_overlap_RETRACTED:
  see: r4_multidonor

# --- the multi-donor wrong-protein control ----------------------------------------------
#
# Five donors per target instead of one, drawn to SPAN donor binding quality (-0.296..+0.296
# realised) and screened to jaccard <= 0.02. 474/475 tasks, 409 usable (target, donor) pairs.
#
# THE VERDICT THIS ENCODES IS "NOT IDENTIFIED", NOT "CONFIRMED". Three reviewers set
# acceptance criteria BEFORE seeing this table and all three ruled the same way: the effect
# is real on the powered stratum, absent on the full panel, and therefore conditional. The
# gates below assert BOTH panels for exactly that reason -- asserting only the powered one is
# how the retracted block above survived as long as it did.
r4_multidonor:
  n_pairs:              {value: 409, tol: 12}
  n_targets_all:        {value: 82,  tol: 2}
  n_targets_powered:    {value: 44,  tol: 3}
  # The confound that killed the single-donor design must be GONE. This is the gate that
  # would have caught the original error, and it is the only one here that matters.
  gap_vs_donor_advantage_rho_max: 0.20   # was -0.533 in the single-donor arm
  # Powered stratum: the effect is present.
  powered_gap:          {value: 0.0880, tol: 0.025}
  powered_wins_min_fraction: 0.80
  powered_p_max:        1.0e-05
  powered_intercept:    {value: 0.0784, tol: 0.030}
  powered_intercept_ci_excludes_zero: true
  # The stratum where the donor is the STRONGER model. The single-donor design returned a
  # null here (-0.0025, 9/18, p=1.00) and that null was a one-draw artifact.
  stronger_donor_gap:   {value: 0.0920, tol: 0.030}
  stronger_donor_wins_min_fraction: 0.80
  # THE FULL PANEL, WHICH SHOWS NOTHING. Asserted with the unflattering value, because the
  # disagreement between the two panels IS the result.
  all_panel_gap:        {value: 0.0124, tol: 0.025}
  all_panel_intercept:  {value: 0.0068, tol: 0.030}
  all_panel_intercept_ci_excludes_zero: false
  # Adding power as a covariate removes the powered-stratum effect too. Also asserted.
  powered_intercept_with_power: {value: 0.0236, tol: 0.030}
  powered_intercept_with_power_ci_excludes_zero: false
  # The mechanism: the floor is flat in power, the matched arm is not.
  floor_vs_power_rho_max:   0.25
  matched_vs_power_rho_min: 0.45

# --- the negatives are ~45% antisense, and that must not be what the contrast measures ----
#
# `negatives.py:328` gives each negative the POSITIVE's strand. A negative's location is
# chosen to match composition, not strand, so whether it lands on a gene running the assigned
# direction is a coin flip: measured 55.2% sense. The other 45% are sequence no transcript
# produces, while every positive is true sense RNA.
#
# This is a non-compositional cue that survives dinucleotide matching (matching is done on
# forward DNA and revcomp applies to both pair members), and a pre-mRNA language model can
# read direction where a dinucleotide model cannot. So it is a live alternative explanation
# for composition_share_model_gap and it has to be gated, not just mentioned.
#
# It loses on the DIFFERENTIAL. The artifact must act unequally on the two models to create a
# contrast between them, and it does not: it moves both shares hard (rho +0.41 and +0.52) and
# the contrast not at all (rho +0.23, p=0.16). Splitting the panel at the median sense
# fraction gives contrast +0.249 in the antisense-rich half and +0.264 in the antisense-poor
# half -- the objection predicts a much LARGER contrast where the artifact is strongest, and
# the data give a slightly smaller one.
strand_audit:
  # WHAT THIS BLOCK USED TO CONTAIN, AND WHY IT IS GONE. Six keys here gated the stability of
  # the composition-SHARE contrast across antisense-rich and antisense-poor halves
  # (contrast_rho_max, contrast_rho_p_min, share_rho_min, contrast_antisense_rich 0.2485,
  # contrast_antisense_poor 0.2644, contrast_halves_max_diff). That contrast is RETRACTED: it
  # is an algebraic identity, share_m = C/gain_m with C constant across models, so
  # share_kmer/share_SB equals gain_SB/gain_kmer exactly and the comparison excluded zero with
  # probability 1. Gating a retracted quantity is worse than not gating it, because the passing
  # count then certifies something the paper does not claim -- and those six checks were part
  # of every "N/N passed" this project has reported.
  #
  # WHAT SURVIVES is the measurement itself, which is real and is a genuine limitation:
  # negatives inherit the POSITIVE's strand (negatives.py:328), so only ~55% of them carry
  # their own gene's strand and the rest are antisense. It inflates every absolute AUROC in R1.
  frac_sense:              {value: 0.552, tol: 0.06}
  frac_no_gene_max:        0.02      # negatives really are inside genes, so "antisense" is meaningful

# --- the correctness half of verification -------------------------------------------------
#
# Every other block here is checked by reading a table the analysis pass wrote, so the gate
# detects DRIFT and not ERROR: corrupting an input and re-running verify.py produced zero
# failures when someone finally tested it. This block is checked by recomputing the published
# AUROC from the per-example scores committed under data/evidence/, for both deep
# architectures. Zeroing the score column makes it report max|diff| ~0.45 and fail, so unlike
# the rest of this file it cannot pass on nonsense.
recompute:
  max_abs_diff: 1.0e-09    # sklearn on identical floats; anything larger is drift
  min_datasets: 90         # of 95; a few absent folds is a broken mirror, not a broken claim

# --- R4: incremental value over conservation and position (the primary ClinVar claim) -----
#
# PROMOTED TO PRIMARY 2026-08-27 after peer review, and gated on the same day, because the
# last claim promoted to a headline without a gate turned out to be an algebraic identity.
#
# The previous framing ("conservation 0.892 and a positional rule 0.818 beat the model 0.755")
# is a replication of Grimm 2015 / Schreiber 2020 AND is circular: PP3 evidence behind ClinVar
# pathogenic assertions is conservation-derived, so phyloP partly re-reads the labels. An
# incremental-value analysis is immune to that, because label leakage inflates a competitor's
# AUROC without manufacturing incremental value for the model.
#
# What must hold: the model's coefficient barely moves when conservation is controlled, it does
# not collapse when the positional rule is added, and the wrong-protein arm stays separated.
r4_incremental_value:
  coef_matched_unconditional:   {value: 1.1238, tol: 0.06}
  coef_matched_given_phylop:    {value: 1.1214, tol: 0.06}
  coef_matched_given_both:      {value: 1.1689, tol: 0.07}
  coef_mismatched_given_phylop: {value: 0.6364, tol: 0.06}
  # THE CLAIM. Conditioning on conservation must not explain the model away. Stated as a
  # fraction so it cannot be satisfied by both coefficients drifting together.
  max_attenuation_fraction:     0.10
  # The arms must stay separated under control, or "specific to the protein" is unsupported.
  arms_must_not_overlap_under_control: true
  # The positional rule must remain informative WITHIN conservation strata, or it is just
  # conservation in disguise and the paper has one baseline, not two.
  positional_rule_min_auroc_within_phylop_decile: 0.70
  # The two positional-rule numbers the paper actually prints, which were ungated while the
  # floor above was the only assertion. They also both MOVED: prevalence was computed on the
  # pre-deduplicated assignment table (2.40 rows per variant), so leave-one-out removed one
  # copy and left ~1.4 copies of a variant's own label in its own block. 0.8246 -> 0.8164 and
  # 0.7678 -> 0.7548 after deduplicating first.
  positional_rule_unstratified_auroc: {value: 0.8164, tol: 0.010}
  positional_rule_phylop_spearman:    {value: 0.3375, tol: 0.030}

# --- the estimator R4 needed, done correctly, on the arm that is in the repo -----------
#
# WHAT THIS BLOCK REPLACES. `variant_specificity_refit.csv` was built by a caller that passed
# conservation into EVERY fit, so its "controls = none" row was already adjusted and the
# published "0.21% attenuation" was the effect of dropping 168 rows. The keys above
# (r4_incremental_value) still gate those retracted numbers and must not be trusted; this
# block gates the corrected procedure on the k-mer arm, which is the only variant score table
# committed to the repo. It is a methods demonstration, not R4.
#
# THE POINT, AND IT INVERTS THE ORIGINAL READING. Near-zero attenuation was presented as
# evidence that the model's signal is independent of conservation. It is the opposite. Logistic
# regression is not collapsible, so a covariate this strong (phyloP coefficient ~2.12) AMPLIFIES
# the other coefficient by ~65% when it is genuinely independent. Landing at ~0% therefore
# requires real sharing, and the amount of sharing it requires (rho ~0.085) is close to the
# correlation actually measured (rho ~0.065). The two agree, so the picture is consistent and
# the original conclusion was backwards.
r4_unconditional_refit:
  coef_unconditional_within: {value: 0.2915, tol: 0.020}
  coef_conditional_within:   {value: 0.3067, tol: 0.020}
  # Raw attenuation is near zero AND flips sign between the two standardisations (+0.024
  # pooled, -0.052 within). That instability is itself a reason it was never a safe headline.
  max_abs_raw_attenuation:   0.10
  # The null, twice, by independent routes. If the simulation and the closed form disagree,
  # one of them is broken and the interpretation rests on nothing. The first attempt at this
  # simulation WAS broken -- it drew the covariate from the label, making it a collider, and
  # reported -1.5% instead of -68% -- which would have reproduced the retracted conclusion.
  null_attenuation_simulated: {value: -0.684, tol: 0.060}
  null_attenuation_analytic:  {value: -0.599, tol: 0.060}
  null_sim_analytic_max_gap:  0.15
  # THE CLAIM. Both standardisations must show a large positive excess over the null, and the
  # correlation the attenuation implies must land near the correlation measured directly.
  min_excess_attenuation:    0.50
  implied_rho:               {value: 0.0842, tol: 0.020}
  measured_rho:              {value: 0.0640, tol: 0.015}
  max_implied_measured_gap:  0.040
