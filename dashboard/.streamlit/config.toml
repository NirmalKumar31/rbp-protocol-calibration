# The palette in rbp_dashboard/theme.py was validated for colour-vision separation and contrast
# against a white surface. Pinning the theme light keeps the surface it was validated against.
# A dark variant would need its own steps re-checked, not an inverted copy.
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
