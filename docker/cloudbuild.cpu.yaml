# Cloud Build config for the CPU image.
#
# Built here rather than locally because there is no Docker on the dev machine, and because
# a cloud build is logged, reproducible and runs on a clean host every time -- no chance of
# a stale local layer sneaking into the image.
steps:
  # Pull the previous image so its layers can be reused as cache. Without this every build
  # reinstalls every dependency from scratch, turning a 40-second rebuild into 3 minutes and
  # eating the free build-minute allowance.
  - name: gcr.io/cloud-builders/docker
    id: pull-cache
    entrypoint: bash
    args:
      - -c
      - docker pull ${_IMAGE}:latest || echo "no cache yet, first build"

  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --cache-from=${_IMAGE}:latest
      - -t=${_IMAGE}:latest
      - -t=${_IMAGE}:${_GIT_SHA}
      - --build-arg=GIT_SHA=${_GIT_SHA}
      - --build-arg=BUILD_ID=${BUILD_ID}
      - -f=docker/Dockerfile.cpu
      - .

  # THE GATE. The test suite runs inside the image that was just built. If the cloud
  # environment differs from the laptop in any way that matters, this is where it surfaces
  # -- before any data is processed and before a single cent of compute is spent on it.
  #
  # test_models.py is excluded HERE ONLY because it needs torch, which this image
  # deliberately does not carry. It runs in the GPU image instead, so every test still runs
  # somewhere. Excluding it silently would be the wrong move: the count below is asserted so
  # a test disappearing for any other reason fails the build.
  - name: gcr.io/cloud-builders/docker
    id: test
    args:
      - run
      - --rm
      - '${_IMAGE}:${_GIT_SHA}'
      - python
      - -m
      - pytest
      - tests/
      # THE CPU IMAGE HAS NO TORCH, BY DESIGN -- it is 1.2 GB against the GPU image's 6 GB,
      # and 374 preprocessing tasks should not pull CUDA they never use. So every test that
      # reaches torch, directly or transitively, has to be excluded here.
      #
      # test_train_folds.py is transitive and was missed for exactly that reason: it imports
      # rbp.train.data for one helper, and that module imports torch at line 10. The original
      # CPU image predates the test, so this gate has been failing since the day it was
      # added and nobody rebuilt the image to find out.
      - --ignore=tests/unit/test_models.py
      - --ignore=tests/unit/test_train_folds.py
      - -q
      - --tb=short

  # Asserts the expected number of tests actually ran. A suite that silently collects fewer
  # tests than expected still exits 0, so "the gate passed" would be meaningless without it.
  - name: gcr.io/cloud-builders/docker
    id: test-count
    entrypoint: bash
    args:
      - -c
      - |
        n=$(docker run --rm ${_IMAGE}:${_GIT_SHA} python -m pytest tests/ \
              --ignore=tests/unit/test_models.py \
              --ignore=tests/unit/test_train_folds.py --collect-only 2>/dev/null \
              | grep -oE '^[0-9]+ tests collected' | grep -oE '^[0-9]+')
        echo "collected $$n tests (floor ${_EXPECTED_TESTS})"
        # A FLOOR, NOT AN EQUALITY. The point of this gate is "the image can run the suite
        # and the suite did not silently shrink"; an exact count also fails every time a
        # test is ADDED, which punishes the right behaviour and trains people to edit the
        # expected number until it goes green. Under-collection is the failure worth
        # catching, and a floor catches it.
        if [ "$$n" -lt "${_EXPECTED_TESTS}" ]; then
          echo "FAIL: collected $$n tests, below the floor of ${_EXPECTED_TESTS}"
          exit 1
        fi

  # Push explicitly, BEFORE recording the digest.
  #
  # Cloud Build's `images:` block pushes only after every step has finished, so an earlier
  # version of the record step below queried an image that was not in the registry yet and
  # printed an empty digest. Pushing here makes the ordering explicit instead of relying on
  # a block that runs last.
  - name: gcr.io/cloud-builders/docker
    id: push
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_IMAGE}:${_GIT_SHA}
        docker push ${_IMAGE}:latest

  # Record the immutable digest. A tag can be moved to point at a different image; a digest
  # cannot. Jobs reference the digest, so "which image produced this result?" always has an
  # answer -- which is the whole point of recording image_digest in the BigQuery schema.
  - name: gcr.io/cloud-builders/gcloud
    id: record-digest
    entrypoint: bash
    args:
      - -c
      - |
        digest=$(gcloud artifacts docker images describe ${_IMAGE}:${_GIT_SHA} \
                   --format='value(image_summary.digest)')
        if [ -z "$$digest" ]; then echo "FAIL: could not resolve digest"; exit 1; fi
        echo "$$digest" > /workspace/cpu_digest.txt
        gsutil -q cp /workspace/cpu_digest.txt gs://${_ARTIFACTS}/images/cpu_digest.txt
        echo "CPU image digest: $$digest"
        echo "pin jobs to: ${_IMAGE}@$$digest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8   # faster build, still inside the free daily allowance

# 40 minutes, not 20. Building pyBigWig from source against libcurl adds a compile step that
# a wheel install did not have, and the first attempt hit the old 1200s ceiling and was killed
# as TIMEOUT -- which looks like a hang rather than a limit. The build is cached after the
# first success, so this ceiling is only reached when the dependency layer actually changes.
timeout: 2400s

substitutions:
  # NOTE ON $PROJECT_ID BELOW. Cloud Build does NOT recursively expand a user-defined
  # substitution's DEFAULT value, so writing `_IMAGE: .../$PROJECT_ID/rbp/cpu` here passes
  # the literal string through and docker rejects it: "repository name must be lowercase",
  # because `$PROJECT_ID` contains capitals. These defaults are therefore only a hint; the
  # real values are passed by run.sh with --substitutions, where they are concrete.
  _IMAGE: us-central1-docker.pkg.dev/$PROJECT_ID/rbp/cpu
  # 460 total minus the 34 in test_models.py, which needs torch and runs in the GPU image.
  # A FLOOR. Set below the current count so adding tests never breaks the build, but high
  # enough that a collection error (which silently drops whole files) fails it.
  _EXPECTED_TESTS: '400'
  _GIT_SHA: unknown        # overridden by the caller with the real commit SHA
  _ARTIFACTS: $PROJECT_ID-artifacts
