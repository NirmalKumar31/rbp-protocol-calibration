[project]
name = "rbp"
version = "0.1.0"
description = "RNA-binding-protein binding prediction and conservation-controlled variant evaluation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pyfaidx>=0.8",
    "pyBigWig>=0.3.22",
    "torch>=2.2",
    "transformers>=4.40",
    "multimolecule>=0.0.5",
    "peft>=0.10",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs model downloads or large data",
    "net: needs network access",
]
