[project]
name = "rbp"
version = "1.0.2"
# THE DESCRIPTION NAMED THE PREVIOUS STUDY. It read "conservation-controlled variant
# evaluation", which is what this code was built for and is not what the paper reports; an
# external review noticed before any reader did. Package metadata is the one description that
# travels to PyPI, to Zenodo and into a citation without anyone rereading it.
description = "Negative-set calibration for RNA-binding-protein sequence models: how strongly a model's apparent contribution depends on how its negatives were built"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Nirmalkumar Thirupallikrishnan Kesavan", email = "thirupallikrishnan.n@northeastern.edu" },
]
keywords = ["RNA-binding proteins", "eCLIP", "negative sets", "benchmark calibration",
            "sequence models", "ENCODE"]
classifiers = [
    # STILL NOT Production/Stable, at 1.0.0, and the two are not in conflict. The version
    # identifies the immutable snapshot the paper cites and that a DOI resolves to. The
    # classifier states the support level, and SECURITY.md still says this is not maintained
    # as a library and exposes no supported API. Raising the classifier would promise
    # maintenance nobody has committed to; raising the version promises only that this
    # snapshot exists and will not move.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# UPPER BOUND ON PURPOSE. This was ">=3.11" with no cap while the classifiers stopped at 3.13,
# so the package advertised support for every Python yet to be released, including versions
# that did not exist. The range now equals the classifier list exactly.
#
# WHAT IS ACTUALLY EXERCISED: 3.13, in all four CI jobs and both container images. 3.11 and
# 3.12 are supported by declaration and by the absence of any newer syntax in src/, not by
# test. Stated rather than papered over; adding a matrix job is cheap and is the right fix if
# anyone relies on the minimum as a compatibility guarantee.
requires-python = ">=3.11,<3.14"
# THE NEURAL STACK IS AN EXTRA, NOT A BASE DEPENDENCY, and it used to be a base dependency
# while constraints.txt said in its own header that it "deliberately does NOT pin torch,
# transformers, multimolecule or peft" so as not to "force a large install on a reader who
# only wants to verify". The README's `pip install -e . -c constraints.txt` installed all four
# anyway, unpinned, because a constraints file only constrains what is already being installed.
# Verifying the published numbers needs none of them: docker/requirements-cpu.txt has shipped
# without torch from the beginning and the CPU image runs the suite minus two modules.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pyfaidx>=0.8",
    "pyBigWig>=0.3.22",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]


[project.urls]
Repository = "https://github.com/NirmalKumar31/rbp-protocol-calibration"
Issues = "https://github.com/NirmalKumar31/rbp-protocol-calibration/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "pypdf>=4.0"]
# Reproducing the GPU sweeps, and running tests/unit/test_models.py and test_train_folds.py.
# docker/requirements-gpu.txt is the exact environment; these are the lower bounds.
neural = ["torch>=2.2", "transformers>=4.40", "multimolecule>=0.0.5", "peft>=0.10"]

[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B905 requires an explicit `strict=` on every zip(). It is off, and the reason is that
# turning it on made the code worse rather than safer. An external review reported 193
# violations here, 72 of them B905, and ruff's own fix writes `strict=False` -- which
# preserves behaviour exactly and documents nothing. Applying it produced 72 diffs of pure
# linter-appeasement, including `zip(seq, seq[1:], strict=False)` in the dinucleotide
# shuffler, where the ragged length is the entire point of the expression.
#
# The alternative, `strict=True` everywhere, would assert an invariant that several call
# sites deliberately do not hold, against a pipeline whose 1156 published assertions currently
# pass. Neither option catches a bug that exists.
#
# Everything else the review found IS fixed rather than suppressed: 121 violations across
# E501, I001, B007, B008, B023, E401, E402, E702, E731, E741, F401, F541 and UP031, including
# a 695-character gate list in verify.py and two ternaries long enough to hide their own
# condition. The four B023 sites that remain carry a per-line noqa and a note saying why the
# late binding is safe there and what would make it unsafe.
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs model downloads or large data",
    "net: needs network access",
]
